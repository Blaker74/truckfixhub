<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Panta Welcome Lab | TruckFixHub</title><meta name="theme-color" content="#06172d"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06172d;font-family:system-ui,-apple-system,sans-serif;color:#fff}.lab{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 35%,#19578d,#092c53 48%,#06172d 80%);overflow:hidden}.brand{text-align:center;padding:18px 12px 3px;font-weight:1000;font-style:italic;font-size:clamp(30px,9vw,48px);letter-spacing:-2px;text-shadow:0 3px 0 #000,0 0 18px #299cff}.brand span{color:#4caeff}.tag{text-align:center;font-size:11px;font-weight:900;letter-spacing:.16em;color:#d8e9f7}.stage{position:relative;flex:1;min-height:455px;display:flex;justify-content:center;align-items:flex-end}.halo{position:absolute;width:330px;height:330px;border-radius:50%;background:#4eb5ff3b;filter:blur(40px);top:10%}.android{position:relative;width:310px;height:390px;animation:idle 3.5s ease-in-out infinite;transform-origin:50% 100%}.torso{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:250px;height:225px;border-radius:45% 45% 16% 16%;background:linear-gradient(115deg,#edf4f7 0 19%,#123e6d 20% 38%,#f4f8fa 39% 56%,#0c3159 57% 77%,#b8c9d3 78%);border:2px solid #eaf4fa;box-shadow:inset 0 0 30px #031426aa,0 20px 30px #0008}.chest{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-weight:1000;font-style:italic;font-size:23px;text-shadow:0 2px 4px #000}.chest span{color:#56baff}.core{position:absolute;left:50%;top:108px;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;border:6px solid #d9e5eb;background:radial-gradient(circle,#c5f2ff,#159ee8 28%,#052443 67%);box-shadow:0 0 24px #41baff}.neck{position:absolute;left:50%;top:130px;transform:translateX(-50%);width:70px;height:72px;border-radius:20px;background:repeating-linear-gradient(0deg,#0b2945 0 7px,#89a5b6 8px 11px);border:2px solid #dbe6ec}.head{position:absolute;left:50%;top:16px;transform:translateX(-50%);width:162px;height:148px;border-radius:46% 46% 43% 43%;background:linear-gradient(135deg,#eaf1f5,#839bab 48%,#f8fbfc 60%,#667f91);border:3px solid #e6f0f5;box-shadow:inset 0 -18px 25px #143c5d99,0 12px 25px #0007}.plate{position:absolute;inset:15px 17px 22px;border-radius:45%;background:linear-gradient(145deg,#dce6eb,#91a8b6);border:1px solid #f7fcff}.seam{position:absolute;left:50%;top:7px;width:1px;height:94px;background:#668497}.eyes{position:absolute;top:48px;left:0;right:0;display:flex;justify-content:center;gap:31px}.eye{width:25px;height:16px;border-radius:50%;background:#83e5ff;border:3px solid #123d61;box-shadow:0 0 16px #4ed4ff;animation:blink 5.2s infinite}.mouth{position:absolute;width:40px;height:12px;border-bottom:3px solid #385e73;border-radius:50%;left:50%;top:91px;transform:translateX(-50%)}.jaw{position:absolute;left:35px;right:35px;bottom:13px;height:17px;border-bottom:2px solid #607d8d;border-radius:50%}.ear{position:absolute;top:57px;width:23px;height:39px;border-radius:10px;background:#123f67;border:2px solid #b9ced9;box-shadow:0 0 12px #45baff}.ear.l{left:-15px}.ear.r{right:-15px}.arm{position:absolute;top:186px;width:62px;height:205px;border-radius:28px;background:linear-gradient(90deg,#7891a1,#e8f0f4,#103a63);border:2px solid #d7e3e9;transform-origin:50% 20px}.arm.l{left:2px;transform:rotate(12deg)}.arm.r{right:2px;transform:rotate(-10deg)}.android.wave .arm.r{animation:wave 1.55s ease-in-out}.welcome{position:absolute;z-index:5;top:3px;width:min(510px,92vw);background:#f8fbff;color:#0b2948;border-radius:22px;padding:12px 15px;text-align:center;font-weight:900;font-size:16px;box-shadow:0 12px 28px #0007}.panel{position:relative;z-index:8;background:#f7f9fc;color:#0b2948;border-radius:27px 27px 0 0;padding:16px 18px max(20px,env(safe-area-inset-bottom));box-shadow:0 -10px 32px #0007}.question{text-align:center;font-weight:1000;font-size:19px;margin:0 0 11px}.name{width:100%;border:2px solid #a9c3d8;border-radius:16px;background:#fff;padding:15px 16px;font-size:18px;outline:none;color:#102d4c}.name:focus{border-color:#268de0;box-shadow:0 0 0 3px #268de025}.continue{margin-top:10px;width:100%;border:0;border-radius:17px;background:#e21e26;color:#fff;padding:16px;font-size:20px;font-weight:1000;box-shadow:0 6px 0 #981017,0 10px 20px #0004}.continue:active{transform:translateY(3px);box-shadow:0 3px 0 #981017}.note{text-align:center;color:#637a90;font-size:11px;margin:11px 0 0}.sound{position:absolute;right:13px;top:13px;z-index:9;border:1px solid #71baff;background:#082e56;color:#fff;border-radius:999px;width:42px;height:42px;font-size:18px}@keyframes idle{0%,100%{transform:translateY(0) rotate(.2deg)}50%{transform:translateY(-4px) rotate(-.2deg)}}@keyframes blink{0%,43%,46%,100%{transform:scaleY(1)}44%,45%{transform:scaleY(.08)}}@keyframes wave{0%,100%{transform:rotate(-10deg)}20%{transform:rotate(-73deg) translateY(-30px)}43%{transform:rotate(-48deg) translateY(-35px)}65%{transform:rotate(-75deg) translateY(-31px)}83%{transform:rotate(-48deg) translateY(-22px)}}@media(max-height:760px){.stage{min-height:385px}.android{height:335px;transform:scale(.87);transform-origin:50% 100%}.welcome{font-size:14px}}</style></head><body><main class="lab"><div class="brand">TRUCK<span>FIX</span>HUB</div><div class="tag">KEEPING AMERICA MOVING</div><section class="stage"><button id="sound" class="sound" aria-label="Hear Panta">🔊</button><div id="bubble" class="welcome">Welcome! I’m Panta, your TruckFixHub concierge.</div><div class="halo"></div><div id="panta" class="android"><div class="arm l"></div><div class="arm r"></div><div class="torso"><div class="chest">TRUCK<span>FIX</span>HUB</div><div class="core"></div></div><div class="neck"></div><div class="head"><div class="ear l"></div><div class="ear r"></div><div class="plate"><div class="seam"></div><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth"></div><div class="jaw"></div></div></div></div></section><section class="panel"><p class="question">Before we get started, what’s your name?</p><input id="name" class="name" autocomplete="given-name" maxlength="40" placeholder="Type your first name…"><button id="go" class="continue">CONTINUE →</button><p class="note">Free Panta motion + browser voice prototype · no paid avatar service</p></section></main><script>const p=document.getElementById('panta'),b=document.getElementById('bubble'),n=document.getElementById('name');function wave(){p.classList.remove('wave');void p.offsetWidth;p.classList.add('wave')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.88;u.pitch=1.08;u.volume=.9;const voices=speechSynthesis.getVoices();const preferred=voices.find(v=>/samantha|ava|allison|female|english.*us/i.test(v.name+' '+v.lang))||voices.find(v=>/^en-US/i.test(v.lang));if(preferred)u.voice=preferred;speechSynthesis.speak(u)}function greet(){wave();speak('Good morning. Welcome to Truck Fix Hub. I’m Panta. Before we get started, may I ask your name?')}document.getElementById('sound').onclick=greet;document.getElementById('go').onclick=()=>{const name=n.value.trim();if(!name){b.textContent='May I ask your first name?';n.focus();wave();return}localStorage.setItem('tfh_guest_name',name);b.textContent=`It’s a pleasure to meet you, ${name}. Right this way!`;wave();speak(`It’s a pleasure to meet you, ${name}. Right this way.`);setTimeout(()=>location.href='panta-menu.html',1900)};n.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});</script></body></html>
