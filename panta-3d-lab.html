<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Panta Animatronic Lab | TruckFixHub</title><meta name="theme-color" content="#06172d"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06172d;font-family:system-ui,-apple-system,sans-serif;color:#fff}.lab{min-height:100svh;display:flex;flex-direction:column;background:#06172d;overflow:hidden}.brand{text-align:center;padding:10px 10px 4px;font-weight:1000;font-style:italic;font-size:clamp(30px,9vw,46px);letter-spacing:-2px;text-shadow:0 3px 0 #000,0 0 18px #299cff}.brand span{color:#4caeff}.stage{position:relative;flex:1;min-height:455px;overflow:hidden;background:#07182e;perspective:900px}.panta{position:absolute;inset:-3%;background:url('a_highly_detailed_cinematic_futuristic_sci_fi_we.png') center 42%/cover no-repeat;transform-origin:36% 42%;will-change:transform,filter;animation:idle 5.5s ease-in-out infinite}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#06172d08 0%,transparent 72%,#06172d88 100%);pointer-events:none}.sound{position:absolute;z-index:6;right:14px;top:14px;border:2px solid #72c7ff;background:#08365fee;color:#fff;border-radius:999px;height:46px;padding:0 14px;font-weight:900;font-size:14px;box-shadow:0 5px 18px #0008}.panel{position:relative;z-index:8;background:#f7f9fc;color:#0b2948;border-radius:26px 26px 0 0;padding:14px 18px max(20px,env(safe-area-inset-bottom));box-shadow:0 -10px 32px #0008}.greeting{text-align:center;font-weight:900;font-size:15px;line-height:1.25;color:#36556f;margin:0 0 8px}.question{text-align:center;font-weight:1000;font-size:19px;margin:0 0 10px}.name{width:100%;border:2px solid #a9c3d8;border-radius:16px;background:#fff;padding:15px 16px;font-size:18px;outline:none;color:#102d4c}.continue{margin-top:10px;width:100%;border:0;border-radius:17px;background:#e21e26;color:#fff;padding:16px;font-size:20px;font-weight:1000;box-shadow:0 6px 0 #981017,0 10px 20px #0004}.continue:active{transform:translateY(3px);box-shadow:0 3px 0 #981017}.note{text-align:center;color:#637a90;font-size:10px;margin:10px 0 0}.talking .panta{animation:speaking .7s ease-in-out infinite alternate;filter:brightness(1.035)}.nod .panta{animation:nod .85s ease-in-out}.hello .panta{animation:hello 1.6s ease-in-out}@keyframes idle{0%,100%{transform:scale(1.03) translate3d(0,0,0) rotateZ(0deg)}25%{transform:scale(1.04) translate3d(2px,-2px,0) rotateZ(.15deg)}50%{transform:scale(1.045) translate3d(-2px,-4px,0) rotateZ(-.2deg)}75%{transform:scale(1.04) translate3d(1px,-2px,0) rotateZ(.1deg)}}@keyframes speaking{0%{transform:scale(1.045) translate3d(-2px,-2px,0) rotateZ(-.35deg)}100%{transform:scale(1.055) translate3d(3px,-6px,0) rotateZ(.4deg)}}@keyframes nod{0%,100%{transform:scale(1.04) translateY(0) rotateZ(0)}35%{transform:scale(1.05) translateY(8px) rotateZ(.4deg)}65%{transform:scale(1.05) translateY(-3px) rotateZ(-.25deg)}}@keyframes hello{0%,100%{transform:scale(1.04) translateX(0) rotateZ(0)}30%{transform:scale(1.055) translateX(5px) rotateZ(.8deg)}60%{transform:scale(1.05) translateX(-2px) rotateZ(-.45deg)}}@media(min-width:700px){.stage{min-height:620px}.panta{background-size:contain;background-color:#07182e}}</style></head><body><main class="lab"><div class="brand">TRUCK<span>FIX</span>HUB</div><section id="stage" class="stage"><div id="panta" class="panta" aria-label="Panta, TruckFixHub concierge"></div><div class="shade"></div><button id="sound" class="sound">🔊 MEET PANTA</button></section><section class="panel"><p id="greeting" class="greeting">Welcome! I’m Panta, your TruckFixHub concierge.</p><p class="question">Before we get started, what’s your name?</p><input id="name" class="name" autocomplete="given-name" maxlength="40" placeholder="Type your first name…"><button id="go" class="continue">CONTINUE →</button><p class="note">Free interactive Panta prototype · tap MEET PANTA to hear her</p></section></main><script>const stage=document.getElementById('stage'),g=document.getElementById('greeting'),n=document.getElementById('name');function motion(c,ms){stage.classList.remove('nod','hello');void stage.offsetWidth;stage.classList.add(c);setTimeout(()=>stage.classList.remove(c),ms)}function speak(text,done){if(!('speechSynthesis'in window)){done&&done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.84;u.pitch=1.04;u.volume=.95;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/samantha|ava|allison|female/i.test(v.name))||vs.find(v=>/^en-US/i.test(v.lang))||null;u.onstart=()=>stage.classList.add('talking');u.onend=()=>{stage.classList.remove('talking');motion('nod',850);done&&done()};u.onerror=()=>stage.classList.remove('talking');speechSynthesis.speak(u)}document.getElementById('sound').onclick=()=>{motion('hello',1600);setTimeout(()=>speak('Good morning. Welcome to Truck Fix Hub. I’m Panta. Before we get started, may I ask your name?'),350)};document.getElementById('go').onclick=()=>{const name=n.value.trim();if(!name){g.textContent='May I ask your first name?';n.focus();motion('nod',850);return}localStorage.setItem('tfh_guest_name',name);g.textContent=`It’s a pleasure to meet you, ${name}. Right this way!`;motion('hello',1600);setTimeout(()=>speak(`It’s a pleasure to meet you, ${name}. Right this way.`,()=>setTimeout(()=>location.href='panta-menu.html',500)),250);setTimeout(()=>{if(location.pathname.includes('panta-3d-lab'))location.href='panta-menu.html'},6000)};n.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});let tx=0,ty=0;stage.addEventListener('pointermove',e=>{if(stage.classList.contains('talking'))return;const r=stage.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*4;ty=((e.clientY-r.top)/r.height-.5)*2;document.getElementById('panta').style.transform=`scale(1.045) translate(${tx}px,${ty}px)`});stage.addEventListener('pointerleave',()=>document.getElementById('panta').style.transform='');</script></body></html>
