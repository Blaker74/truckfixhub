<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Panta Welcome Lab | TruckFixHub</title><meta name="theme-color" content="#06172d"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06172d;font-family:system-ui,-apple-system,sans-serif;color:#fff}.lab{min-height:100svh;display:flex;flex-direction:column;background:#06172d;overflow:hidden}.brand{text-align:center;padding:12px 10px 5px;font-weight:1000;font-style:italic;font-size:clamp(30px,9vw,46px);letter-spacing:-2px;text-shadow:0 3px 0 #000,0 0 18px #299cff}.brand span{color:#4caeff}.stage{position:relative;flex:1;min-height:440px;overflow:hidden;background:#07182e}.panta{position:absolute;inset:0;background:url('a_highly_detailed_cinematic_futuristic_sci_fi_we.png') center 42%/cover no-repeat;animation:alive 6s ease-in-out infinite;transform-origin:50% 55%}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#06172d22 0%,transparent 55%,#06172d99 100%);pointer-events:none}.speech{position:absolute;z-index:5;left:50%;top:12px;transform:translateX(-50%);width:min(520px,92vw);background:#ffffffee;color:#102d4c;border:2px solid #72c7ff;border-radius:20px;padding:11px 52px 11px 14px;text-align:center;font-weight:900;box-shadow:0 8px 28px #0008;backdrop-filter:blur(8px)}.sound{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:#0b4d80;color:#fff;border-radius:50%;width:38px;height:38px;font-size:17px}.panel{position:relative;z-index:8;background:#f7f9fc;color:#0b2948;border-radius:26px 26px 0 0;padding:15px 18px max(20px,env(safe-area-inset-bottom));box-shadow:0 -10px 32px #0008}.question{text-align:center;font-weight:1000;font-size:19px;margin:0 0 10px}.name{width:100%;border:2px solid #a9c3d8;border-radius:16px;background:#fff;padding:15px 16px;font-size:18px;outline:none;color:#102d4c}.name:focus{border-color:#268de0;box-shadow:0 0 0 3px #268de025}.continue{margin-top:10px;width:100%;border:0;border-radius:17px;background:#e21e26;color:#fff;padding:16px;font-size:20px;font-weight:1000;box-shadow:0 6px 0 #981017,0 10px 20px #0004}.continue:active{transform:translateY(3px);box-shadow:0 3px 0 #981017}.note{text-align:center;color:#637a90;font-size:10px;margin:10px 0 0}.talking .panta{animation:talk 1.2s ease-in-out infinite alternate}@keyframes alive{0%,100%{transform:scale(1.01) translateY(0)}50%{transform:scale(1.025) translateY(-3px)}}@keyframes talk{0%{transform:scale(1.02) translateY(0)}100%{transform:scale(1.035) translateY(-4px)}}@media(min-width:700px){.stage{min-height:620px}.panta{background-size:contain;background-color:#07182e}}</style></head><body><main class="lab"><div class="brand">TRUCK<span>FIX</span>HUB</div><section id="stage" class="stage"><div class="panta" aria-label="Panta, TruckFixHub concierge"></div><div class="shade"></div><div id="bubble" class="speech">Welcome! I’m Panta, your TruckFixHub concierge.<button id="sound" class="sound" aria-label="Hear Panta">🔊</button></div></section><section class="panel"><p class="question">Before we get started, what’s your name?</p><input id="name" class="name" autocomplete="given-name" maxlength="40" placeholder="Type your first name…"><button id="go" class="continue">CONTINUE →</button><p class="note">Free animated Panta prototype · no paid avatar service</p></section></main><script>const stage=document.getElementById('stage'),b=document.getElementById('bubble'),n=document.getElementById('name');function speak(text,done){if(!('speechSynthesis'in window)){done&&done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.86;u.pitch=1.06;u.volume=.92;const voices=speechSynthesis.getVoices();const preferred=voices.find(v=>/samantha|ava|allison|female/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang));if(preferred)u.voice=preferred;u.onstart=()=>stage.classList.add('talking');u.onend=()=>{stage.classList.remove('talking');done&&done()};u.onerror=()=>stage.classList.remove('talking');speechSynthesis.speak(u)}document.getElementById('sound').onclick=()=>speak('Good morning. Welcome to Truck Fix Hub. I’m Panta. Before we get started, may I ask your name?');document.getElementById('go').onclick=()=>{const name=n.value.trim();if(!name){b.childNodes[0].nodeValue='May I ask your first name? ';n.focus();return}localStorage.setItem('tfh_guest_name',name);b.childNodes[0].nodeValue=`It’s a pleasure to meet you, ${name}. Right this way! `;speak(`It’s a pleasure to meet you, ${name}. Right this way.`,()=>location.href='panta-menu.html');setTimeout(()=>{if(location.pathname.includes('panta-3d-lab'))location.href='panta-menu.html'},5000)};n.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});</script></body></html>
