<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Panta 3D Lab | TruckFixHub</title><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07182e;font-family:system-ui,-apple-system,sans-serif;color:#fff}.lab{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 28%,#1b5b96,#0b3768 45%,#07182e 78%)}header{text-align:center;padding:14px 12px 4px}header img{width:min(360px,82vw);max-height:110px;object-fit:contain}header p{margin:0;color:#cfe0ef;font-size:12px;font-weight:800;letter-spacing:.08em}.stage{position:relative;flex:1;min-height:430px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}.halo{position:absolute;width:300px;height:300px;border-radius:50%;background:#5da9e955;filter:blur(35px);top:16%;left:50%;transform:translateX(-50%)}.body{position:relative;width:min(320px,78vw);height:390px;animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 100%}.torso{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:235px;height:230px;border-radius:48% 48% 20% 20%;background:linear-gradient(120deg,#cbd7df 0 17%,#183d64 18% 37%,#e6edf2 38% 53%,#0b2f55 54% 74%,#b9c7d1 75%);border:2px solid #d8e3ea;box-shadow:inset 0 0 30px #07182eaa,0 16px 30px #0007}.core{position:absolute;left:50%;top:83px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:7px solid #cddbe5;background:radial-gradient(circle,#9be0ff 0 12%,#157ac0 32%,#06182e 68%);box-shadow:0 0 25px #54bfff}.neck{position:absolute;left:50%;top:127px;transform:translateX(-50%);width:72px;height:75px;border-radius:25px;background:linear-gradient(90deg,#8298aa,#e1e9ee,#6c8294);border:2px solid #dce5eb}.head{position:absolute;left:50%;top:20px;transform:translateX(-50%);width:158px;height:145px;border-radius:48% 48% 45% 45%;background:linear-gradient(135deg,#e8eef2,#91a6b6 45%,#f5f8fa 58%,#7890a3);border:3px solid #dce7ed;box-shadow:inset 0 -14px 25px #28476388,0 10px 25px #0007}.face{position:absolute;inset:18px 18px 25px;border-radius:48%;background:linear-gradient(#dce6ec,#a7bac7);border:1px solid #f6fbff}.eyes{position:absolute;top:48px;left:0;right:0;display:flex;justify-content:center;gap:32px}.eye{width:24px;height:15px;border-radius:50%;background:#74d9ff;border:3px solid #163d60;box-shadow:0 0 14px #55cfff;animation:blink 5.5s infinite}.mouth{position:absolute;width:38px;height:11px;border-bottom:3px solid #456579;border-radius:50%;left:50%;top:88px;transform:translateX(-50%)}.ear{position:absolute;top:62px;width:21px;height:36px;border-radius:10px;background:#173e63;border:2px solid #a9bdca}.ear.l{left:-14px}.ear.r{right:-14px}.arm{position:absolute;top:188px;width:64px;height:205px;border-radius:30px;background:linear-gradient(90deg,#8297a7,#dbe4e9,#173d62);border:2px solid #cad8e1;transform-origin:50% 20px}.arm.l{left:4px;transform:rotate(10deg)}.arm.r{right:4px;transform:rotate(-10deg)}.body.wave .arm.r{animation:wave 1.6s ease-in-out}.bubble{position:absolute;z-index:4;top:10px;left:50%;transform:translateX(-50%);width:min(520px,92vw);background:#fff;color:#102a49;border-radius:22px;padding:13px 16px;text-align:center;font-size:17px;font-weight:900;box-shadow:0 10px 25px #0006}.controls{position:relative;z-index:5;background:#fff;color:#102a49;border-radius:24px 24px 0 0;padding:14px;box-shadow:0 -8px 30px #0005}.controls h2{font-size:15px;margin:0 0 9px;text-align:center}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.buttons button{border:0;border-radius:14px;padding:12px 7px;background:#0b3768;color:#fff;font-weight:900}.buttons button.primary{background:#e52525}.small{text-align:center;color:#60758b;font-size:11px;margin:10px 0 0}@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.006)}}@keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}@keyframes wave{0%,100%{transform:rotate(-10deg)}20%{transform:rotate(-75deg) translateY(-35px)}40%{transform:rotate(-48deg) translateY(-38px)}60%{transform:rotate(-78deg) translateY(-35px)}80%{transform:rotate(-48deg) translateY(-25px)}}@media(max-height:720px){.stage{min-height:360px}.body{height:345px;transform:scale(.88);transform-origin:50% 100%}}</style></head><body><main class="lab"><header><img src="truckfixhub-logo.png" alt="TruckFixHub"><p>PANTA 3D LAB · PRIVATE PROTOTYPE</p></header><section class="stage"><div class="halo"></div><div id="bubble" class="bubble">Good morning! Welcome to TruckFixHub. I’m Panta. How can I help you today?</div><div id="panta" class="body"><div class="arm l"></div><div class="arm r"></div><div class="torso"><div class="core"></div></div><div class="neck"></div><div class="head"><div class="ear l"></div><div class="ear r"></div><div class="face"><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth"></div></div></div></div></section><section class="controls"><h2>Animation test</h2><div class="buttons"><button id="hello">👋 Greet</button><button id="way" class="primary">Right this way</button><button id="menu">✨ Panta Menu</button></div><p class="small">No paid 3D service is being used. This isolated lab does not replace the live homepage.</p></section></main><script>const p=document.getElementById('panta'),b=document.getElementById('bubble');function wave(text){b.textContent=text;p.classList.remove('wave');void p.offsetWidth;p.classList.add('wave')}hello.onclick=()=>wave('Welcome to TruckFixHub! I’m Panta. What can I help you with?');way.onclick=()=>{wave('Absolutely. Right this way!');setTimeout(()=>location.href='panta-menu.html',1300)};menu.onclick=()=>location.href='panta-menu.html';</script></body></html>
