<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ask Panta | TruckFixHub</title><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#102a49;font:17px/1.4 system-ui,-apple-system,sans-serif}.wrap{max-width:650px;margin:auto;padding:16px 14px 60px}.panta{background:#0b3768;color:#fff;border-radius:26px;padding:20px;text-align:center}.panta img{width:100px;height:100px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid #fff}.panta h1{margin:8px 0 2px}.panta p{margin:0;color:#dce8f4}.talk,.owner{background:#fff;border:1px solid #c9d6e3;border-radius:22px;padding:18px;margin-top:14px}.bubble{font-size:19px;font-weight:850;color:#0b3768;margin-bottom:12px}.askRow{display:flex;gap:8px}.askRow input{flex:1;min-width:0;padding:13px;border:2px solid #b9c9d9;border-radius:14px;font:inherit}.askRow button{border:0;border-radius:14px;background:#e52525;color:#fff;padding:13px 17px;font-weight:900}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.suggestions button{border:1px solid #c7d4e1;border-radius:14px;background:#f8fbfe;color:#102a49;padding:11px;text-align:left;font-weight:800}.reply{display:none;margin-top:14px;background:#eef4fa;border-radius:16px;padding:14px;font-weight:750}.reply.show{display:block}.go{display:none;margin-top:10px;width:100%;border:0;border-radius:14px;background:#0b3768;color:#fff;padding:13px;font-weight:950}.go.show{display:block}.owner{display:none;border:2px solid #0b3768}.owner.show{display:block}.owner h3{margin:0 0 12px;color:#0b3768}.ownerLinks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ownerLinks a{padding:12px 6px;background:#eef4fa;border-radius:12px;text-align:center;text-decoration:none;color:#0b3768;font-weight:900;font-size:12px}.bottom{text-align:center;color:#60758b;font-size:13px}.menu{display:block;text-align:center;margin:14px auto 0;color:#0b3768;font-weight:900}@media(max-width:440px){.suggestions,.ownerLinks{grid-template-columns:1fr}.askRow{flex-direction:column}}</style></head><body><main class="wrap"><section class="panta"><img src="panta-small.jpg?v=2" alt="Panta"><h1>Ask Panta</h1><p>Tell me what you need. Plain English is just fine.</p></section><section class="talk"><div id="bubble" class="bubble">What can I help you with today?</div><div class="askRow"><input id="ask" maxlength="180" autocomplete="off" placeholder="Example: I need a part for my truck"><button id="send">Ask Panta</button></div><div class="suggestions"><button data-q="I need a part">🔧 I need a part</button><button data-q="My truck needs repair">🛠️ My truck needs repair</button><button data-q="Find me a repair shop">📍 Find me a repair shop</button><button data-q="Show me my VINs">🚛 Show me my VINs</button></div><div id="reply" class="reply"></div><button id="go" class="go">Right this way →</button></section><section id="personalDesk" class="owner"><h3>🔒 Owner Desk</h3><div class="ownerLinks"><a href="https://www.automann.com/customer/account/" target="_blank" rel="noopener">🔩 Automann</a><a href="https://quickserve.cummins.com/qs3/portal/index.html" target="_blank" rel="noopener">⚙️ Cummins QuickServe</a><a href="https://excelerator.com/en/login?redirectTo=%2Fen%2F" target="_blank" rel="noopener">🚚 Excelerator</a></div></section><a class="menu" href="panta-menu.html">← Back to Panta’s menu</a><p class="bottom">People Helping People. Keeping America Moving.</p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm';const db=createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),ask=document.getElementById('ask'),reply=document.getElementById('reply'),go=document.getElementById('go'),bubble=document.getElementById('bubble'),desk=document.getElementById('personalDesk'),name=sessionStorage.getItem('tfh_guest_name')||'';if(name)bubble.textContent='What can I help you with, '+name+'?';let target='';function route(q){const t=q.toLowerCase();if(/part|filter|brake|sensor|gasket|bearing|clamp/.test(t)){target='parts-library.html';return['Absolutely. Let’s head to the Parts Desk and find what you need.',false]}if(/repair|broke|broken|problem|symptom|noise|leak|smoke|code|fault/.test(t)){target='fix-my-truck.html';return['Absolutely. Tell us what the truck is doing and we’ll get the problem organized.',false]}if(/shop|mechanic|dealer|service|near me|nearby/.test(t)){target='truck-repair-shop-directory.html';return['Right this way. Let’s find you some repair help.',false]}if(/vin|truck|garage/.test(t)){target='my-garage.html';return['Right this way. Your saved truck and VIN information is private, so we’ll ask you to sign in before showing it.',true]}if(/customer|account/.test(t)){target='customers.html';return['Certainly. Customer information is private, so we’ll ask you to sign in first.',true]}if(/appointment|schedule|reminder/.test(t)){target='appointments.html';return['Right this way. Your appointments are kept private behind your sign-in.',true]}if(/call note|note|dictat/.test(t)){target='call-notes.html';return['Absolutely. Your call notes may contain private business information, so sign-in is required.',true]}if(/community|people|forum|question/.test(t)){target='community.html';return['Come on in. I’ll take you to the TruckFixHub Community.',false]}if(/fuel|mpg|trip cost/.test(t)){target='trip-fuel-cost-calculator.html';return['Certainly. Let’s estimate your trip fuel cost.',false]}target='panta-menu.html';return['I can help. I’m not completely sure which desk you need, so I’ll show you the simple menu and we’ll get you there.',false]}function submit(q){q=(q||ask.value).trim().replace(/[<>]/g,'');if(!q){reply.textContent='Just tell me what you need in your own words.';reply.classList.add('show');go.classList.remove('show');return}ask.value='';const[r]=route(q);reply.textContent=(name?name+', ':'')+r;reply.classList.add('show');go.classList.add('show')}document.getElementById('send').onclick=()=>submit();ask.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>submit(b.dataset.q));go.onclick=()=>{go.textContent='Right this way!';setTimeout(()=>location.href=target,350)};async function authOwner(session){desk.classList.remove('show');if(!session?.user)return;const r=await db.from('tfh_owner_access').select('user_id').eq('user_id',session.user.id).maybeSingle();if(!r.error&&r.data)desk.classList.add('show')}const s=await db.auth.getSession();await authOwner(s.data.session);db.auth.onAuthStateChange((e,session)=>authOwner(session));</script></body></html>
