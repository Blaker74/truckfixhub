name: Apply TruckFixHub Hospitality
on:
  push:
    branches: [main]
    paths:
      - 'truckfixhub-hospitality.js'
      - '.github/workflows/apply-hospitality.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hospitality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add hospitality layer to public HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='<script src="/truckfixhub-hospitality.js"></script>'
          skip={'ai-assistant.html'}
          changed=[]
          for p in Path('.').glob('*.html'):
              if p.name in skip:
                  continue
              text=p.read_text(encoding='utf-8')
              if 'truckfixhub-hospitality.js' in text:
                  continue
              low=text.lower()
              i=low.rfind('</body>')
              if i<0:
                  continue
              text=text[:i]+tag+text[i:]
              p.write_text(text,encoding='utf-8')
              changed.append(p.name)
          print('Updated',len(changed),'pages')
          print('\n'.join(changed))
          PY
      - name: Commit hospitality rollout
        run: |
          if git diff --quiet; then
            echo "Hospitality already applied."
            exit 0
          fi
          git config user.name "TruckFixHub Panta"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html'
          git commit -m "Roll out Panta hospitality across TruckFixHub"
          git push
