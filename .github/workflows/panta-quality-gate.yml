name: Panta Intelligence Quality Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify quality-gate assets
        shell: bash
        run: |
          set -euo pipefail
          test -f ai-audit-test.html
          test -f rag-retrieval.js
          grep -q 'Panta Quality Gate' ai-audit-test.html
          grep -q '20 real-world heavy-duty diagnostic tests' ai-audit-test.html
          grep -q 'average ≥10/12' ai-audit-test.html
          grep -q 'zero fabricated' ai-audit-test.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ai-audit-test.html').read_text()
          start=s.index('const CASES=[')
          end=s.index('];const DIMS=', start)
          block=s[start:end]
          count=block.count('\",\"')+1
          print(f'Quality-gate diagnostic cases found: {count}')
          if count != 20:
              raise SystemExit(f'Expected 20 diagnostic cases, found {count}')
          PY
      - name: Record automation status
        run: |
          echo 'Static gate integrity: PASS'
          echo 'Live Panta/API execution: BLOCKED until a non-interactive authenticated test identity/secret is configured.'
          echo 'Do not interpret this workflow as a live 20-case model pass.'
