<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Calendar | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.shell{max-width:760px}.intro{text-align:center;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.actions button{min-height:82px;border:4px solid #111;border-radius:18px;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #111}.addbtn{background:#ffd83d}.viewbtn{background:#70e08a}.panel{display:none}.panel.open{display:block}.event{border:3px solid #111;border-radius:18px;padding:14px;margin:10px 0;background:#fff}.event b{font-size:20px}.when{font-weight:900}.delete{background:#d93025!important;color:#fff!important;width:auto!important;padding:8px 12px!important;margin-top:10px}.status{font-weight:900;text-align:center}.past{opacity:.68}.section-label{font-size:22px;font-weight:1000;margin-top:22px}.card h2{text-align:center}@media(max-width:520px){.actions{grid-template-columns:1fr}.actions button{min-height:72px}}</style></head><body><main class="shell"><div class="top"><a href="dashboard.html">← MY TOOLS</a><h1>📅 MY CALENDAR</h1><a href="index.html">HOME</a></div><section class="card"><p class="intro">Save an appointment. See what’s coming up.</p><div class="actions"><button class="addbtn" id="showAdd">➕ ADD EVENT</button><button class="viewbtn" id="showCalendar">📅 VIEW CALENDAR</button></div></section><section class="card panel" id="addPanel"><h2>➕ Add Event</h2><input id="title" placeholder="What is it?"><input id="date" type="date"><input id="time" type="time"><input id="customer" placeholder="Customer / company (optional)"><textarea id="notes" placeholder="Notes (optional)"></textarea><button id="save">SAVE EVENT</button><p id="status" class="status"></p></section><section class="card panel" id="calendarPanel"><h2>📅 My Calendar</h2><div id="upcoming"><p>Loading…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x);let me=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openPanel(id){$('addPanel').classList.toggle('open',id==='addPanel');$('calendarPanel').classList.toggle('open',id==='calendarPanel');if(id==='addPanel')$('title').focus()}$('showAdd').onclick=()=>openPanel('addPanel');$('showCalendar').onclick=()=>openPanel('calendarPanel');function card(e,past){return `<div class="event${past?' past':''}"><b>${esc(e.title)}</b><div class="when">${new Date(e.event_date+'T12:00:00').toLocaleDateString()}${e.event_time?' • '+new Date('2000-01-01T'+e.event_time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):''}</div>${e.customer?'<div>'+esc(e.customer)+'</div>':''}${e.notes?'<div>'+esc(e.notes)+'</div>':''}<button class="delete" onclick="delEvent('${e.id}')">DELETE</button></div>`}async function load(){me=await tfhRequireAuth('calendar.html');if(!me)return;const r=await db.from('tfh_calendar_events').select('*').eq('user_id',me.id).order('event_date',{ascending:true}).order('event_time',{ascending:true,nullsFirst:true});if(r.error){$('upcoming').innerHTML='<p>Could not load calendar: '+esc(r.error.message)+'</p>';return}const today=new Date().toLocaleDateString('en-CA'),future=r.data.filter(e=>e.event_date>=today),past=r.data.filter(e=>e.event_date<today).reverse();$('upcoming').innerHTML='<div class="section-label">Upcoming</div>'+(future.length?future.map(e=>card(e,false)).join(''):'<p>No upcoming events.</p>')+(past.length?'<div class="section-label">Past</div>'+past.map(e=>card(e,true)).join(''):'')}window.delEvent=async id=>{if(!confirm('Delete this event?'))return;const r=await db.from('tfh_calendar_events').delete().eq('id',id).eq('user_id',me.id);if(r.error)return alert(r.error.message);load()};$('save').onclick=async()=>{if(!me)return;const title=$('title').value.trim(),date=$('date').value;if(!title||!date){$('status').textContent='Enter what it is and the date.';return}$('save').disabled=true;$('status').textContent='Saving…';const r=await db.from('tfh_calendar_events').insert({user_id:me.id,title,event_date:date,event_time:$('time').value||null,customer:$('customer').value.trim()||null,notes:$('notes').value.trim()||null});$('save').disabled=false;if(r.error){$('status').textContent='Could not save: '+r.error.message;return}$('status').textContent='✓ Saved.';['title','date','time','customer','notes'].forEach(id=>$(id).value='');await load()};load();</script></body></html>
