<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Calendar | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>.event{border:3px solid #111;border-radius:18px;padding:14px;margin:10px 0;background:#fff}.event b{font-size:20px}.when{font-weight:900}.delete{background:#d93025!important;color:#fff!important;width:auto!important;padding:8px 12px!important;margin-top:10px}.status{font-weight:900;text-align:center}</style></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>📅 CALENDAR</h1><a href="account.html?next=calendar.html">🔐 ACCOUNT</a></div><section class="card"><h2>➕ Add to calendar</h2><input id="title" placeholder="Title"><input id="date" type="date"><input id="time" type="time"><input id="customer" placeholder="Customer / company"><textarea id="notes" placeholder="Notes"></textarea><button id="save">SAVE EVENT</button><p id="status" class="status"></p></section><section class="card"><h2>Upcoming</h2><div id="upcoming"><p>Loading your calendar…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x);let me=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){me=await tfhRequireAuth('calendar.html');if(!me)return;const r=await db.from('tfh_calendar_events').select('*').eq('user_id',me.id).gte('event_date',new Date().toISOString().slice(0,10)).order('event_date').order('event_time');if(r.error){$('upcoming').innerHTML='<p>Could not load calendar: '+esc(r.error.message)+'</p>';return}$('upcoming').innerHTML=r.data.length?r.data.map(e=>`<div class="event"><b>${esc(e.title)}</b><div class="when">${new Date(e.event_date+'T12:00:00').toLocaleDateString()}${e.event_time?' • '+new Date('2000-01-01T'+e.event_time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):''}</div>${e.customer?'<div>'+esc(e.customer)+'</div>':''}${e.notes?'<div>'+esc(e.notes)+'</div>':''}<button class="delete" onclick="delEvent('${e.id}')">DELETE</button></div>`).join(''):'<p>No upcoming events.</p>'}window.delEvent=async id=>{if(!confirm('Delete this event?'))return;const r=await db.from('tfh_calendar_events').delete().eq('id',id).eq('user_id',me.id);if(r.error)return alert(r.error.message);load()};$('save').onclick=async()=>{if(!me)return;const title=$('title').value.trim(),date=$('date').value;if(!title||!date){$('status').textContent='Enter a title and date.';return}$('save').disabled=true;$('status').textContent='Saving…';const r=await db.from('tfh_calendar_events').insert({user_id:me.id,title,event_date:date,event_time:$('time').value||null,customer:$('customer').value.trim()||null,notes:$('notes').value.trim()||null});$('save').disabled=false;if(r.error){$('status').textContent='Could not save: '+r.error.message;return}$('status').textContent='✓ Event saved.';$('title').value='';$('date').value='';$('time').value='';$('customer').value='';$('notes').value='';load()};load();</script></body></html>
