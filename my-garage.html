<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Garage | TruckFixHub</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07182e"><style>body{margin:0;background:#f4f7fb;color:#102a49;font:16px system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:16px 16px 80px}.top{display:flex;justify-content:space-between;margin-bottom:14px}.top a{font-weight:850;color:#123f72;text-decoration:none}.hero,.card{background:#fff;border:1px solid #c8d3df;border-radius:19px;padding:20px;margin-bottom:15px}.hero{background:linear-gradient(145deg,#07182e,#123f72);color:#fff}.hero h1{font-size:clamp(34px,8vw,54px);margin:.08em 0}.grid,.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wide{grid-column:1/-1}label{display:block;font-weight:850;margin:7px 0 5px}input,select,textarea,button,a.btn{box-sizing:border-box;width:100%;padding:12px;border:1px solid #9aabba;border-radius:11px;font:inherit}button,a.btn{border:0;background:#0b3768;color:#fff;font-weight:900;cursor:pointer;text-decoration:none;text-align:center;display:block}.secondary{background:#e8eef5!important;color:#102a49!important}.danger{background:#8a2323!important}.truck{border:2px solid #d1dbe5;border-radius:15px;padding:15px;margin:11px 0}.meta{color:#61758a;font-size:14px}.status,.history{padding:12px;border-radius:12px;background:#edf3f8;margin:10px 0}.history{border-left:4px solid #315e8a}.hide{display:none}.truckphoto{width:100%;max-height:300px;object-fit:cover;border-radius:13px;margin:10px 0}.photoRow{display:flex;gap:8px;align-items:center;margin:10px 0}.photoRow input{flex:1}.workflow{margin-top:10px;padding:12px;background:#fff;border:1px solid #c8d3df;border-radius:12px}.workflow textarea{min-height:72px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#dfe8f2;font-size:12px;font-weight:900;text-transform:uppercase}.roadbar{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#07182ef5;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.roadbar a{color:#fff;text-decoration:none;text-align:center;font-size:11px;font-weight:850}.roadbar b{display:block;font-size:20px}@media(max-width:620px){.grid,.actions{grid-template-columns:1fr}.wide{grid-column:auto}.photoRow{display:block}.photoRow button{margin-top:8px}}</style></head><body><main><nav class="top"><a href="index.html">← TruckFixHub</a><a href="fix-my-truck.html">🚨 I’m Broke Down</a></nav><section class="hero"><div>TRUCKFIXHUB · PRIVATE</div><h1>🚛 My Garage</h1><p>Trucks, VINs and the complete repair workflow in one private place.</p></section><section class="card" id="auth"><h2>Sign in required</h2><p>My Garage is private to your TruckFixHub account.</p><a class="btn" href="index.html">Open My Account</a></section><div id="app" class="hide"><section class="card"><h2>Add a truck</h2><div class="grid"><div><label>Unit number</label><input id="unit"></div><div><label>VIN</label><input id="vin" maxlength="17"></div><div><label>Year</label><input id="year" inputmode="numeric"></div><div><label>Make</label><select id="make"><option>Freightliner</option><option>Peterbilt</option><option>Kenworth</option><option>International</option><option>Western Star</option><option>Mack</option><option>Volvo</option><option>Other</option></select></div><div><label>Model</label><input id="model"></div><div><label>Engine</label><input id="engine"></div><div><label>Engine serial</label><input id="esn"></div><div><label>Mileage</label><input id="mileage" inputmode="numeric"></div><div class="wide"><label>Truck photo</label><input id="newphoto" type="file" accept="image/*"></div><div class="wide"><label>Notes</label><textarea id="notes"></textarea></div></div><button id="add">Save Truck</button><p id="status"></p></section><section class="card"><h2>My Trucks</h2><div id="trucks">Loading…</div></section></div></main><nav class="roadbar"><a href="index.html"><b>⌂</b>Home</a><a href="fix-my-truck.html"><b>🔧</b>Fix</a><a href="truck-repair-shop-directory.html"><b>📍</b>Road Help</a><a href="index.html#community"><b>💬</b>Community</a></nav><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),bucket='tfh-truck-photos',$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>x?Number(x):null;let user=null;async function signed(p){if(!p)return'';const{data}=await sb.storage.from(bucket).createSignedUrl(p,3600);return data?.signedUrl||''}async function upload(f,folder){if(!f)return null;if(f.size>10485760)throw Error('Photo must be 10 MB or smaller.');const ext=(f.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase(),p=user.id+'/'+folder+'/'+crypto.randomUUID()+'.'+ext,{error}=await sb.storage.from(bucket).upload(p,f,{contentType:f.type||'image/jpeg'});if(error)throw error;return p}async function init(){const{data:{session}}=await sb.auth.getSession();user=session?.user||null;$('auth').classList.toggle('hide',!!user);$('app').classList.toggle('hide',!user);if(user)load()}async function load(){const{data,error}=await sb.from('tfh_trucks').select('*').order('created_at',{ascending:false});if(error){$('trucks').textContent=error.message;return}const rows=await Promise.all((data||[]).map(async t=>({...t,url:await signed(t.photo_path)})));$('trucks').innerHTML=rows.length?rows.map(t=>`<article class="truck"><h3>${esc(t.unit_number?'Unit '+t.unit_number:[t.year,t.make,t.model].filter(Boolean).join(' ')||'Saved Truck')}</h3>${t.url?`<img class="truckphoto" src="${esc(t.url)}">`:''}<div class="meta">${esc([t.year,t.make,t.model,t.engine].filter(Boolean).join(' · '))}</div>${t.vin?`<p><b>VIN:</b> ${esc(t.vin)}</p>`:''}${t.engine_serial?`<p><b>ESN:</b> ${esc(t.engine_serial)}</p>`:''}<div class="photoRow"><input id="p-${t.id}" type="file" accept="image/*"><button class="secondary photo" data-id="${t.id}" data-old="${esc(t.photo_path||'')}">📷 Truck Photo</button></div><div class="actions"><a class="btn" href="fix-my-truck.html?truck=${t.id}">🚨 Start Repair Intake</a><button class="secondary hist" data-id="${t.id}">Repair Workflow</button></div><div id="h-${t.id}"></div><button class="danger del" data-id="${t.id}" style="margin-top:10px">Delete Truck</button></article>`).join(''):'<p class="status">No trucks saved yet.</p>';document.querySelectorAll('.hist').forEach(b=>b.onclick=()=>history(b.dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>removeTruck(b.dataset.id));document.querySelectorAll('.photo').forEach(b=>b.onclick=()=>changePhoto(b.dataset.id,b.dataset.old))}async function history(id){const box=$('h-'+id);box.innerHTML='<p>Loading workflow…</p>';const{data,error}=await sb.from('tfh_repair_history').select('id,occurred_at,mileage,fault_code,symptom,diagnosis,repair_performed,parts_used,repair_cost,shop_name,status,shop_response,parts_request,parts_status,completed_at').eq('truck_id',id).order('occurred_at',{ascending:false});if(error){box.textContent=error.message;return}box.innerHTML=(data||[]).length?data.map(r=>`<div class="history"><span class="pill">${esc(r.status)}</span> <b>${new Date(r.occurred_at).toLocaleDateString()}</b>${r.fault_code?`<p><b>Fault:</b> ${esc(r.fault_code)}</p>`:''}${r.symptom?`<p><b>Problem:</b> ${esc(r.symptom)}</p>`:''}<div class="workflow"><label>Repair status</label><select id="st-${r.id}">${['reported','shop_contacted','diagnosing','waiting_parts','repairing','completed'].map(x=>`<option value="${x}" ${r.status===x?'selected':''}>${x.replaceAll('_',' ')}</option>`).join('')}</select><label>Shop / technician response</label><textarea id="sr-${r.id}">${esc(r.shop_response||'')}</textarea><label>Parts request</label><textarea id="pr-${r.id}">${esc(r.parts_request||'')}</textarea><label>Parts status</label><input id="ps-${r.id}" value="${esc(r.parts_status||'')}"><label>Confirmed diagnosis</label><textarea id="dg-${r.id}">${esc(r.diagnosis||'')}</textarea><label>Repair performed / What fixed it?</label><textarea id="rp-${r.id}">${esc(r.repair_performed||'')}</textarea><label>Parts used</label><textarea id="pu-${r.id}">${esc(r.parts_used||'')}</textarea><div class="grid"><div><label>Shop name</label><input id="sn-${r.id}" value="${esc(r.shop_name||'')}"></div><div><label>Repair cost</label><input id="rc-${r.id}" inputmode="decimal" value="${esc(r.repair_cost||'')}"></div></div><button class="saveflow" data-id="${r.id}">Save Repair Workflow</button><p id="msg-${r.id}" class="meta"></p></div></div>`).join(''):'<p class="status">No repair records yet.</p>';box.querySelectorAll('.saveflow').forEach(b=>b.onclick=()=>saveFlow(b.dataset.id))}async function saveFlow(id){const status=$('st-'+id).value,p={status,shop_response:$('sr-'+id).value.trim()||null,parts_request:$('pr-'+id).value.trim()||null,parts_status:$('ps-'+id).value.trim()||null,diagnosis:$('dg-'+id).value.trim()||null,repair_performed:$('rp-'+id).value.trim()||null,parts_used:$('pu-'+id).value.trim()||null,shop_name:$('sn-'+id).value.trim()||null,repair_cost:$('rc-'+id).value?Number($('rc-'+id).value):null,completed_at:status==='completed'?new Date().toISOString():null};const{error}=await sb.from('tfh_repair_history').update(p).eq('id',id);$('msg-'+id).textContent=error?'Could not save: '+error.message:'Repair workflow saved.'}async function changePhoto(id,old){const f=$('p-'+id).files[0];if(!f)return;try{const p=await upload(f,'trucks/'+id),{error}=await sb.from('tfh_trucks').update({photo_path:p}).eq('id',id);if(error)throw error;if(old)await sb.storage.from(bucket).remove([old]);load()}catch(e){$('status').textContent=e.message}}async function removeTruck(id){if(!confirm('Delete this truck? Linked repair records may also be deleted.'))return;const{error}=await sb.from('tfh_trucks').delete().eq('id',id);if(error)$('status').textContent=error.message;else load()}$('add').onclick=async()=>{const btn=$('add');btn.disabled=true;try{const payload={user_id:user.id,unit_number:$('unit').value.trim()||null,vin:$('vin').value.trim().toUpperCase()||null,year:num($('year').value),make:$('make').value,model:$('model').value.trim()||null,engine:$('engine').value.trim()||null,engine_serial:$('esn').value.trim()||null,mileage:num($('mileage').value),notes:$('notes').value.trim()||null},{data,error}=await sb.from('tfh_trucks').insert(payload).select('id').single();if(error)throw error;const f=$('newphoto').files[0];if(f){const p=await upload(f,'trucks/'+data.id),{error:e}=await sb.from('tfh_trucks').update({photo_path:p}).eq('id',data.id);if(e)throw e}$('status').textContent='Truck saved.';load()}catch(e){$('status').textContent=e.message}finally{btn.disabled=false}};init();</script></body></html>
