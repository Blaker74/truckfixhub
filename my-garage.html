<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>My Garage | TruckFixHub</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px system-ui}.w{max-width:900px;margin:auto;padding:16px 16px 90px}.hero,.card{background:#fff;border:1px solid #c8d3df;border-radius:18px;padding:20px;margin:12px 0}.hero{background:#07182e;color:#fff}.grid,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea,button,.btn{width:100%;padding:12px;border:1px solid #9aabba;border-radius:11px;font:inherit}button,.btn{border:0;background:#0b3768;color:#fff;font-weight:900;text-decoration:none;text-align:center}.truck{border-left:5px solid #315e8a}.small{font-size:13px;color:#60758b}.history{background:#edf3f8;border-radius:11px;padding:11px;margin:8px 0}.verified{background:#edf7f0;border-left:4px solid #176b3a}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182e;padding:8px}.nav a{color:#fff;text-align:center;text-decoration:none;font-size:11px}.nav b{display:block;font-size:20px}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="index.html">← Home</a><section class="hero"><h1>🚛 My Garage</h1><p>Permanent truck identity, customer connection and repair history.</p></section><section id="notice" class="card">Checking account…</section><section id="app" hidden><section class="card"><h2>Add Truck</h2><div class="grid"><div><label>Customer / Fleet</label><select id="customer"><option value="">No customer selected</option></select></div><input id="unit" placeholder="Unit number"><input id="vin" maxlength="17" placeholder="VIN"><input id="year" inputmode="numeric" placeholder="Year"><select id="make"><option>Freightliner</option><option>Peterbilt</option><option>Kenworth</option><option>International</option><option>Western Star</option><option>Mack</option><option>Volvo</option><option>Other</option></select><input id="model" placeholder="Model"><input id="engine" placeholder="Engine"><input id="esn" placeholder="Engine serial"><input id="mileage" inputmode="numeric" placeholder="Mileage"></div><textarea id="notes" placeholder="Truck notes"></textarea><button id="add">Save Truck</button><p id="msg" class="small"></p></section><section id="trucks"></section></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="fix-my-truck.html"><b>🚨</b>Repair</a><a href="customers.html"><b>👥</b>Customers</a><a href="appointments.html"><b>📅</b>Schedule</a><a href="my-garage.html"><b>🚛</b>Garage</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_QhBZPjG4w5RZKvEnOQ8q0w_E8zQuk_j'),$=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user,rows=[],customers=[];const cname=id=>{const c=customers.find(x=>x.id===id);return c?(c.company||c.name):''};async function load(){const u=await db.auth.getUser();user=u.data.user;if(!user){$('notice').textContent='Sign in to use your private Garage.';return}const [t,c]=await Promise.all([db.from('tfh_trucks').select('*').order('created_at',{ascending:false}),db.from('tfh_customers').select('id,name,company').order('name')]);rows=t.data||[];customers=c.data||[];$('customer').innerHTML='<option value="">No customer selected</option>'+customers.map(x=>`<option value="${x.id}">${esc(x.company||x.name)}</option>`).join('');$('notice').hidden=true;$('app').hidden=false;render()}function render(){$('trucks').innerHTML=rows.length?rows.map(t=>`<section class="card truck"><h2>${esc(t.unit_number?'Unit '+t.unit_number:[t.year,t.make,t.model].filter(Boolean).join(' ')||'Truck')}</h2>${t.customer_id?`<p><b>👥 ${esc(cname(t.customer_id))}</b></p>`:''}<div class="small">${esc([t.year,t.make,t.model,t.engine].filter(Boolean).join(' · '))}</div>${t.vin?'<p><b>VIN:</b> '+esc(t.vin)+'</p>':''}<div class="actions"><a class="btn" href="fix-my-truck.html?truck=${t.id}">🚨 Start Repair</a><button onclick="history('${t.id}')">📚 Repair History</button></div><div id="h-${t.id}"></div></section>`).join(''):'<section class="card small">No trucks saved yet.</section>'}window.history=async id=>{const box=$('h-'+id);box.textContent='Loading…';const r=await db.from('tfh_repair_jobs').select('id,job_number,status,system_problem,what_fixed_it,repair_verified,created_at').eq('truck_id',id).order('created_at',{ascending:false});box.innerHTML=(r.data||[]).map(j=>`<div class="history ${j.repair_verified?'verified':''}"><b>${j.repair_verified?'✓ Verified Fix':'Repair Job'} #${j.job_number}</b> · ${esc(j.status)}<br>${esc(j.what_fixed_it||j.system_problem||'')}<br><a href="repair-workspace.html?job=${j.id}">Open →</a></div>`).join('')||'<p class="small">No repair history yet.</p>'};$('add').onclick=async()=>{const r=await db.from('tfh_trucks').insert({user_id:user.id,customer_id:$('customer').value||null,unit_number:$('unit').value.trim()||null,vin:$('vin').value.trim().toUpperCase()||null,year:$('year').value?+$('year').value:null,make:$('make').value,model:$('model').value.trim()||null,engine:$('engine').value.trim()||null,engine_serial:$('esn').value.trim()||null,mileage:$('mileage').value?+$('mileage').value:null,notes:$('notes').value.trim()||null}).select().single();if(r.error)return $('msg').textContent=r.error.message;rows.unshift(r.data);$('msg').textContent='✓ Truck saved and linked to customer.';render()};load();</script></body></html>
