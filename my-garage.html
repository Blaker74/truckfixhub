<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>My Garage | TruckFixHub</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px system-ui}.w{max-width:900px;margin:auto;padding:16px 16px 90px}.hero,.card{background:#fff;border:1px solid #c8d3df;border-radius:18px;padding:20px;margin:12px 0}.hero{background:#07182e;color:#fff}.grid,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea,button,.btn{width:100%;padding:12px;border:1px solid #9aabba;border-radius:11px;font:inherit}button,.btn{border:0;background:#0b3768;color:#fff;font-weight:900;text-decoration:none;text-align:center}.truck{border-left:5px solid #315e8a}.small{font-size:13px;color:#60758b}.history{background:#edf3f8;border-radius:11px;padding:11px;margin:8px 0}.verified{background:#edf7f0;border-left:4px solid #176b3a}.vinbox{background:#edf3f8;border-radius:13px;padding:13px;margin:10px 0}.vinrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.vin{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900;letter-spacing:.5px;word-break:break-all}.mini{width:auto;padding:8px 10px;font-size:13px}.danger{background:#fff;color:#a92c2c;border:1px solid #d9a4a4}.edit{background:#edf3f8;color:#123f72}.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:8px}.count{background:#eaf1f7;border-radius:999px;padding:5px 10px;font-size:13px}.search{margin:8px 0}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182e;padding:8px}.nav a{color:#fff;text-align:center;text-decoration:none;font-size:11px}.nav b{display:block;font-size:20px}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}.vinrow{align-items:flex-start;flex-direction:column}.vinrow .mini{width:100%}}</style></head><body><main class="w"><a href="index.html">← Home</a><section class="hero"><h1>🚛 My Garage</h1><p>Your private truck records, VIN list and repair history.</p></section><section id="notice" class="card">Checking account…</section><section id="login" class="card" hidden><h2>🔐 Sign In</h2><input id="loginEmail" type="email" autocomplete="email" placeholder="Email" style="margin-bottom:8px"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" style="margin-bottom:8px"><button id="signin">Sign In</button><p id="loginmsg" class="small"></p></section><section id="app" hidden><section class="card"><div class="sectiontitle"><h2>🔐 My VIN List</h2><span id="vincount" class="count">0 trucks</span></div><p class="small">Your original private TruckFixHub truck/VIN list plus any new Garage trucks.</p><input id="vinsearch" class="search" placeholder="Search company, truck number or VIN"><div id="vinlist"></div></section><section class="card"><h2 id="formtitle">➕ Add Truck</h2><input id="editId" type="hidden"><div class="grid"><div><label>Customer / Fleet</label><select id="customer"><option value="">No customer selected</option></select></div><input id="unit" placeholder="Unit number"><input id="vin" maxlength="17" autocapitalize="characters" placeholder="VIN"><input id="year" inputmode="numeric" placeholder="Year"><select id="make"><option>Freightliner</option><option>Peterbilt</option><option>Kenworth</option><option>International</option><option>Western Star</option><option>Mack</option><option>Volvo</option><option>Other</option></select><input id="model" placeholder="Model"><input id="engine" placeholder="Engine"><input id="esn" placeholder="Engine serial"><input id="mileage" inputmode="numeric" placeholder="Mileage"></div><textarea id="notes" placeholder="Truck notes"></textarea><div class="actions"><button id="add">Save Truck</button><button id="cancel" class="edit" hidden>Cancel Edit</button></div><p id="msg" class="small"></p></section><section id="trucks"></section></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="fix-my-truck.html"><b>🚨</b>Repair</a><a href="customers.html"><b>👥</b>Customers</a><a href="appointments.html"><b>📅</b>Schedule</a><a href="my-garage.html"><b>🚛</b>Garage</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),$=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user,rows=[],legacy=[],customers=[];const cname=id=>{const c=customers.find(x=>x.id===id);return c?(c.company||c.name):''};async function loadData(){const [t,c,l]=await Promise.all([db.from('tfh_trucks').select('*').order('created_at',{ascending:false}),db.from('tfh_customers').select('id,name,company').order('name'),db.from('tfh_private_lists').select('entries').eq('list_kind','trucks').maybeSingle()]);if(t.error||c.error||l.error){$('notice').hidden=false;$('notice').textContent='Could not load your Garage: '+(t.error?.message||c.error?.message||l.error?.message||'');return}rows=t.data||[];legacy=Array.isArray(l.data?.entries)?l.data.entries:[];customers=c.data||[];$('customer').innerHTML='<option value="">No customer selected</option>'+customers.map(x=>`<option value="${x.id}">${esc(x.company||x.name)}</option>`).join('');$('notice').hidden=true;$('login').hidden=true;$('app').hidden=false;render()}async function load(){try{const u=await db.auth.getUser();user=u.data.user;if(!user){$('notice').hidden=true;$('login').hidden=false;return}await loadData()}catch(e){$('notice').hidden=true;$('login').hidden=false;$('loginmsg').textContent='Could not check your session. Please sign in.'}}
function allVins(){const a=legacy.map((t,i)=>({source:'original',id:t.id||'legacy-'+i,company:t.company||'',unit_number:t.number||'',vin:t.vin||''}));const seen=new Set(a.map(x=>String(x.vin||'').toUpperCase()+'|'+String(x.unit_number||'').toUpperCase()));rows.forEach(t=>{const k=String(t.vin||'').toUpperCase()+'|'+String(t.unit_number||'').toUpperCase();if(!seen.has(k))a.push({...t,source:'garage'});});return a}
function renderVinList(){const q=$('vinsearch').value.trim().toLowerCase(),all=allVins(),a=all.filter(t=>!q||[t.company,t.unit_number,t.vin,t.make,t.model,t.engine].some(v=>String(v||'').toLowerCase().includes(q)));$('vincount').textContent=all.length+' truck'+(all.length===1?'':'s');$('vinlist').innerHTML=a.length?a.map(t=>`<div class="vinbox"><div><b>${esc(t.company||'')}${t.company&&t.unit_number?' · ':''}${esc(t.unit_number?'Truck '+t.unit_number:'Truck')}</b></div>${t.vin?`<div class="vinrow"><span class="vin">${esc(t.vin)}</span><button class="mini" onclick="copyVin('${esc(t.vin)}')">📋 Copy VIN</button></div>`:'<div class="small">No VIN entered</div>'}<div class="small">${t.source==='original'?'Original TruckFixHub list':esc([t.year,t.make,t.model,t.engine].filter(Boolean).join(' · '))}</div></div>`).join(''):'<p class="small">No matching trucks found.</p>'}
function render(){renderVinList();$('trucks').innerHTML=rows.length?rows.map(t=>`<section class="card truck"><h2>${esc(t.unit_number?'Unit '+t.unit_number:[t.year,t.make,t.model].filter(Boolean).join(' ')||'Truck')}</h2>${t.customer_id?`<p><b>👥 ${esc(cname(t.customer_id))}</b></p>`:''}<div class="small">${esc([t.year,t.make,t.model,t.engine].filter(Boolean).join(' · '))}</div>${t.vin?'<p><b>VIN:</b> <span class="vin">'+esc(t.vin)+'</span></p>':''}${t.engine_serial?'<p><b>Engine Serial:</b> '+esc(t.engine_serial)+'</p>':''}${t.mileage!=null?'<p><b>Mileage:</b> '+esc(t.mileage)+'</p>':''}<div class="actions"><a class="btn" href="fix-my-truck.html?truck=${t.id}">🚨 Start Repair</a><button onclick="history('${t.id}')">📚 Repair History</button><button class="edit" onclick="editTruck('${t.id}')">✏️ Edit Truck</button><button class="danger" onclick="deleteTruck('${t.id}')">🗑 Delete Truck</button></div><div id="h-${t.id}"></div></section>`).join(''):'<section class="card small">Your original VIN list is shown above. Add a Garage truck below when you want full repair-history features.</section>'}
$('vinsearch').oninput=renderVinList;window.copyVin=async v=>{try{await navigator.clipboard.writeText(v);alert('VIN copied: '+v)}catch(_){prompt('Copy VIN:',v)}};window.history=async id=>{const box=$('h-'+id);box.textContent='Loading…';const r=await db.from('tfh_repair_jobs').select('id,job_number,status,system_problem,what_fixed_it,repair_verified,created_at').eq('truck_id',id).order('created_at',{ascending:false});box.innerHTML=(r.data||[]).map(j=>`<div class="history ${j.repair_verified?'verified':''}"><b>${j.repair_verified?'✓ Verified Fix':'Repair Job'} #${j.job_number}</b> · ${esc(j.status)}<br>${esc(j.what_fixed_it||j.system_problem||'')}<br><a href="repair-workspace.html?job=${j.id}">Open →</a></div>`).join('')||'<p class="small">No repair history yet.</p>'};function clearForm(){$('editId').value='';$('customer').value='';$('unit').value='';$('vin').value='';$('year').value='';$('make').value='Freightliner';$('model').value='';$('engine').value='';$('esn').value='';$('mileage').value='';$('notes').value='';$('formtitle').textContent='➕ Add Truck';$('add').textContent='Save Truck';$('cancel').hidden=true}window.editTruck=id=>{const t=rows.find(x=>x.id===id);if(!t)return;$('editId').value=t.id;$('customer').value=t.customer_id||'';$('unit').value=t.unit_number||'';$('vin').value=t.vin||'';$('year').value=t.year||'';$('make').value=t.make||'Freightliner';$('model').value=t.model||'';$('engine').value=t.engine||'';$('esn').value=t.engine_serial||'';$('mileage').value=t.mileage??'';$('notes').value=t.notes||'';$('formtitle').textContent='✏️ Edit Truck';$('add').textContent='Save Changes';$('cancel').hidden=false;$('formtitle').scrollIntoView({behavior:'smooth',block:'start'})};$('cancel').onclick=clearForm;window.deleteTruck=async id=>{const t=rows.find(x=>x.id===id);if(!t||!confirm('Delete '+(t.unit_number?'Unit '+t.unit_number:'this truck')+' from My Garage? Repair history will not be deleted.'))return;const r=await db.from('tfh_trucks').delete().eq('id',id).eq('user_id',user.id);if(r.error){alert('Could not delete truck: '+r.error.message);return}rows=rows.filter(x=>x.id!==id);if($('editId').value===id)clearForm();render()};$('add').onclick=async()=>{const vin=$('vin').value.trim().toUpperCase();if(vin&&vin.length!==17){$('msg').textContent='VIN should be 17 characters.';return}const data={user_id:user.id,customer_id:$('customer').value||null,unit_number:$('unit').value.trim()||null,vin:vin||null,year:$('year').value?+$('year').value:null,make:$('make').value,model:$('model').value.trim()||null,engine:$('engine').value.trim()||null,engine_serial:$('esn').value.trim()||null,mileage:$('mileage').value?+$('mileage').value:null,notes:$('notes').value.trim()||null};const id=$('editId').value;let r=id?await db.from('tfh_trucks').update(data).eq('id',id).eq('user_id',user.id).select().single():await db.from('tfh_trucks').insert(data).select().single();if(r.error){$('msg').textContent=r.error.message;return}if(id)rows=rows.map(x=>x.id===id?r.data:x);else rows.unshift(r.data);clearForm();render()};$('signin').onclick=async()=>{if(!$('loginEmail').value.trim()||!$('loginPassword').value){$('loginmsg').textContent='Enter your email and password.';return}$('loginmsg').textContent='Signing in…';$('signin').disabled=true;try{const r=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(r.error){$('loginmsg').textContent='Sign in failed: '+r.error.message;return}user=r.data.user;$('loginPassword').value='';await loadData()}catch(e){$('loginmsg').textContent=e.message||'Sign in failed. Please try again.'}finally{$('signin').disabled=false}};load();</script></body></html>
