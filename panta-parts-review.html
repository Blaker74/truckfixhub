<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panta Parts Review | TruckFixHub</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#102a49;font:16px/1.4 system-ui,-apple-system,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.head{background:#0b3768;color:white;border-radius:22px;padding:20px}.card{background:white;border:1px solid #c9d6e3;border-radius:18px;padding:16px;margin-top:14px}.tag{display:inline-block;background:#fff3cd;color:#725800;border-radius:999px;padding:5px 9px;font-weight:800;font-size:12px}.nums{font-size:20px;font-weight:900;margin:10px 0}.meta{color:#60758b;font-size:14px}.source{word-break:break-all}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:900}.approve{background:#18794e;color:white}.reject{background:#c62828;color:white}.empty{padding:30px;text-align:center}.back{display:block;text-align:center;margin:20px;color:#0b3768;font-weight:900;text-decoration:none}</style></head><body><main class="wrap"><section class="head"><h1>🔧 Panta Parts Review</h1><p>Candidate cross-references stay out of Panta’s verified brain until you approve them.</p></section><div id="list"><div class="card empty">Loading research candidates…</div></div><a class="back" href="panta-menu.html">← Back to Panta’s menu</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm';const db=createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),list=document.getElementById('list');let session=(await db.auth.getSession()).data.session;if(!session){location.replace('panta-sign-in.html?next=panta-parts-review.html');throw new Error('sign in required')}async function load(){const own=await db.from('tfh_owner_access').select('user_id').eq('user_id',session.user.id).maybeSingle();if(own.error||!own.data){list.innerHTML='<div class="card empty">Owner access required.</div>';return}const r=await db.from('panta_part_research_candidates').select('*').eq('review_status','pending').order('created_at',{ascending:true});if(r.error){list.innerHTML='<div class="card empty">Could not load candidates.</div>';return}if(!r.data.length){list.innerHTML='<div class="card empty">🎉 No pending parts candidates right now.</div>';return}list.innerHTML='';for(const x of r.data){const c=document.createElement('section');c.className='card';c.innerHTML=`<span class="tag">PENDING REVIEW</span><div class="nums">${esc(x.requested_brand||'')} ${esc(x.requested_part_number)} → ${esc(x.candidate_brand||'')} ${esc(x.candidate_part_number)}</div><div class="meta"><b>Relationship:</b> ${esc(x.relationship)}<br><b>Application:</b> ${esc(x.application||'Not supplied')}<br><b>Source type:</b> ${esc(x.source_type)}<br><b>Notes:</b> ${esc(x.notes||'None')}<br><b>Evidence:</b> <a class="source" href="${safeUrl(x.source_reference)}" target="_blank" rel="noopener">Open source ↗</a></div><div class="actions"><button class="reject">Reject</button><button class="approve">Approve Verified Cross</button></div>`;c.querySelector('.approve').onclick=()=>review(x.id,true);c.querySelector('.reject').onclick=()=>review(x.id,false);list.appendChild(c)}}async function review(id,ok){if(ok&&!confirm('Approve this cross-reference as VERIFIED Panta knowledge?'))return;if(!ok&&!confirm('Reject this candidate?'))return;const fn=ok?'approve_panta_part_candidate':'reject_panta_part_candidate';const r=await db.rpc(fn,{p_candidate_id:id});if(r.error){alert(r.error.message);return}await load()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function safeUrl(v){try{const u=new URL(String(v));return u.protocol==='https:'?u.href:'#'}catch{return'#'}}await load();</script></body></html>
