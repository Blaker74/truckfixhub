<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.wrap{max-width:760px;margin:auto;padding:14px}.home{display:inline-block;padding:12px 16px;background:#fff;border:3px solid #111;border-radius:14px;color:#111;text-decoration:none;font-weight:1000}.card{background:#fff;border:5px solid #1769aa;border-radius:24px;padding:18px;margin-top:14px}.card h1{text-align:center;font-size:clamp(30px,7vw,44px);margin:0 0 8px}.card>p{text-align:center;font-size:19px;font-weight:800}.searchrow{display:flex;gap:8px;margin:18px 0}.searchrow input{flex:1;min-width:0;border:4px solid #111;border-radius:16px;padding:15px;font-size:20px}.searchrow button{background:#ffd83d;border:4px solid #111;border-radius:16px;padding:10px 20px;font-size:21px;font-weight:1000}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{min-height:62px;border:3px solid #111;border-radius:15px;font-size:17px;font-weight:1000;background:#e9f5ff}.result{border:3px solid #111;border-radius:16px;padding:14px;margin:12px 0;background:#fff}.result a{font-size:20px;font-weight:1000;color:#111}.result p{margin:6px 0}.empty{text-align:center;font-weight:900;padding:20px}.community{display:block;margin-top:18px;text-align:center;background:#70e08a;border:4px solid #111;border-radius:18px;padding:15px;color:#111;text-decoration:none;font-size:19px;font-weight:1000}@media(max-width:520px){.card{padding:12px}.searchrow{display:grid}.searchrow button{min-height:55px}}</style></head><body><main class="wrap"><a class="home" href="index.html">← HOME</a><section class="card"><h1>🔎 Find It</h1><p>Type the system, symptom, or fault-code help you need.</p><div class="searchrow"><input id="q" placeholder="Example: low boost, air brakes, SPN FMI"><button id="go">FIND IT</button></div><div class="quick"><button data-q="fault code">⚠️ Fault Code</button><button data-q="electrical">⚡ Electrical</button><button data-q="air brakes">💨 Air Brakes</button><button data-q="wheel end">🛞 Wheel End</button></div><div id="results"></div><a class="community" href="community.html">🤝 Can’t find it? Ask the Community</a></section></main><script>const pages=[['fault-code-diagram.html','Fault Codes','SPN FMI code warning check engine fault diagnostic'],['engine-diagram.html','Engine','engine no start low power smoke overheating compression control'],['electrical-diagram.html','Electrical','electrical power fuse relay wiring connector ground voltage'],['lighting-diagram.html','Lighting','light lamp led headlight marker turn signal flicker fuse'],['air-brake-diagram.html','Air & Brakes','air brake compressor dryer governor tank valve chamber leak slow build'],['wheel-end-diagram.html','Wheel Ends','wheel end hub bearing seal hot hub oil leak growl'],['cooling-diagram.html','Cooling','coolant overheating radiator thermostat water pump fan pressure bubbles'],['emissions-diagram.html','Emissions','dpf doc scr def nox regen aftertreatment derate'],['starting-charging-diagram.html','Starting & Charging','battery starter alternator no crank slow crank charging voltage'],['drivetrain-diagram.html','Drivetrain','driveshaft u joint vibration clunk driveline'],['suspension-steering-diagram.html','Steering & Suspension','steering wander tie rod kingpin suspension alignment clunk'],['air-suspension-diagram.html','Air Suspension','air suspension bag height control valve ride height leak low'],['fuel-system-diagram.html','Fuel System','fuel filter injector rail pressure hard start contamination water'],['hvac-diagram.html','HVAC','hvac ac air conditioning heat heater blower vents compressor'],['turbo-air-diagram.html','Turbo & Charge Air','turbo boost charge air cac low power whistle black smoke boot clamp'],['transmission-diagram.html','Transmission','transmission shift gear slip output noise fluid'],['clutch-diagram.html','Clutch','clutch slip release engagement pedal chatter grabbing'],['fifth-wheel-diagram.html','Fifth Wheel','fifth wheel kingpin jaws lock release coupling'],['trailer-diagram.html','Trailer','trailer brakes lights landing gear running gear coupling'],['wheel-tire-diagram.html','Wheels & Tires','wheel tire tread pressure vibration wear flat leak'],['rear-axle-differential-diagram.html','Rear Axle & Differential','rear axle differential pinion ring gear howl whine gear oil'],['diagnostic-diagrams.html','All Diagnostic Diagrams','all systems visual diagnostic diagrams'],['diagnostic.html','Diagnose My Truck','truck problem symptom diagnose help'],['community.html','TruckFixHub Community','community ask question truck help']];const input=document.getElementById('q'),out=document.getElementById('results');function run(){const q=input.value.trim().toLowerCase();if(!q){out.innerHTML='';return}const terms=q.split(/\s+/).filter(t=>t.length>1);const scored=pages.map(p=>{const hay=(p[1]+' '+p[2]).toLowerCase();return [p,terms.reduce((n,t)=>n+(hay.includes(t)?1:0),0)]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);out.innerHTML=scored.length?scored.map(p=>`<div class="result"><a href="${p[0]}">${p[1]}</a><p>${p[2]}</p></div>`).join(''):`<div class="empty">No direct visual match yet.<br><br>Try a simpler system name or ask the community.</div>`}document.getElementById('go').onclick=run;input.addEventListener('keydown',e=>{if(e.key==='Enter')run()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;run()});const start=new URLSearchParams(location.search).get('q');if(start){input.value=start;run()}else input.focus();</script></body></html>
