<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search TruckFixHub heavy-duty truck diagnostic guides by symptom or system. Find simple visual help for no crank, low boost, overheating, air brakes, DPF, vibration, tire wear and more."><title>Heavy-Duty Truck Diagnostic Search | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.wrap{max-width:760px;margin:auto;padding:14px}.home{display:inline-block;padding:12px 16px;background:#fff;border:3px solid #111;border-radius:14px;color:#111;text-decoration:none;font-weight:1000}.card{background:#fff;border:5px solid #1769aa;border-radius:24px;padding:18px;margin-top:14px}.card h1{text-align:center;font-size:clamp(30px,7vw,44px);margin:0 0 8px}.card>p{text-align:center;font-size:19px;font-weight:800}.searchrow{display:flex;gap:8px;margin:18px 0}.searchrow input{flex:1;min-width:0;border:4px solid #111;border-radius:16px;padding:15px;font-size:20px}.searchrow button{background:#ffd83d;border:4px solid #111;border-radius:16px;padding:10px 20px;font-size:21px;font-weight:1000}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{min-height:62px;border:3px solid #111;border-radius:15px;font-size:17px;font-weight:1000;background:#e9f5ff}.result{border:3px solid #111;border-radius:16px;padding:14px;margin:12px 0;background:#fff}.result a{font-size:20px;font-weight:1000;color:#111}.result p{margin:6px 0;font-weight:700}.result small{font-weight:800;color:#444}.empty{text-align:center;font-weight:900;padding:20px}.hint{text-align:center;font-size:14px!important;color:#444;margin:12px 0 0}.community{display:block;margin-top:18px;text-align:center;background:#70e08a;border:4px solid #111;border-radius:18px;padding:15px;color:#111;text-decoration:none;font-size:19px;font-weight:1000}@media(max-width:520px){.card{padding:12px}.searchrow{display:grid}.searchrow button{min-height:55px}}</style></head><body><main class="wrap"><a class="home" href="index.html">← HOME</a><section class="card"><h1>🔎 Find It</h1><p>Tell us what the truck is doing.</p><div class="searchrow"><input id="q" aria-label="Search diagnostic guides" placeholder="Example: no crank, low boost, overheating"><button id="go">FIND IT</button></div><div class="quick"><button data-q="fault code">⚠️ Fault Code</button><button data-q="no crank">🔋 No Crank</button><button data-q="low boost">💨 Low Boost</button><button data-q="air leak">🛑 Air Leak</button></div><p class="hint">Searches TruckFixHub’s visual diagnostic guides — not a parts catalog.</p><div id="results" aria-live="polite"></div><a class="community" href="community.html">🤝 Can’t find it? Ask the Community</a></section></main><script>const pages=[
['fault-code-diagram.html','⚠️ Fault Codes','SPN + FMI: understand what the code is reporting.','spn fmi fault code warning check engine cel diagnostic active inactive j1939'],
['engine-diagram.html','⚙️ Engine','No-start, low power, smoke and engine-running problems.','engine crank no start wont start low power smoke rough run misfire compression control'],
['electrical-diagram.html','⚡ Electrical','Power, fuses, relays, wiring, connectors and grounds.','electrical power fuse relay wiring connector ground voltage short open intermittent dead circuit'],
['lighting-diagram.html','💡 Lighting','Lights out, dim, flickering or blowing fuses.','light lights lamp led headlight marker clearance tail turn signal flicker dim fuse blowing'],
['air-brake-diagram.html','💨 Air & Brakes','Slow air build, air loss and brake-system problems.','air brake brakes compressor dryer governor tank reservoir valve chamber leak air leak slow build low air pressure'],
['wheel-end-diagram.html','🛞 Wheel Ends','Hub heat, bearing noise, looseness and seal leaks.','wheel end hub bearing seal hot hub oil leak growl rumble loose wheel movement'],
['cooling-diagram.html','🌡️ Cooling','Overheating, coolant loss, pressure and circulation.','coolant cooling overheating overheat hot radiator thermostat water pump fan pressure bubbles coolant loss leak'],
['emissions-diagram.html','♻️ Emissions','DPF, DOC, SCR, DEF, NOx, regen and derate concerns.','dpf doc scr def nox regen regeneration aftertreatment derate soot emissions exhaust'],
['starting-charging-diagram.html','🔋 Starting & Charging','No crank, slow crank, dead batteries and charging faults.','battery batteries starter alternator no crank wont crank slow crank charging voltage dead battery click clicking'],
['drivetrain-diagram.html','🔩 Drivetrain','Driveshaft vibration, U-joints, clunks and torque-transfer problems.','driveshaft drive shaft u joint ujoint vibration clunk driveline slip joint torque'],
['suspension-steering-diagram.html','🛞 Steering & Suspension','Wandering, hard steering, clunks and uneven tire wear.','steering wander wandering pull pulling tie rod kingpin suspension alignment clunk hard steering loose steering tire wear'],
['air-suspension-diagram.html','🎈 Air Suspension','Air bags, ride height, height-control valves and suspension leaks.','air suspension air bag air bags height control valve ride height leak low leaning dump valve suspension low'],
['fuel-system-diagram.html','⛽ Fuel System','Hard start, low power, fuel restriction and pressure concerns.','fuel filter injector injectors rail pressure hard start no start low power contamination water restriction air in fuel'],
['hvac-diagram.html','❄️ HVAC','A/C not cold, no heat, weak airflow and vent problems.','hvac ac a/c air conditioning not cold warm no heat heater blower weak airflow vents compressor evaporator condenser'],
['turbo-air-diagram.html','💨 Turbo & Charge Air','Low boost, boost leaks, whistle, black smoke and charge-air problems.','turbo boost low boost underboost charge air cac intercooler low power whistle black smoke boot clamp hose leak boost leak oil turbo piping'],
['transmission-diagram.html','⚙️ Transmission','Bad shifts, no engagement, transmission noise and leaks.','transmission shift shifting gear wont go into gear no gear slip slipping output noise fluid oil leak hard shift'],
['clutch-diagram.html','🦶 Clutch','Clutch slip, release trouble, chatter, grabbing and noise.','clutch slip slipping release engagement pedal chatter grabbing noise hard to shift hard shifting'],
['fifth-wheel-diagram.html','🚛 Fifth Wheel','Coupling, kingpin, jaws, locking, release and excess movement.','fifth wheel kingpin jaws lock release coupling trailer wont lock wont release movement lubrication'],
['trailer-diagram.html','🚚 Trailer','Trailer air, electrical, running gear and coupling/body problems.','trailer brakes trailer lights landing gear running gear coupling dog track dog tracking tire wear trailer air abs trailer electrical'],
['wheel-tire-diagram.html','🛞 Wheels & Tires','Vibration, tire wear, air loss and hot wheel concerns.','wheel wheels tire tires tread pressure vibration uneven wear flat air loss leak hot wheel tire wear cupping'],
['rear-axle-differential-diagram.html','⚙️ Rear Axle & Differential','Whine, howl, clunks, gear-oil leaks and no-drive problems.','rear axle differential pinion ring gear howl whine clunk gear oil leak no drive axle shaft'],
['diagnostic-diagrams.html','🧩 All Diagnostic Diagrams','Browse every TruckFixHub visual diagnostic system.','all systems visual diagnostic diagrams browse guides'],
['diagnostic.html','🔧 Diagnose My Truck','Start with the truck system giving you trouble.','truck problem symptom diagnose help troubleshooting where start'],
['community.html','🤝 TruckFixHub Community','Ask truck people when the guides do not cover your problem.','community ask question truck help mechanic technician advice']];
const input=document.getElementById('q'),out=document.getElementById('results');
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function run(){const raw=input.value.trim();if(!raw){out.innerHTML='';return}const q=normalize(raw);const terms=q.split(/\s+/).filter(t=>t.length>1);const scored=pages.map(p=>{const hay=normalize(p[1]+' '+p[2]+' '+p[3]);let score=0;if(hay.includes(q))score+=8;terms.forEach(t=>{if(hay.includes(t))score+=1});return[p,score]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);out.innerHTML=scored.length?scored.map((p,i)=>`<div class="result"><a href="${p[0]}">${p[1]}</a><p>${p[2]}</p>${i===0?'<small>BEST MATCH</small>':''}</div>`).join(''):`<div class="empty">No direct visual match yet.<br><br>Try the main system name — like engine, brakes, electrical, cooling or transmission — or ask the community.</div>`}
document.getElementById('go').onclick=run;input.addEventListener('keydown',e=>{if(e.key==='Enter')run()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;run()});const start=new URLSearchParams(location.search).get('q');if(start){input.value=start;run()}else input.focus();</script></body></html>
