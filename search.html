<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.wrap{max-width:760px;margin:auto;padding:14px}.home{display:inline-block;padding:12px 16px;background:#fff;border:3px solid #111;border-radius:14px;color:#111;text-decoration:none;font-weight:1000}.card{background:#fff;border:5px solid #1769aa;border-radius:24px;padding:18px;margin-top:14px}.card h1{text-align:center;font-size:clamp(30px,7vw,44px);margin:0 0 8px}.card>p{text-align:center;font-size:19px;font-weight:800}.searchrow{display:flex;gap:8px;margin:18px 0}.searchrow input{flex:1;min-width:0;border:4px solid #111;border-radius:16px;padding:15px;font-size:20px}.searchrow button{background:#ffd83d;border:4px solid #111;border-radius:16px;padding:10px 20px;font-size:21px;font-weight:1000}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{min-height:62px;border:3px solid #111;border-radius:15px;font-size:17px;font-weight:1000;background:#e9f5ff}.result{border:3px solid #111;border-radius:16px;padding:14px;margin:12px 0;background:#fff}.result a{font-size:20px;font-weight:1000;color:#111}.result p{margin:6px 0}.empty{text-align:center;font-weight:900;padding:20px}.community{display:block;margin-top:18px;text-align:center;background:#70e08a;border:4px solid #111;border-radius:18px;padding:15px;color:#111;text-decoration:none;font-size:19px;font-weight:1000}@media(max-width:520px){.card{padding:12px}.searchrow{display:grid}.searchrow button{min-height:55px}}</style></head><body><main class="wrap"><a class="home" href="index.html">← HOME</a><section class="card"><h1>🔎 Find It</h1><p>Type what you know. A fault code, part number, or truck problem is enough.</p><div class="searchrow"><input id="q" placeholder="Example: SPN 4364 FMI 18"><button id="go">FIND IT</button></div><div class="quick"><button data-q="fault code">⚠️ Fault Code</button><button data-q="electrical">⚡ Electrical</button><button data-q="air brakes">💨 Air Brakes</button><button data-q="wheel end">🛞 Wheel End</button></div><div id="results"></div><a class="community" href="community.html">🤝 Can’t find it? Ask the Community</a></section></main><script>const pages=[['diagnostic.html','Diagnose My Truck','Start with the symptom or system giving you trouble.'],['diagnostic-diagrams.html','Diagnostic Diagrams','Simple visual paths for truck systems and fault codes.'],['community.html','TruckFixHub Community','Ask other truck people for help.'],['about.html','About TruckFixHub','Learn what TruckFixHub is built to do.']];const input=document.getElementById('q'),out=document.getElementById('results');function run(){const q=input.value.trim().toLowerCase();if(!q){out.innerHTML='';return}const terms=q.split(/\s+/);const matches=pages.filter(p=>terms.some(t=>(p[1]+' '+p[2]).toLowerCase().includes(t)));out.innerHTML=matches.length?matches.map(p=>`<div class="result"><a href="${p[0]}?q=${encodeURIComponent(q)}">${p[1]}</a><p>${p[2]}</p></div>`).join(''):`<div class="empty">We don’t have a direct match yet.<br><br>Try the diagnostic tools below or ask the community.</div>`}document.getElementById('go').onclick=run;input.addEventListener('keydown',e=>{if(e.key==='Enter')run()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;run()});const start=new URLSearchParams(location.search).get('q');if(start){input.value=start;run()}else input.focus();</script></body></html>
