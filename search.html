<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search TruckFixHub heavy-duty truck diagnostic guides by symptom or system. Find simple visual help for no crank, low boost, overheating, air brakes, DPF, vibration, tire wear and more."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://truckfixhub.com/search.html"><title>Heavy-Duty Truck Diagnostic Search | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.wrap{max-width:760px;margin:auto;padding:14px}.home{display:inline-block;padding:12px 16px;background:#fff;border:3px solid #111;border-radius:14px;color:#111;text-decoration:none;font-weight:1000}.card{background:#fff;border:5px solid #1769aa;border-radius:24px;padding:18px;margin-top:14px}.card h1{text-align:center;font-size:clamp(30px,7vw,44px);margin:0 0 8px}.card>p{text-align:center;font-size:19px;font-weight:800}.searchrow{display:flex;gap:8px;margin:18px 0}.searchrow input{flex:1;min-width:0;border:4px solid #111;border-radius:16px;padding:15px;font-size:20px}.searchrow button{background:#ffd83d;border:4px solid #111;border-radius:16px;padding:10px 20px;font-size:21px;font-weight:1000}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{min-height:62px;border:3px solid #111;border-radius:15px;font-size:17px;font-weight:1000;background:#e9f5ff}.result{border:3px solid #111;border-radius:16px;padding:14px;margin:12px 0;background:#fff}.result a{font-size:20px;font-weight:1000;color:#111}.result p{margin:6px 0;font-weight:700}.result small{font-weight:800;color:#444}.understood{background:#fff7c7;border:3px solid #111;border-radius:14px;padding:10px 12px;margin:12px 0;font-weight:900;text-align:center}.empty{text-align:center;font-weight:900;padding:20px}.hint{text-align:center;font-size:14px!important;color:#444;margin:12px 0 0}.knowledge{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.knowledge a,.community{border:4px solid #111;border-radius:18px;padding:15px;color:#111;text-decoration:none;font-size:18px;font-weight:1000;text-align:center}.knowledge a:first-child{background:#5fd3ff}.knowledge a:last-child{background:#70e08a}.community{display:block;margin-top:10px;background:#ffd83d}@media(max-width:520px){.card{padding:12px}.searchrow,.knowledge{display:grid}.searchrow button{min-height:55px}}</style></head><body><main class="wrap"><a class="home" href="index.html">← HOME</a><section class="card"><h1>🔎 Find It</h1><p>Say it the way you would say it at the parts counter.</p><div class="searchrow"><input id="q" aria-label="Search diagnostic guides" placeholder="Example: truck won't crank, losing air, no power"><button id="go">FIND IT</button></div><div class="quick"><button data-q="fault code">⚠️ Fault Code</button><button data-q="no crank">🔋 No Crank</button><button data-q="low boost">💨 Low Boost</button><button data-q="air leak">🛑 Air Leak</button></div><p class="hint">Plain English is fine — “won’t crank,” “runs hot,” “losing air,” “shakes at 60,” “won’t regen.”</p><div id="results" aria-live="polite"></div><div class="knowledge"><a href="resources.html">📚 Heavy-Duty Resources</a><a href="what-fixed-it.html">✅ What Fixed It?</a></div><a class="community" href="community.html">🤝 Can’t find it? Ask the Community</a></section></main><script>const pages=[

['emissions-diagram.html','♻️ Emissions','DPF, DOC, SCR, DEF, NOx, regen and derate concerns.','dpf doc scr def nox regen regeneration wont regen will not regen aftertreatment derate soot emissions exhaust parked regen check engine def light'],
['starting-charging-diagram.html','🔋 Starting & Charging','No crank, slow crank, dead batteries and charging faults.','battery batteries starter alternator no crank wont crank will not crank slow crank dragging starter charging voltage dead battery click clicking just clicks no start no turnover wont turn over'],
['drivetrain-diagram.html','🔩 Drivetrain','Driveshaft vibration, U-joints, clunks and torque-transfer problems.','driveshaft drive shaft u joint ujoint vibration vibrates shakes shaking clunk driveline slip joint torque vibration at speed shakes at speed'],
['suspension-steering-diagram.html','🛞 Steering & Suspension','Wandering, hard steering, clunks and uneven tire wear.','steering wander wandering pull pulling tie rod kingpin suspension alignment clunk hard steering loose steering tire wear wears tires dog tracking crooked'],

['hvac-diagram.html','❄️ HVAC','A/C not cold, no heat, weak airflow and vent problems.','hvac ac a/c air conditioning not cold warm blowing warm no heat heater blower weak airflow vents compressor evaporator condenser ac quits ac not working'],
['turbo-air-diagram.html','💨 Turbo & Charge Air','Low boost, boost leaks, whistle, black smoke and charge-air problems.','turbo boost low boost no boost underboost charge air cac intercooler low power no power whistle black smoke boot clamp hose leak boost leak oil turbo piping charge air cooler'],

const aliases=[
[/\b(won'?t|wont|will not|doesn'?t|doesnt) (crank|turn over|turnover)\b/g,' no crank '],
[/\b(just )?(clicks|clicking)\b/g,' no crank starter battery clicking '],
[/\b(runs?|running|getting) hot\b/g,' overheating cooling '],
[/\b(losing|loses|leaking) air\b/g,' air leak low air pressure '],
[/\b(no|low|losing|lost) power\b/g,' low power '],
[/\b(won'?t|wont|will not) regen\b/g,' dpf regen emissions '],
[/\b(shakes?|shaking|vibrates?|vibrating)\b/g,' vibration '],
[/\b(blowing|pushing|losing) coolant\b/g,' coolant loss pressure overheating '],
[/\b(won'?t|wont|will not) shift\b/g,' transmission shifting hard shift '],
[/\b(black|white|blue) smoke\b/g,' smoke engine exhaust '],
[/\b(check engine|engine light|dash code)\b/g,' fault code warning '],
[/\b(ac|a\/c) (warm|hot|not cold|quit|quits)\b/g,' hvac air conditioning not cold ']
];
const input=document.getElementById('q'),out=document.getElementById('results');
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9']+/g,' ').trim()}
function expand(raw){let s=normalize(raw);aliases.forEach(a=>s=s.replace(a[0],a[1]));return normalize(s)}
function run(){const raw=input.value.trim();if(!raw){out.innerHTML='';return}const original=normalize(raw),q=expand(raw),terms=q.split(/\s+/).filter(t=>t.length>1),originalTerms=original.split(/\s+/).filter(t=>t.length>1);const scored=pages.map(p=>{const hay=normalize(p[1]+' '+p[2]+' '+p[3]);let score=0;if(hay.includes(q))score+=12;if(hay.includes(original))score+=10;terms.forEach(t=>{if(hay.includes(t))score+=2});originalTerms.forEach(t=>{if(hay.includes(t))score+=1});return[p,score]}).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);const translated=q!==original?`<div class="understood">👍 I understood: ${q.replace(/\s+/g,' ')}</div>`:'';out.innerHTML=translated+(scored.length?scored.map((p,i)=>`<div class="result"><a href="${p[0]}">${p[1]}</a><p>${p[2]}</p>${i===0?'<small>BEST PLACE TO START</small>':''}</div>`).join(''):`<div class="empty">I don’t have a direct visual match yet.<br><br>Try a simple symptom — like “won’t crank,” “runs hot,” “losing air,” “no power,” or ask the community.</div>`)}
document.getElementById('go').onclick=run;input.addEventListener('keydown',e=>{if(e.key==='Enter')run()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{input.value=b.dataset.q;run()});const start=new URLSearchParams(location.search).get('q');if(start){input.value=start;run()}else input.focus();</script></body></html>
