<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign In | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.shell{max-width:620px}.welcome{text-align:center;background:#fff;border:4px solid #ff8a1c;border-radius:20px;padding:14px;margin:12px 0 16px}.welcome strong{font-size:24px}.card h2{text-align:center;font-size:27px}.card p{text-align:center;font-weight:800}.card input{font-size:18px;border:3px solid #111;border-radius:14px;padding:14px}.card button{min-height:58px;border:3px solid #111;border-radius:14px;font-size:19px;font-weight:1000}.signin{background:#70e08a!important;color:#111!important}.forgot{background:#ffd83d!important;color:#111!important}.create{background:#5fd3ff!important;color:#111!important}.divider{text-align:center;font-weight:1000;font-size:18px;margin:14px 0}.privacy{text-align:center;font-size:14px;font-weight:800;margin:14px}.privacy a{color:#111}.signedbox{text-align:center}.signedbox .go{background:#ff8a1c!important;color:#111!important}.signedbox .out{background:#e21f26!important;color:#fff!important}</style></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>🔐 SIGN IN</h1></div><section class="welcome"><strong>Your private toolbox.</strong><br>Sign in to see your saved trucks, parts, notes, events, and warranties.</section><section class="card" id="signed"><h2>Welcome Back</h2><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="signin">🔐 SIGN IN</button><button id="forgot" class="forgot" style="margin-top:8px">FORGOT PASSWORD?</button><p id="msg" style="font-weight:900"></p></section><div class="divider" id="divider">— OR —</div><section class="card" id="new"><h2>New to TruckFixHub?</h2><p>Create one account for your private tools.</p><input id="newEmail" type="email" autocomplete="email" placeholder="Email"><input id="newPassword" type="password" autocomplete="new-password" placeholder="Create password — 6+ characters"><button id="create" class="create">➕ CREATE ACCOUNT</button></section><p class="privacy">Your private-tool information is tied to your account. <a href="privacy.html">Privacy Policy</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x),next=new URLSearchParams(location.search).get('next')||'dashboard.html';async function already(){const user=await tfhGetUser();if(user){$('signed').classList.add('signedbox');$('signed').innerHTML='<h2>✓ YOU ARE SIGNED IN</h2><p>'+user.email+'</p><p>Your private tools are ready.</p><button id="go" class="go">🔐 OPEN MY TOOLS</button><button id="out" class="out" style="margin-top:8px">SIGN OUT</button>';$('new').hidden=true;$('divider').hidden=true;$('go').onclick=()=>location.href=next;$('out').onclick=tfhSignOut}}$('signin').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('msg').textContent='Enter your email and password.';$('msg').textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email,password});if(error)return $('msg').textContent='Sign in failed: '+error.message;const user=await tfhGetUser();if(!user)return $('msg').textContent='Sign in could not be verified. Please try again.';location.replace(next)};$('create').onclick=async()=>{const email=$('newEmail').value.trim(),password=$('newPassword').value;if(!email||password.length<6)return $('msg').textContent='Use a valid email and a password at least 6 characters long.';$('msg').textContent='Creating account…';const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/account.html?next='+encodeURIComponent(next)}});if(error)return $('msg').textContent='Create account failed: '+error.message;if(data.session)location.replace(next);else $('msg').textContent='Account created. Check your email to confirm it, then sign in.'};$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email)return $('msg').textContent='Enter your email first.';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/account.html'});$('msg').textContent=error?'Reset failed: '+error.message:'Password reset email sent.'};already();</script></body></html>
