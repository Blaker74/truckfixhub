<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Account | TruckFixHub</title><link rel="stylesheet" href="app.css"></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>🔐 MY ACCOUNT</h1></div><section class="card" id="signed"><h2>Sign in</h2><p>One login opens your private TruckFixHub tools on this device.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin">SIGN IN</button><button id="forgot" style="margin-top:8px;background:#ffd83d;color:#111">FORGOT PASSWORD?</button><p id="msg" style="font-weight:900"></p></section><section class="card" id="new"><h2>New here?</h2><input id="newEmail" type="email" autocomplete="email" placeholder="Email"><input id="newPassword" type="password" autocomplete="new-password" placeholder="Create password"><button id="create" class="import">CREATE ACCOUNT</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x),next=new URLSearchParams(location.search).get('next')||'index.html';async function already(){const user=await tfhGetUser();if(user){$('signed').innerHTML='<h2>✓ YOU ARE SIGNED IN</h2><p>'+user.email+'</p><p>Your VINs, parts, call notes, calendar and warranty information are private to this account.</p><button id="go">CONTINUE</button><button id="out" style="margin-top:8px;background:#e21f26">SIGN OUT</button>';$('new').hidden=true;$('go').onclick=()=>location.href=next;$('out').onclick=tfhSignOut}}$('signin').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('msg').textContent='Enter both your email and password.';$('msg').textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email,password});if(error)return $('msg').textContent='Sign in failed: '+error.message;const user=await tfhGetUser();if(!user)return $('msg').textContent='Sign in could not be verified. Please try again.';location.replace(next)};$('create').onclick=async()=>{const email=$('newEmail').value.trim(),password=$('newPassword').value;if(!email||password.length<6)return $('msg').textContent='Use a valid email and a password at least 6 characters long.';$('msg').textContent='Creating account…';const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/account.html?next='+encodeURIComponent(next)}});if(error)return $('msg').textContent='Create account failed: '+error.message;if(data.session)location.replace(next);else $('msg').textContent='Account created. Check your email to confirm it, then sign in.'};$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email)return $('msg').textContent='Enter your email first.';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/account.html'});$('msg').textContent=error?'Reset failed: '+error.message:'Password reset email sent.'};already();</script></body></html>
