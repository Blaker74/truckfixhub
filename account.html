<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Account | TruckFixHub</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#29aaff,#eaf9ff 34%,#d6e4eb);color:#111}.w{max-width:650px;margin:auto;padding:16px}.brand{text-align:center;font-size:42px;font-weight:1000;margin:12px}.brand b{color:#e31c23}.card{background:#fff;border:5px solid #111;border-radius:28px;padding:20px;margin:16px 0;box-shadow:0 7px 0 #657d8b}h1{text-align:center}input,button{width:100%;padding:15px;margin:7px 0;border:3px solid #111;border-radius:15px;font-size:17px}button{font-weight:1000;background:#168fdf;color:#fff}.red{background:#e31c23}.green{background:#159447}.yellow{background:#ffd83d;color:#111}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{font-weight:900;text-align:center;padding:8px}.home{display:block;text-align:center;font-weight:900;color:#075fae;text-decoration:none}.small{text-align:center;font-size:13px;font-weight:700}</style></head><body><main class="w"><div class="brand">Truck<b>Fix</b>Hub</div><a class="home" href="index.html">← HOME</a><section class="card"><h1>🔐 My Account</h1><p class="small">One account unlocks My Trucks, Customers, Repairs, Schedule and Parts Room.</p><div class="tabs"><button id="showLogin" class="red">SIGN IN</button><button id="showSignup" class="green">CREATE ACCOUNT</button></div><div id="login"><input id="email" type="email" autocomplete="email" placeholder="Email address"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="red">🔑 SIGN IN</button><button id="reset" class="yellow">FORGOT PASSWORD?</button></div><div id="signup" hidden><input id="newEmail" type="email" autocomplete="email" placeholder="Email address"><input id="newPassword" type="password" autocomplete="new-password" placeholder="Create password (6+ characters)"><button id="create" class="green">✓ CREATE MY ACCOUNT</button></div><div id="msg" class="msg"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),$=x=>document.getElementById(x),next=new URLSearchParams(location.search).get('next')||'my-garage.html';function mode(signup){$('login').hidden=signup;$('signup').hidden=!signup;$('msg').textContent=''}$('showLogin').onclick=()=>mode(false);$('showSignup').onclick=()=>mode(true);$('signin').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('msg').textContent='Enter your email and password.';$('msg').textContent='Signing in…';const r=await db.auth.signInWithPassword({email,password});if(r.error)return $('msg').textContent='Sign in failed: '+r.error.message;location.href=next};$('create').onclick=async()=>{const email=$('newEmail').value.trim(),password=$('newPassword').value;if(!email||password.length<6)return $('msg').textContent='Enter a valid email and a password at least 6 characters long.';$('msg').textContent='Creating account…';const r=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/account.html?next='+encodeURIComponent(next)}});if(r.error)return $('msg').textContent='Could not create account: '+r.error.message;if(r.data.session)location.href=next;else $('msg').textContent='✓ Account created. Check your email to confirm it, then come back and sign in.'};$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email)return $('msg').textContent='Enter your email first, then tap Forgot Password.';const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/account.html'});$('msg').textContent=r.error?'Could not send reset email: '+r.error.message:'✓ Password reset email sent.'};(async()=>{const r=await db.auth.getUser();if(r.data.user){$('msg').textContent='✓ You are already signed in.';setTimeout(()=>location.href=next,500)}})();</script></body></html>
