<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Customers | TruckFixHub</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px system-ui}.w{max-width:950px;margin:auto;padding:16px 16px 90px}.hero,.card{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:20px;margin:12px 0}.hero{background:linear-gradient(145deg,#07182e,#123f72);color:#fff}.grid,.actions,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stats{grid-template-columns:repeat(4,1fr)}.stat{background:#edf3f8;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}input,textarea,button,a.btn,select{width:100%;padding:12px;border:1px solid #9aabba;border-radius:11px;font:inherit}button,a.btn{border:0;background:#0b3768;color:#fff;text-decoration:none;text-align:center;font-weight:900}.secondary{background:#e8eef5!important;color:#102a49!important}.green{background:#176b3a!important}.small{font-size:13px;color:#60758b}.customer{border-left:5px solid #315e8a}.customer h3{margin:0 0 5px}.detail{display:none}.detail.show{display:block}.item{background:#f6f8fb;border:1px solid #d5dee7;border-radius:12px;padding:12px;margin:8px 0}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182e;padding:8px}.nav a{color:#fff;text-align:center;text-decoration:none;font-size:11px}.nav b{display:block;font-size:20px}@media(max-width:650px){.grid,.actions{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="w"><a href="index.html">← Home</a><section class="hero"><div>PRIVATE BUSINESS WORKSPACE</div><h1>👥 Customer Command Center</h1><p>Customer → Call Notes → Trucks → Appointments → Active Repairs → Parts → Completed & Verified Repairs.</p></section><section id="notice" class="card">Checking your account…</section><section id="login" class="card" hidden><h2>🔐 Sign In</h2><input id="loginEmail" type="email" autocomplete="email" placeholder="Email" style="margin-bottom:8px"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" style="margin-bottom:8px"><button id="signin">Sign In</button><p id="loginmsg" class="small"></p></section><section id="app" hidden><section class="card"><h2>Add Customer</h2><div class="grid"><input id="name" placeholder="Customer / contact name"><input id="company" placeholder="Company / fleet"><input id="phone" type="tel" placeholder="Phone"><input id="email" type="email" placeholder="Email"><input id="address" placeholder="Address / location"><input id="notes" placeholder="Notes"></div><button id="save">＋ Add Customer</button><p id="msg" class="small"></p></section><section class="card"><input id="search" placeholder="Search customer, fleet, phone or email…"></section><div id="list"></div></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="call-notes.html"><b>📞</b>Calls</a><a href="appointments.html"><b>📅</b>Schedule</a><a href="customers.html"><b>👥</b>Customers</a><a href="my-garage.html"><b>🚛</b>Garage</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_QhBZPjG4w5RZKvEnOQ8q0w_E8zQuk_j'),$=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user,customers=[],trucks=[],appts=[],jobs=[],parts=[],calls=[];function filtered(){const q=$('search').value.trim().toLowerCase();return customers.filter(c=>!q||[c.name,c.company,c.phone,c.email].join(' ').toLowerCase().includes(q))}function truckLabel(t){return [t.unit_number&&'Unit '+t.unit_number,t.year,t.make,t.model].filter(Boolean).join(' · ')||'Truck'}function render(){const cs=filtered();$('list').innerHTML=cs.length?cs.map(c=>{const ct=trucks.filter(x=>x.customer_id===c.id),ca=appts.filter(x=>x.customer_id===c.id),cj=jobs.filter(x=>x.customer_id===c.id),cc=calls.filter(x=>x.customer_id===c.id),active=cj.filter(x=>x.status!=='completed'),done=cj.filter(x=>x.status==='completed'),verified=done.filter(x=>x.repair_verified),cp=parts.filter(p=>cj.some(j=>j.id===p.job_id));return `<section class="card customer"><h3>${esc(c.company||c.name)}</h3>${c.company?`<div>${esc(c.name)}</div>`:''}<div class="small">${esc(c.phone||'')}${c.phone&&c.email?' · ':''}${esc(c.email||'')}</div><div class="stats"><div class="stat"><b>${ct.length}</b>Trucks</div><div class="stat"><b>${cc.length}</b>Call Notes</div><div class="stat"><b>${active.length}</b>Active Repairs</div><div class="stat"><b>${verified.length}</b>Verified Fixes</div></div><div class="actions"><button onclick="toggle('${c.id}')">Open Command Center</button>${c.phone?`<a class="btn secondary" href="tel:${esc(c.phone)}">📞 Call</a>`:''}</div><div id="d-${c.id}" class="detail"><h3>📞 Call Notes</h3>${cc.length?cc.slice(0,10).map(n=>`<div class="item"><b>${esc(n.category||'Call')} · ${new Date(n.created_at).toLocaleString()}</b><br>${esc(n.request||n.transcript||'')}${n.next_action?`<br><span class="small"><b>Next:</b> ${esc(n.next_action)}</span>`:''}</div>`).join(''):'<p class="small">No linked call notes yet.</p>'}<div class="actions"><a class="btn" href="call-notes.html">＋ New Call Note</a></div><h3>🚛 Trucks</h3>${ct.length?ct.map(t=>`<div class="item"><b>${esc(truckLabel(t))}</b><br><span class="small">${esc(t.vin||'')}${t.engine?' · '+esc(t.engine):''}</span><div class="actions"><a class="btn" href="fix-my-truck.html?truck=${t.id}">Start Repair</a><a class="btn secondary" href="my-garage.html">Garage</a></div></div>`).join(''):'<p class="small">No trucks linked yet.</p>'}<h3>📅 Upcoming Appointments</h3>${ca.filter(a=>a.status==='scheduled').map(a=>`<div class="item"><b>${esc(a.title)}</b><br>${new Date(a.starts_at).toLocaleString()}${a.location?'<br>'+esc(a.location):''}${a.repair_job_id?`<br><a href="repair-workspace.html?job=${a.repair_job_id}">Open Repair Workspace →</a>`:''}</div>`).join('')||'<p class="small">No upcoming appointments.</p>'}<h3>🔧 Active Repairs</h3>${active.map(j=>`<div class="item"><b>Repair Job #${j.job_number}</b> · ${esc(j.status)}<br><span class="small">${esc(j.unit_number?'Unit '+j.unit_number:'')}${j.system_problem?' · '+esc(j.system_problem):''}</span><br><a href="repair-workspace.html?job=${j.id}">Open Repair Workspace →</a></div>`).join('')||'<p class="small">No active repairs.</p>'}<h3>📦 Parts Activity</h3>${cp.length?cp.slice(0,10).map(p=>`<div class="item"><b>${esc(p.part_number||p.description||'Part')}</b> · ${esc(p.fulfillment_status||'quoted')}<br><span class="small">${esc(p.description||'')}</span></div>`).join(''):'<p class="small">No parts activity.</p>'}<h3>✅ Completed / Verified Repairs</h3>${done.map(j=>`<div class="item"><b>${j.repair_verified?'✓ Verified Fix':'Completed'} · Job #${j.job_number}</b><br>${esc(j.what_fixed_it||j.repair_performed||j.system_problem||'Repair completed')}<br><a href="repair-workspace.html?job=${j.id}">Open history →</a></div>`).join('')||'<p class="small">No completed repairs.</p>'}<h3>Customer Record</h3><div class="small">${esc(c.address||'')}${c.notes?'<br>'+esc(c.notes):''}</div><div class="actions" style="margin-top:10px"><a class="btn green" href="appointments.html">＋ Appointment</a><button class="secondary" onclick="removeCustomer('${c.id}')">Delete Customer</button></div></div></section>`}).join(''):'<section class="card small">No customers found.</section>'}window.toggle=id=>$('d-'+id).classList.toggle('show');$('search').oninput=render;$('save').onclick=async()=>{const name=$('name').value.trim();if(!name)return $('msg').textContent='Customer/contact name is required.';const r=await db.from('tfh_customers').insert({user_id:user.id,name,company:$('company').value.trim()||null,phone:$('phone').value.trim()||null,email:$('email').value.trim()||null,address:$('address').value.trim()||null,notes:$('notes').value.trim()||null}).select().single();if(r.error)return $('msg').textContent='Could not add customer: '+r.error.message;customers.push(r.data);['name','company','phone','email','address','notes'].forEach(x=>$(x).value='');$('msg').textContent='✓ Customer added.';render()};window.removeCustomer=async id=>{if(!confirm('Delete this customer record? Linked trucks, appointments, call notes and repair history will remain but will no longer be attached to this customer.'))return;const r=await db.from('tfh_customers').delete().eq('id',id);if(!r.error){customers=customers.filter(x=>x.id!==id);render()}};async function loadData(){const rs=await Promise.all([db.from('tfh_customers').select('*').order('name'),db.from('tfh_trucks').select('id,customer_id,unit_number,vin,year,make,model,engine'),db.from('tfh_appointments').select('id,customer_id,title,starts_at,status,location,repair_job_id').order('starts_at'),db.from('tfh_repair_jobs').select('id,customer_id,job_number,status,unit_number,system_problem,repair_verified,what_fixed_it,repair_performed,created_at').order('created_at',{ascending:false}),db.from('tfh_repair_job_parts').select('id,job_id,part_number,description,fulfillment_status,created_at').order('created_at',{ascending:false}),db.from('tfh_call_notes').select('id,customer_id,truck_id,category,request,transcript,next_action,status,created_at').order('created_at',{ascending:false})]);if(rs[0].error){$('notice').hidden=false;$('notice').textContent='Could not load customers.';return}[customers,trucks,appts,jobs,parts,calls]=rs.map(r=>r.data||[]);$('notice').hidden=true;$('login').hidden=true;$('app').hidden=false;render()}async function load(){try{const u=await db.auth.getUser();user=u.data.user;if(!user){$('notice').hidden=true;$('login').hidden=false;return}await loadData()}catch(e){$('notice').hidden=true;$('login').hidden=false;$('loginmsg').textContent='Could not check your session. Please sign in.'}}$('signin').onclick=async()=>{if(!$('loginEmail').value.trim()||!$('loginPassword').value){$('loginmsg').textContent='Enter your email and password.';return}$('loginmsg').textContent='Signing in…';$('signin').disabled=true;try{const r=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(r.error){$('loginmsg').textContent='Sign in failed: '+r.error.message;return}user=r.data.user;$('loginPassword').value='';await loadData()}catch(e){$('loginmsg').textContent=e.message||'Sign in failed. Please try again.'}finally{$('signin').disabled=false}};load();</script></body></html>
