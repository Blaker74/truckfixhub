<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>My Customers | TruckFixHub 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px/1.45 system-ui,-apple-system,sans-serif}.w{max-width:900px;margin:auto;padding:16px 16px 90px}.hero,.card{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:20px;margin:12px 0}.hero{background:linear-gradient(145deg,#07182e,#123f72);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{background:#f7f9fc;border:1px solid #d2dce7;border-radius:14px;padding:15px;margin:10px 0}.small{font-size:13px;color:#60758b}input,textarea,button{width:100%;padding:12px;border:1px solid #9aabba;border-radius:11px;font:inherit;margin:4px 0}button,.btn{border:0;background:#0b3768;color:#fff;font-weight:900;text-decoration:none;text-align:center;display:inline-block;padding:10px 12px;border-radius:10px}.secondary{background:#e8eef5;color:#102a49}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button,.actions .btn{width:auto}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182e;padding:8px}.nav a{color:#fff;text-align:center;text-decoration:none;font-size:11px}.nav b{display:block;font-size:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="index.html">← TruckFixHub</a><section class="hero"><div>PRIVATE BUSINESS WORKSPACE</div><h1>👥 My Customers</h1><p>One customer record connects to trucks, repairs and appointments.</p></section><section id="auth" class="card">Checking your account…</section><section id="login" class="card" hidden><h2>🔐 Sign In</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign In</button><p id="loginmsg" class="small"></p></section><section id="app" hidden><section class="card"><h2>Add Customer</h2><div class="grid"><div><label>Name</label><input id="name" placeholder="Contact name"></div><div><label>Company / Fleet</label><input id="company" placeholder="Business name"></div><div><label>Phone</label><input id="phone" inputmode="tel"></div><div><label>Email</label><input id="custemail" type="email"></div></div><label>Address</label><input id="address"><label>Notes</label><textarea id="notes" rows="3"></textarea><button id="add">＋ Save Customer</button><p id="msg" class="small"></p></section><section class="card"><h2>Customer Accounts</h2><input id="search" placeholder="Search name, company, phone, email or notes…"><div id="list"></div></section></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="customers.html"><b>👥</b>Customers</a><a href="my-garage.html"><b>🚛</b>VINs</a><a href="repair-inbox.html"><b>🔔</b>Repairs</a><a href="appointments.html"><b>📅</b>Schedule</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),$=x=>document.getElementById(x);let user,records=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const v=x=>$(x).value.trim();function render(){const q=v('search').toLowerCase(),a=records.filter(x=>!q||[x.name,x.company,x.phone,x.email,x.address,x.notes].join(' ').toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(x=>`<article class="item"><h3>${esc(x.company||x.name)}</h3>${x.company&&x.name?`<b>${esc(x.name)}</b><br>`:''}${x.phone?`📞 ${esc(x.phone)}<br>`:''}${x.email?`✉️ ${esc(x.email)}<br>`:''}${x.address?`📍 ${esc(x.address)}<br>`:''}${x.notes?`<p class="small">${esc(x.notes)}</p>`:''}<div class="actions"><a class="btn" href="my-garage.html?customer=${encodeURIComponent(x.id)}">🚛 Customer Trucks</a><a class="btn secondary" href="fix-my-truck.html?customer=${encodeURIComponent(x.id)}">🔧 New Repair</a><button class="secondary del" data-id="${x.id}">Delete</button></div></article>`).join(''):'<p class="small">No customers saved yet. Add your first customer above.</p>'}async function load(){const r=await db.from('tfh_customers').select('id,name,company,email,phone,address,notes,created_at').eq('user_id',user.id).order('company').order('name');if(r.error){$('auth').hidden=false;$('auth').textContent='Could not load customers: '+r.error.message;return}records=r.data||[];$('auth').hidden=true;$('login').hidden=true;$('app').hidden=false;render()}async function start(){const r=await db.auth.getUser();user=r.data.user;if(!user){$('auth').hidden=true;$('login').hidden=false;return}load()}$('signin').onclick=async()=>{const r=await db.auth.signInWithPassword({email:v('email'),password:$('password').value});if(r.error)return $('loginmsg').textContent='Sign in failed: '+r.error.message;user=r.data.user;load()};$('search').oninput=render;$('add').onclick=async()=>{if(!v('name')&&!v('company'))return $('msg').textContent='Enter a customer name or company.';const r=await db.from('tfh_customers').insert({user_id:user.id,name:v('name')||v('company'),company:v('company')||null,phone:v('phone')||null,email:v('custemail')||null,address:v('address')||null,notes:v('notes')||null}).select().single();if(r.error)return $('msg').textContent='Could not save customer: '+r.error.message;['name','company','phone','custemail','address','notes'].forEach(x=>$(x).value='');$('msg').textContent='✓ Customer saved.';load()};$('list').onclick=async e=>{const b=e.target.closest('.del');if(!b||!confirm('Delete this customer record? Trucks and repairs will remain, but their customer link will be cleared.'))return;const r=await db.from('tfh_customers').delete().eq('id',b.dataset.id).eq('user_id',user.id);if(r.error)return alert(r.error.message);load()};start();</script></body></htm
