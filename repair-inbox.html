<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>Repair Inbox | TruckFixHub</title><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px/1.45 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:18px 16px 92px}.top{display:flex;justify-content:space-between;margin-bottom:15px}.top a{font-weight:900;color:#123f72;text-decoration:none}.hero,.card{background:#fff;border:1px solid #c7d2df;border-radius:20px;padding:20px;margin-bottom:14px}.hero{background:linear-gradient(145deg,#07182e,#123f72);color:#fff}.hero h1{font-size:clamp(34px,8vw,50px);line-height:1;margin:.2em 0}.hero p{color:#e5edf5}.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}.filters button{flex:0 0 auto;white-space:nowrap;border:1px solid #b9c7d5;border-radius:999px;padding:9px 13px;background:#fff;color:#123f72;font-weight:850}.filters button.on{background:#0b3768;color:#fff}.job{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:18px;margin:12px 0}.job.urgent{border-left:6px solid #a82323}.job h2{margin:0 0 4px}.meta{color:#60758b;font-size:14px}.status{display:inline-block;margin:10px 0;padding:6px 10px;border-radius:999px;background:#edf3f8;font-weight:850}.next{background:#f3f7fb;border-radius:13px;padding:13px;margin:10px 0}.next strong{display:block}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.btn,.delete{border:0;text-align:center;font-weight:900;padding:13px;border-radius:12px;font:inherit;touch-action:manipulation}.btn{display:block;background:#0b3768;color:#fff;text-decoration:none}.delete{background:#fff;color:#a82323;border:1px solid #d9a7a7;cursor:pointer;-webkit-appearance:none;appearance:none}.delete:disabled{opacity:.55}.empty{text-align:center;padding:30px;color:#60758b}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182ef5;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.nav a{color:#fff;text-decoration:none;text-align:center;font-size:11px;font-weight:850}.nav b{display:block;font-size:20px}@media(max-width:520px){.actions{grid-template-columns:1fr}.delete{width:100%}}</style></head><body><main><nav class="top"><a href="index.html">← TruckFixHub</a><a href="fix-my-truck.html">+ New Repair</a></nav><section class="hero"><div>TRUCKFIXHUB</div><h1>🔔 Repair Inbox</h1><p>Open a repair and TruckFixHub shows what needs to happen next.</p></section><section class="card"><div class="filters"><button type="button" class="on" data-f="active">Needs Attention</button><button type="button" data-f="parts">Parts</button><button type="button" data-f="completed">Completed</button><button type="button" data-f="all">All Jobs</button></div><p id="msg" class="meta">Connecting to your Repair Inbox…</p></section><section id="jobs"></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="fix-my-truck.html"><b>🚨</b>Repair</a><a href="repair-inbox.html"><b>🔔</b>Inbox</a><a href="parts-list.html"><b>📦</b>Parts</a><a href="my-garage.html"><b>🚛</b>Garage</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://bncqcdlzmawlmfworalq.supabase.co',SUPABASE_KEY='sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80',$=x=>document.getElementById(x),jobs=$('jobs'),msg=$('msg');let rows=[],filter='active',sb;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const labels={reported:'Problem Reported',shop_contacted:'Shop Contacted',diagnosing:'Diagnosing',parts_requested:'Parts Requested',waiting_parts:'Waiting on Parts',repairing:'Repairing',completed:'Completed'};function next(j){switch(j.status){case'reported':return['📍','Find / contact a nearby repair shop','repair-shop-connect.html?job='+encodeURIComponent(j.id)];case'shop_contacted':return['🔧','Shop needs to diagnose','repair-workspace.html?job='+j.id];case'diagnosing':case'parts_requested':case'waiting_parts':return['📦','Parts action needed','parts-list.html?job='+j.id];case'repairing':return['🔧','Complete repair and record What Fixed It?','repair-workspace.html?job='+j.id];case'completed':return['✅','View completed repair record','repair-workspace.html?job='+j.id];default:return['🔄','Open repair','repair-workspace.html?job='+j.id]}}function shown(j){if(filter==='all')return true;if(filter==='completed')return j.status==='completed';if(filter==='parts')return['parts_requested','waiting_parts'].includes(j.status);return j.status!=='completed'}function render(){const r=rows.filter(shown);if(!r.length){jobs.innerHTML='<div class="card empty"><b>No repair jobs in this view.</b></div>';return}jobs.innerHTML=r.map(j=>{const n=next(j),unit=j.unit_number?'UNIT '+esc(j.unit_number):'Repair Job #'+esc(j.job_number),code=j.fault_code?' • '+esc(j.fault_code):'',engine=j.engine?' • '+esc(j.engine):'';return `<article class="job ${j.status==='reported'||j.status==='parts_requested'?'urgent':''}"><h2>${unit}</h2><div class="meta">Job #${esc(j.job_number)}${engine}${code}</div><span class="status">${esc(labels[j.status]||j.status)}</span><div class="next"><strong>NEXT: ${n[0]} ${n[1]}</strong>${j.symptoms?'<span>'+esc(j.symptoms).slice(0,180)+'</span>':''}</div><div class="actions"><a class="btn" href="${n[2]}">OPEN & CONTINUE →</a><button type="button" class="delete" data-delete-id="${j.id}" data-job-number="${esc(j.job_number)}">🗑 DELETE</button></div></article>`}).join('')}async function deleteRepair(id,num,btn){if(!window.confirm('Delete Repair Job #'+num+'?\n\nThis permanently removes this repair and its related repair/parts records. This cannot be undone.'))return;btn.disabled=true;btn.textContent='Deleting…';try{const r=await sb.from('tfh_repair_jobs').delete().eq('id',id).select('id');if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error('Only the repair owner can delete this job.');rows=rows.filter(x=>x.id!==id);msg.textContent='Repair Job #'+num+' deleted.';render()}catch(e){btn.disabled=false;btn.textContent='🗑 DELETE';window.alert('Delete failed: '+(e.message||'Unknown error'))}}jobs.addEventListener('click',e=>{const btn=e.target.closest('[data-delete-id]');if(!btn)return;e.preventDefault();e.stopPropagation();deleteRepair(btn.dataset.deleteId,btn.dataset.jobNumber,btn)});async function start(){try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const a=await sb.auth.getSession(),session=a.data.session;if(!session){msg.textContent='Sign in to see your private Repair Inbox.';jobs.innerHTML='<div class="card empty"><b>Your repair jobs are private.</b></div>';return}const result=await sb.from('tfh_repair_jobs').select('id,job_number,status,unit_number,vin,engine,engine_serial,fault_code,symptoms,created_at,updated_at').order('updated_at',{ascending:false}).limit(100);if(result.error)throw result.error;rows=result.data||[];const active=rows.filter(x=>x.status!=='completed').length;msg.textContent=rows.length?active+' active repair job'+(active===1?'':'s')+'.':'No active repair jobs.';render()}catch(e){msg.textContent='Repair Inbox could not connect. '+(e.message||'Please try again.')}}document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()}));start();</script><script src="repair-inbox-save.js"></script></body></html>
