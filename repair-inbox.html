<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Repair Inbox | TruckFixHub</title><meta name="theme-color" content="#0a0d12"><link rel="stylesheet" href="assets/truckfixhub-ui.css"><style>.w{max-width:900px;margin:auto;padding:18px 14px 96px}.back{display:inline-block;color:#b8c3cf;text-decoration:none;font-weight:800;margin-bottom:14px}.hero{background:linear-gradient(145deg,#20181b,#11171e);border:1px solid #633037;border-radius:22px;padding:24px;margin-bottom:14px;box-shadow:0 16px 38px rgba(0,0,0,.22)}.hero small{color:#e45458;font-weight:900;letter-spacing:.13em}.hero h1{font-size:clamp(29px,6vw,42px);margin:7px 0}.hero p{color:#aab6c5;margin-bottom:0}.card{background:linear-gradient(145deg,#18212c,#121821);border:1px solid #2b3746;border-radius:18px;padding:20px;margin:12px 0}.filters,.actions{display:flex;gap:7px;flex-wrap:wrap}.filters button,.btn{padding:10px 13px;border:1px solid #384655;border-radius:11px;font-weight:900;text-decoration:none}.filters button{background:#202a35;color:#dce4ec}.filters .on,.btn{background:linear-gradient(135deg,#d9252a,#a90f17);border-color:#b41d23;color:#fff}.job{border-left:4px solid #536477;background:#0f151c}.urgent{border-left-color:#d9252a}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#202a35;border:1px solid #384655;color:#dce4ec;font-weight:850}.small{font-size:13px;color:#93a0af}.panta{display:inline-block;margin-left:7px;padding:5px 9px;border-radius:999px;background:#172334;border:1px solid #405675;color:#d9e8ff;font-size:12px;font-weight:900}.next{background:#151d26;border:1px solid #2e3a47;border-radius:12px;padding:12px;margin:10px 0;color:#cbd4dd}.next b{color:#fff}.delete{background:#241517;color:#ff9a9d;border:1px solid #663237;border-radius:11px;padding:10px;font-weight:850}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0a0e13ee;backdrop-filter:blur(10px);border-top:1px solid #2d3946;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.nav a{color:#aeb9c5;text-align:center;text-decoration:none;font-size:10px;font-weight:700}.nav b{display:block;color:#f4f7fa;font-size:19px;margin-bottom:2px}@media(max-width:600px){.hero,.card{padding:18px}.actions .btn,.actions button{flex:1 1 45%}}</style></head><body><main class="w"><a class="back" href="index.html">← TruckFixHub</a><section class="hero"><small>PRIVATE REPAIR WORKSPACE</small><h1>🔔 Repair Inbox</h1><p>Your active work queue. Customer, truck, complaint and repair status stay together so the next step is easy to find.</p></section><section class="card"><div class="filters"><button class="on" data-f="active">Needs Attention</button><button data-f="parts">Parts</button><button data-f="completed">Completed</button><button data-f="all">All Jobs</button></div><p id="msg" class="small">Connecting…</p></section><section id="jobs"></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="customers.html"><b>👥</b>Customers</a><a href="my-garage.html"><b>🚛</b>VINs</a><a href="repair-inbox.html"><b>🔔</b>Repairs</a><a href="appointments.html"><b>📅</b>Schedule</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/panta-repair-inbox.js"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),$=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user,rows=[],customers=[],trucks=[],filter='active';const labels={reported:'Problem Reported',shop_contacted:'Shop Contacted',diagnosing:'Diagnosing',parts_requested:'Parts Requested',waiting_parts:'Waiting on Parts',repairing:'Repairing',completed:'Completed'},cname=id=>{const c=customers.find(x=>x.id===id);return c?(c.company||c.name):''},tname=id=>{const t=trucks.find(x=>x.id===id);return t?[t.unit_number&&'Unit '+t.unit_number,t.year,t.make,t.model].filter(Boolean).join(' · '):''};function shown(j){if(filter==='all')return true;if(filter==='completed')return j.status==='completed';if(filter==='parts')return['parts_requested','waiting_parts'].includes(j.status);return j.status!=='completed'}function next(j){if(j.status==='completed')return['View completed repair','repair-workspace.html?job='+j.id];if(['parts_requested','waiting_parts'].includes(j.status))return['Continue parts / repair work','repair-workspace.html?job='+j.id];return['Open repair workspace','repair-workspace.html?job='+j.id]}function render(){const a=rows.filter(shown);$('jobs').innerHTML=a.length?a.map(j=>{const n=next(j),cn=cname(j.customer_id),tn=tname(j.truck_id)||j.unit_number&&'Unit '+j.unit_number,p=window.TruckFixHubPantaInbox?.parse(j.recent_context);return `<article class="card job ${j.status==='reported'||j.status==='parts_requested'?'urgent':''}"><h2>${esc(tn||'Repair Job #'+j.job_number)}</h2>${cn?`<div><b>👥 ${esc(cn)}</b></div>`:''}<div class="small">Job #${esc(j.job_number)}${j.vin?' · VIN '+esc(j.vin):''}${j.engine?' · '+esc(j.engine):''}${j.fault_code?' · '+esc(j.fault_code):''}</div><p><span class="status">${esc(labels[j.status]||j.status)}</span>${p?'<span class="panta">✨ Panta Structured</span>':''}</p>${j.symptoms?`<p>${esc(j.symptoms)}</p>`:''}<div class="next"><b>NEXT:</b> ${n[0]}</div><div class="actions"><a class="btn" href="${n[1]}">OPEN & CONTINUE →</a>${j.truck_id?`<a class="btn" href="my-garage.html">🚛 Truck Record</a>`:''}${j.customer_id?`<a class="btn" href="customers.html">👥 Customer</a>`:''}<button class="delete" data-delete="${j.id}">🗑 Delete</button></div></article>`}).join(''):'<section class="card small">No repair jobs in this view.</section>'}async function start(){const a=await db.auth.getUser();user=a.data.user;if(!user){$('msg').textContent='🔐 Sign in through My Customers or My VINs to view your private repairs.';return}const rs=await Promise.all([db.from('tfh_repair_jobs').select('id,job_number,status,customer_id,truck_id,unit_number,vin,engine,engine_serial,fault_code,system_problem,symptoms,recent_context,created_at,updated_at').eq('owner_id',user.id).order('updated_at',{ascending:false}).limit(100),db.from('tfh_customers').select('id,name,company').eq('user_id',user.id),db.from('tfh_trucks').select('id,unit_number,year,make,model').eq('user_id',user.id)]);const err=rs.find(r=>r.error)?.error;if(err){$('msg').textContent='Repair Inbox could not connect: '+err.message;return}[rows,customers,trucks]=rs.map(r=>r.data||[]);const active=rows.filter(x=>x.status!=='completed').length;$('msg').textContent=active+' active repair job'+(active===1?'':'s')+'.';render()}document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));render()});$('jobs').onclick=async e=>{const b=e.target.closest('[data-delete]');if(!b||!confirm('Delete this repair job? This cannot be undone.'))return;const r=await db.from('tfh_repair_jobs').delete().eq('id',b.dataset.delete).eq('owner_id',user.id).select('id');if(r.error||!r.data?.length)return alert(r.error?.message||'Repair could not be deleted.');rows=rows.filter(x=>x.id!==b.dataset.delete);render()};start();</script></body></html>
