<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>Repair Inbox | TruckFixHub</title><meta name="description" content="TruckFixHub Repair Inbox shows what each truck repair needs next."><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px/1.45 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:18px 16px 92px}.top{display:flex;justify-content:space-between;margin-bottom:15px}.top a{font-weight:900;color:#123f72;text-decoration:none}.hero,.card{background:#fff;border:1px solid #c7d2df;border-radius:20px;padding:20px;margin-bottom:14px}.hero{background:linear-gradient(145deg,#07182e,#123f72);color:#fff}.hero h1{font-size:clamp(34px,8vw,50px);line-height:1;margin:.2em 0}.hero p{color:#e5edf5}.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;-webkit-overflow-scrolling:touch}.filters button{flex:0 0 auto;white-space:nowrap;border:1px solid #b9c7d5;border-radius:999px;padding:9px 13px;background:#fff;color:#123f72;font-weight:850}.filters button.on{background:#0b3768;color:#fff}.job{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:18px;margin:12px 0}.job.urgent{border-left:6px solid #a82323}.job h2{margin:0 0 4px}.meta{color:#60758b;font-size:14px}.status{display:inline-block;margin:10px 0;padding:6px 10px;border-radius:999px;background:#edf3f8;font-weight:850}.next{background:#f3f7fb;border-radius:13px;padding:13px;margin:10px 0}.next strong{display:block}.btn{display:block;background:#0b3768;color:#fff;text-decoration:none;text-align:center;font-weight:900;padding:13px;border-radius:12px}.empty{text-align:center;padding:30px;color:#60758b}.retry{border:0;background:#0b3768;color:#fff;font-weight:900;padding:11px 16px;border-radius:11px;margin-top:12px}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182ef5;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.nav a{color:#fff;text-decoration:none;text-align:center;font-size:11px;font-weight:850}.nav b{display:block;font-size:20px}</style></head><body><main><nav class="top"><a href="index.html">← TruckFixHub</a><a href="fix-my-truck.html">+ New Repair</a></nav><section class="hero"><div>TRUCKFIXHUB</div><h1>🔔 Repair Inbox</h1><p>Don't hunt through menus. Open a repair and TruckFixHub shows what needs to happen next.</p></section><section class="card"><div class="filters"><button class="on" data-f="active">Needs Attention</button><button data-f="parts">Parts</button><button data-f="completed">Completed</button><button data-f="all">All Jobs</button></div><p id="msg" class="meta">Connecting to your Repair Inbox…</p></section><section id="jobs"></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="fix-my-truck.html"><b>🚨</b>Repair</a><a href="repair-inbox.html"><b>🔔</b>Inbox</a><a href="parts-list.html"><b>📦</b>Parts</a><a href="my-garage.html"><b>🚛</b>Garage</a></nav><script>const SUPABASE_URL='https://bncqcdlzmawlmfworalq.supabase.co';const SUPABASE_KEY='sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80';function $id(x){return document.getElementById(x)}const jobs=$id('jobs'),msg=$id('msg');let rows=[],filter='active',started=false;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const labels={reported:'Problem Reported',shop_contacted:'Shop Contacted',diagnosing:'Diagnosing',parts_requested:'Parts Requested',waiting_parts:'Waiting on Parts',repairing:'Repairing',completed:'Completed'};function next(j){switch(j.status){case'reported':return['🔧','Choose / contact a repair shop','fix-my-truck.html?job='+j.id];case'shop_contacted':return['🔧','Shop needs to diagnose','repair-workspace.html?job='+j.id];case'diagnosing':return['📦','Request the parts needed','parts-list.html?job='+j.id];case'parts_requested':return['📦','Parts Desk needs to build the quote','parts-list.html?job='+j.id];case'waiting_parts':return['📦','Parts / approval still needed','parts-list.html?job='+j.id];case'repairing':return['🔧','Complete repair and record What Fixed It?','repair-workspace.html?job='+j.id];case'completed':return['✅','View completed repair record','repair-workspace.html?job='+j.id];default:return['🔄','Open repair','repair-workspace.html?job='+j.id]}}function shown(j){if(filter==='all')return true;if(filter==='completed')return j.status==='completed';if(filter==='parts')return ['parts_requested','waiting_parts'].includes(j.status);return j.status!=='completed'}function render(){const r=rows.filter(shown);if(!r.length){jobs.innerHTML='<div class="card empty"><b>No repair jobs in this view.</b><br>Start a repair when a truck needs help.</div>';return}jobs.innerHTML=r.map(j=>{const n=next(j),unit=j.unit_number?'UNIT '+esc(j.unit_number):'Repair Job #'+esc(j.job_number),code=j.fault_code?' • '+esc(j.fault_code):'',engine=j.engine?' • '+esc(j.engine):'';return'<article class="job '+(j.status==='reported'||j.status==='parts_requested'?'urgent':'')+'"><h2>'+unit+'</h2><div class="meta">Job #'+esc(j.job_number)+engine+code+'</div><span class="status">'+esc(labels[j.status]||j.status)+'</span><div class="next"><strong>NEXT: '+n[0]+' '+n[1]+'</strong>'+(j.symptoms?'<span>'+esc(j.symptoms).slice(0,180)+'</span>':'')+'</div><a class="btn" href="'+n[2]+'">OPEN & CONTINUE →</a></article>'}).join('')}function fail(text){msg.textContent=text;jobs.innerHTML='<div class="card empty"><b>Connection problem.</b><br>TruckFixHub did not leave you stuck loading.<br><button class="retry" onclick="location.reload()">TRY AGAIN</button></div>'}function loadScript(src,timeout=7000){return new Promise((resolve,reject)=>{const s=document.createElement('script');let done=false;const t=setTimeout(()=>{if(!done){done=true;s.remove();reject(new Error('SDK timeout'))}},timeout);s.src=src;s.async=true;s.onload=()=>{if(!done){done=true;clearTimeout(t);resolve()}};s.onerror=()=>{if(!done){done=true;clearTimeout(t);reject(new Error('SDK failed'))}};document.head.appendChild(s)})}async function start(){if(started)return;started=true;try{try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')}catch(_){msg.textContent='Primary connection was slow. Trying backup…';await loadScript('https://unpkg.com/@supabase/supabase-js@2')}if(!window.supabase)throw new Error('Secure database library unavailable');const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);msg.textContent='Checking your secure session…';const auth=await Promise.race([sb.auth.getSession(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Session check timed out')),8000))]);const session=auth.data&&auth.data.session;if(!session){msg.textContent='Sign in to see your private Repair Inbox.';jobs.innerHTML='<div class="card empty"><b>Your repair jobs are private.</b><br>Sign in through TruckFixHub, then return to the Inbox.</div>';return}msg.textContent='Loading your repair jobs…';const result=await Promise.race([sb.from('tfh_repair_jobs').select('id,job_number,status,unit_number,vin,engine,engine_serial,fault_code,symptoms,created_at,updated_at').order('updated_at',{ascending:false}).limit(100),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Repair jobs request timed out')),8000))]);if(result.error)throw result.error;rows=result.data||[];const active=rows.filter(x=>x.status!=='completed').length;msg.textContent=rows.length?active+' active repair job'+(active===1?'':'s')+'.':'No active repair jobs.';render()}catch(e){fail('Repair Inbox could not connect. '+(e.message||'Please try again.'))}}document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;render()});setTimeout(()=>{if(!started)start()},100);setTimeout(()=>{if(msg.textContent.includes('Connecting'))fail('Repair Inbox connection timed out.')},16000);</script><script src="repair-inbox-save.js"></script></body></html>
