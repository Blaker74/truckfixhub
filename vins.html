<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My VIN List | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.shell{max-width:760px}.top h1{font-size:clamp(26px,6vw,38px)}.intro{text-align:center;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.actions button{min-height:82px;border:4px solid #111;border-radius:18px;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #111}.addbtn{background:#ffd83d}.findbtn{background:#5fd3ff}.panel{display:none}.panel.open{display:block}.truck{border:3px solid #111;border-radius:18px;padding:12px;margin:10px 0;background:#fff}.truck b{font-size:21px}.vin{font-family:monospace;font-weight:900;font-size:17px;word-break:break-all}.fleet{display:inline-block;background:#ffd83d;border:2px solid #111;border-radius:10px;padding:3px 8px;font-weight:900;margin-left:6px}.count{font-weight:1000;font-size:20px}.card h2{text-align:center}@media(max-width:520px){.actions{grid-template-columns:1fr}.actions button{min-height:72px}}</style></head><body><main class="shell"><div class="top"><a href="dashboard.html">← MY TOOLS</a><h1>🚛 MY VIN LIST</h1><a href="index.html">HOME</a></div><section class="card"><p class="intro">Save your trucks. Find them fast.</p><div class="actions"><button class="addbtn" id="showAdd">➕ ADD A TRUCK</button><button class="findbtn" id="showFind">🔎 FIND A TRUCK</button></div></section><section class="card panel" id="addPanel"><h2>➕ Add a Truck</h2><input id="unit" placeholder="Unit number"><input id="vin" placeholder="VIN"><input id="year" inputmode="numeric" placeholder="Year"><input id="make" placeholder="Make"><input id="model" placeholder="Model"><input id="engine" placeholder="Engine / serial number"><input id="fleet" placeholder="Customer / fleet name (optional)"><button id="save">SAVE TRUCK</button><p id="saveMsg" style="font-weight:900;text-align:center"></p></section><section class="card panel" id="findPanel"><h2>🔎 Find a Truck</h2><input id="search" placeholder="VIN, unit, make, model or customer"><p id="count" class="count">Loading…</p><div id="trucks"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x);let me=null,all=[];const clean=s=>String(s??'').replace(/[&<>]/g,'');function openPanel(id){$('addPanel').classList.toggle('open',id==='addPanel');$('findPanel').classList.toggle('open',id==='findPanel');(id==='findPanel'?$('search'):$('unit')).focus()}$('showAdd').onclick=()=>openPanel('addPanel');$('showFind').onclick=()=>openPanel('findPanel');function render(){const q=$('search').value.trim().toLowerCase(),rows=all.filter(t=>[t.unit_number,t.vin,t.year,t.make,t.model,t.engine,t.engine_serial,t.notes].join(' ').toLowerCase().includes(q));$('count').textContent=rows.length+' truck'+(rows.length===1?'':'s')+(q?' found':' saved');$('trucks').innerHTML=rows.length?rows.map(t=>'<div class="truck"><b>Unit '+clean(t.unit_number||'—')+'</b>'+(t.notes?'<span class="fleet">'+clean(t.notes)+'</span>':'')+'<div>'+clean(t.year||'')+' '+clean(t.make||'')+' '+clean(t.model||'')+'</div><div class="vin">VIN: '+clean(t.vin||'—')+'</div>'+(t.engine?'<div>Engine: '+clean(t.engine)+'</div>':'')+'</div>').join(''):'<p>No matching trucks.</p>'}async function load(){me=await tfhRequireAuth('vins.html');if(!me)return;const r=await db.from('tfh_trucks').select('id,unit_number,vin,year,make,model,engine,engine_serial,notes').eq('user_id',me.id).order('unit_number',{ascending:true}).limit(1000);if(r.error){$('count').textContent='Could not load VIN list: '+r.error.message;$('trucks').innerHTML='';return}all=r.data||[];render()}$('search').addEventListener('input',render);$('save').onclick=async()=>{if(!me)return;const rec={user_id:me.id,unit_number:$('unit').value.trim()||null,vin:$('vin').value.trim().toUpperCase()||null,year:parseInt($('year').value)||null,make:$('make').value.trim()||null,model:$('model').value.trim()||null,engine:$('engine').value.trim()||null,notes:$('fleet').value.trim()||null};if(!rec.unit_number&&!rec.vin){$('saveMsg').textContent='Enter a unit number or VIN.';return}$('save').disabled=true;$('saveMsg').textContent='Saving…';const r=await db.from('tfh_trucks').insert(rec);$('save').disabled=false;if(r.error){$('saveMsg').textContent='Could not save: '+r.error.message;return}$('saveMsg').textContent='✓ Truck saved.';['unit','vin','year','make','model','engine','fleet'].forEach(id=>$(id).value='');await load()};load();</script></body></html>
