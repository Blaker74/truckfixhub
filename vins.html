<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My VIN List | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>.truck{border:3px solid #111;border-radius:18px;padding:12px;margin:10px 0;background:#fff}.truck b{font-size:21px}.vin{font-family:monospace;font-weight:900;font-size:17px;word-break:break-all}.fleet{display:inline-block;background:#ffd83d;border:2px solid #111;border-radius:10px;padding:3px 8px;font-weight:900;margin-left:6px}.count{font-weight:1000;font-size:20px}</style></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>🚛 MY VIN LIST</h1><a href="account.html?next=vins.html">🔐 ACCOUNT</a></div><section class="card"><h2>📷 Import truck information from photos</h2><p>Upload VIN plates, registration cards, unit sheets or fleet lists. Panta will organize the information into truck records.</p><input type="file" accept="image/*" multiple><button class="import">IMPORT PHOTOS</button></section><section class="card"><h2>➕ Add a truck</h2><input id="unit" placeholder="Unit number"><input id="vin" placeholder="VIN"><input id="year" inputmode="numeric" placeholder="Year"><input id="make" placeholder="Make"><input id="model" placeholder="Model"><input id="engine" placeholder="Engine / serial number"><input id="fleet" placeholder="Customer / fleet name (optional)"><button id="save">SAVE TRUCK</button><p id="saveMsg" style="font-weight:900"></p></section><section class="card"><h2>🔎 My trucks</h2><input id="search" placeholder="Search VIN, unit, make, model or fleet"><p id="count" class="count">Loading your VIN list…</p><div id="trucks"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),$=x=>document.getElementById(x);let me=null,all=[];const clean=s=>String(s??'').replace(/[&<>]/g,'');function render(){const q=$('search').value.trim().toLowerCase(),rows=all.filter(t=>[t.unit_number,t.vin,t.year,t.make,t.model,t.notes].join(' ').toLowerCase().includes(q));$('count').textContent=rows.length+' truck'+(rows.length===1?'':'s')+(q?' found':' saved');$('trucks').innerHTML=rows.length?rows.map(t=>'<div class="truck"><b>Unit '+clean(t.unit_number||'—')+'</b>'+(t.notes?'<span class="fleet">'+clean(t.notes)+'</span>':'')+'<div>'+clean(t.year||'')+' '+clean(t.make||'')+' '+clean(t.model||'')+'</div><div class="vin">VIN: '+clean(t.vin||'—')+'</div></div>').join(''):'<p>No matching trucks.</p>'}async function load(){const u=await db.auth.getUser();me=u.data.user;if(!me){$('count').innerHTML='Please sign in to see your private VIN list.';return}const r=await db.from('tfh_trucks').select('id,unit_number,vin,year,make,model,engine,engine_serial,notes').eq('user_id',me.id).order('unit_number',{ascending:true});if(r.error){$('count').textContent='Could not load VIN list: '+r.error.message;return}all=r.data||[];render()}$('search').addEventListener('input',render);$('save').onclick=async()=>{if(!me){location.href='account.html?next=vins.html';return}const rec={user_id:me.id,unit_number:$('unit').value.trim()||null,vin:$('vin').value.trim().toUpperCase()||null,year:parseInt($('year').value)||null,make:$('make').value.trim()||null,model:$('model').value.trim()||null,engine:$('engine').value.trim()||null,notes:$('fleet').value.trim()||null};if(!rec.unit_number&&!rec.vin){$('saveMsg').textContent='Enter a unit number or VIN.';return}const r=await db.from('tfh_trucks').insert(rec);if(r.error){$('saveMsg').textContent='Could not save: '+r.error.message;return}$('saveMsg').textContent='✓ Truck saved.';await load()};load();</script></body></html>
