<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Warranty Sheet | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>.saved{border:3px solid #111;border-radius:18px;padding:14px;margin:10px 0;background:#fff}.saved button{width:auto;background:#d93025;margin-top:8px}#status{font-weight:900;text-align:center;min-height:28px}</style></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>🛡️ WARRANTY SHEET</h1><a href="account.html?next=warranty.html">🔐 ACCOUNT</a></div><section class="card"><h2>Customer & truck</h2><input id="customer" placeholder="Customer / company"><input id="contact" placeholder="Contact name"><input id="phone" placeholder="Phone"><input id="email" placeholder="Email"><input id="unit" placeholder="Unit number"><input id="vin" placeholder="VIN"><input id="vehicle" placeholder="Year / make / model"><input id="mileage" placeholder="Mileage"><input id="engine" placeholder="Engine / serial number"></section><section class="card"><h2>Part & failure</h2><input id="failedPart" placeholder="Failed part number"><input id="partSerial" placeholder="Part serial number"><input id="invoice" placeholder="Purchase / invoice number"><input id="purchaseDate" type="date"><input id="mileageInstalled" placeholder="Mileage when installed"><input id="mileageFailure" placeholder="Mileage at failure"><textarea id="complaint" rows="5" placeholder="Customer complaint / failure description"></textarea><textarea id="cause" rows="5" placeholder="Cause found"></textarea><textarea id="correction" rows="5" placeholder="Correction / repair performed"></textarea></section><section class="card"><h2>Supporting information</h2><input id="tech" placeholder="Technician / shop"><input id="labor" placeholder="Labor hours"><input id="replacement" placeholder="Replacement part number"><input id="files" type="file" accept="image/*,video/*" multiple><div class="actions"><button type="button" id="saveWarranty">SAVE WARRANTY SHEET</button><button type="button" id="shareWarranty" class="share">SHARE / EXPORT</button></div><p id="status">Checking your account…</p></section><section class="card"><h2>Saved warranty sheets</h2><div id="saved">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x);let me=null,lastSaved=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function user(){const u=await tfhGetUser();if(!u){$('status').textContent='🔐 Please sign in to use your private warranty sheets.';location.href='account.html?next=warranty.html';return null}me=u;return u}function formData(u){return {user_id:u.id,customer:$('customer').value.trim()||null,contact_name:$('contact').value.trim()||null,phone:$('phone').value.trim()||null,email:$('email').value.trim()||null,unit_number:$('unit').value.trim()||null,vin:$('vin').value.trim()||null,vehicle:$('vehicle').value.trim()||null,mileage:$('mileage').value.trim()||null,engine:$('engine').value.trim()||null,failed_part_number:$('failedPart').value.trim()||null,part_serial_number:$('partSerial').value.trim()||null,invoice_number:$('invoice').value.trim()||null,purchase_date:$('purchaseDate').value||null,mileage_installed:$('mileageInstalled').value.trim()||null,mileage_failure:$('mileageFailure').value.trim()||null,complaint:$('complaint').value.trim()||null,cause:$('cause').value.trim()||null,correction:$('correction').value.trim()||null,technician_shop:$('tech').value.trim()||null,labor_hours:$('labor').value.trim()||null,replacement_part_number:$('replacement').value.trim()||null,attachment_names:Array.from($('files').files||[]).map(f=>f.name)}}function shareText(w){return ['TRUCKFIXHUB WARRANTY SHEET','','Customer: '+(w.customer||''),'Contact: '+(w.contact_name||''),'Phone: '+(w.phone||''),'Email: '+(w.email||''),'Unit: '+(w.unit_number||''),'VIN: '+(w.vin||''),'Vehicle: '+(w.vehicle||''),'Mileage: '+(w.mileage||''),'Engine / Serial: '+(w.engine||''),'','Failed Part: '+(w.failed_part_number||''),'Part Serial: '+(w.part_serial_number||''),'Invoice: '+(w.invoice_number||''),'Purchase Date: '+(w.purchase_date||''),'Mileage Installed: '+(w.mileage_installed||''),'Mileage at Failure: '+(w.mileage_failure||''),'','Complaint: '+(w.complaint||''),'Cause: '+(w.cause||''),'Correction: '+(w.correction||''),'','Technician / Shop: '+(w.technician_shop||''),'Labor Hours: '+(w.labor_hours||''),'Replacement Part: '+(w.replacement_part_number||''),'Attachments selected: '+((w.attachment_names||[]).join(', '))].join('\n')}async function load(){const u=await user();if(!u)return;$('status').textContent='✓ Private account ready.';const r=await db.from('tfh_warranty_sheets').select('*').eq('user_id',u.id).order('created_at',{ascending:false}).limit(50);if(r.error){$('saved').textContent='Could not load: '+r.error.message;return}$('saved').innerHTML=r.data.length?r.data.map(w=>`<div class="saved"><b>${esc(w.customer||'Warranty sheet')}</b><div>${esc(w.unit_number||'')}${w.vin?' • '+esc(w.vin):''}</div><div>${new Date(w.created_at).toLocaleString()}</div><button type="button" onclick="delWarranty('${w.id}')">DELETE</button></div>`).join(''):'No saved warranty sheets yet.'}window.delWarranty=async id=>{const u=await user();if(!u||!confirm('Delete this warranty sheet?'))return;const r=await db.from('tfh_warranty_sheets').delete().eq('id',id).eq('user_id',u.id);if(r.error){$('status').textContent='Could not delete: '+r.error.message;return}$('status').textContent='✓ Warranty sheet deleted.';load()};$('saveWarranty').addEventListener('click',async()=>{const u=await user();if(!u)return;const w=formData(u);if(!w.customer&&!w.unit_number&&!w.vin&&!w.failed_part_number){$('status').textContent='Enter customer, unit, VIN or failed part information first.';return}const b=$('saveWarranty');b.disabled=true;$('status').textContent='Saving warranty sheet…';try{const {data,error}=await db.from('tfh_warranty_sheets').insert(w).select('*').single();if(error)throw error;lastSaved=data;$('status').textContent='✓ SAVED — your warranty sheet is now in your private account.';await load();$('status').textContent='✓ SAVED — your warranty sheet is now in your private account.'}catch(e){$('status').textContent='SAVE FAILED: '+(e.message||e)}finally{b.disabled=false}});$('shareWarranty').addEventListener('click',async()=>{const u=await user();if(!u)return;const w=lastSaved||formData(u),t=shareText(w);$('status').textContent='Opening share…';try{if(navigator.share){await navigator.share({title:'TruckFixHub Warranty Sheet',text:t});$('status').textContent='✓ Share completed.'}else if(navigator.clipboard){await navigator.clipboard.writeText(t);$('status').textContent='✓ Copied. Paste the warranty sheet into a text or email.'}else{const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(t);a.download='TruckFixHub-Warranty.txt';a.click();$('status').textContent='✓ Warranty sheet exported.'}}catch(e){if(e.name==='AbortError')$('status').textContent='Share canceled.';else $('status').textContent='SHARE FAILED: '+(e.message||e)}});load();</script></body></html>
