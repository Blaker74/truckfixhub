<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Warranty | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.shell{max-width:760px}.intro{text-align:center;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.actions button{min-height:82px;border:4px solid #111;border-radius:18px;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #111}.newbtn{background:#ffd83d}.findbtn{background:#cda5ff}.panel{display:none}.panel.open{display:block}.saved{border:3px solid #111;border-radius:18px;padding:14px;margin:10px 0;background:#fff}.saved button{width:auto;background:#d93025;margin-top:8px}#status{font-weight:900;text-align:center;min-height:28px}.card h2{text-align:center}.step{font-size:18px;font-weight:1000;margin:18px 0 4px}@media(max-width:520px){.actions{grid-template-columns:1fr}.actions button{min-height:72px}}</style></head><body><main class="shell"><div class="top"><a href="dashboard.html">← MY TOOLS</a><h1>🛡️ MY WARRANTY</h1><a href="index.html">HOME</a></div><section class="card"><p class="intro">Keep warranty records together. Find them fast.</p><div class="actions"><button class="newbtn" id="showNew">➕ NEW WARRANTY</button><button class="findbtn" id="showFind">🔎 MY WARRANTIES</button></div></section><section class="card panel" id="newPanel"><h2>➕ New Warranty</h2><div class="step">1. Customer & Truck</div><input id="customer" placeholder="Customer / company"><input id="unit" placeholder="Unit number"><input id="vin" placeholder="VIN"><input id="vehicle" placeholder="Year / make / model"><input id="mileage" placeholder="Mileage"><input id="engine" placeholder="Engine / serial number"><div class="step">2. Failed Part</div><input id="failedPart" placeholder="Failed part number"><input id="partSerial" placeholder="Part serial number"><input id="invoice" placeholder="Invoice number"><input id="purchaseDate" type="date"><textarea id="complaint" rows="4" placeholder="What failed?"></textarea><div class="step">3. What Was Done?</div><textarea id="cause" rows="4" placeholder="Cause found (optional)"></textarea><textarea id="correction" rows="4" placeholder="Repair / correction (optional)"></textarea><input id="replacement" placeholder="Replacement part number (optional)"><button type="button" id="saveWarranty">SAVE WARRANTY</button><p id="status"></p></section><section class="card panel open" id="findPanel"><h2>🛡️ My Saved Warranties</h2><input id="search" placeholder="Type customer, unit, VIN or part number"><div id="saved">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x);let me=null,all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openPanel(id){$('newPanel').classList.toggle('open',id==='newPanel');$('findPanel').classList.toggle('open',id==='findPanel');(id==='findPanel'?$('search'):$('customer')).focus()}$('showNew').onclick=()=>openPanel('newPanel');$('showFind').onclick=()=>openPanel('findPanel');function render(){const q=$('search').value.toLowerCase(),rows=all.filter(w=>JSON.stringify(w).toLowerCase().includes(q));$('saved').innerHTML=rows.length?rows.map(w=>`<div class="saved"><b>${esc(w.customer||'Warranty')}</b><div>${esc(w.unit_number||'')}${w.vin?' • '+esc(w.vin):''}</div>${w.failed_part_number?'<div><b>Part:</b> '+esc(w.failed_part_number)+'</div>':''}<div>${new Date(w.created_at).toLocaleDateString()}</div><button type="button" onclick="delWarranty('${w.id}')">DELETE</button></div>`).join(''):'No saved warranties yet. Tap <b>NEW WARRANTY</b> above to add one.'}async function load(){me=await tfhRequireAuth('warranty.html');if(!me)return;const r=await db.from('tfh_warranty_sheets').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(100);if(r.error){$('saved').textContent='Could not load: '+r.error.message;return}all=r.data||[];render()}$('search').oninput=render;window.delWarranty=async id=>{if(!confirm('Delete this warranty?'))return;const r=await db.from('tfh_warranty_sheets').delete().eq('id',id).eq('user_id',me.id);if(r.error)return alert(r.error.message);load()};$('saveWarranty').onclick=async()=>{if(!me)return;const w={user_id:me.id,customer:$('customer').value.trim()||null,unit_number:$('unit').value.trim()||null,vin:$('vin').value.trim().toUpperCase()||null,vehicle:$('vehicle').value.trim()||null,mileage:$('mileage').value.trim()||null,engine:$('engine').value.trim()||null,failed_part_number:$('failedPart').value.trim()||null,part_serial_number:$('partSerial').value.trim()||null,invoice_number:$('invoice').value.trim()||null,purchase_date:$('purchaseDate').value||null,complaint:$('complaint').value.trim()||null,cause:$('cause').value.trim()||null,correction:$('correction').value.trim()||null,replacement_part_number:$('replacement').value.trim()||null,attachment_names:[]};if(!w.customer&&!w.unit_number&&!w.vin&&!w.failed_part_number){$('status').textContent='Enter a customer, unit, VIN or failed part.';return}$('saveWarranty').disabled=true;$('status').textContent='Saving…';const r=await db.from('tfh_warranty_sheets').insert(w);$('saveWarranty').disabled=false;if(r.error){$('status').textContent='Could not save: '+r.error.message;return}$('status').textContent='✓ Saved.';['customer','unit','vin','vehicle','mileage','engine','failedPart','partSerial','invoice','purchaseDate','complaint','cause','correction','replacement'].forEach(id=>$(id).value='');await load();openPanel('findPanel')};load();</script></body></html>
