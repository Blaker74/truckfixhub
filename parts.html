<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Parts Department | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>.status{font-weight:900;text-align:center}.part{border:3px solid #111;border-radius:18px;padding:14px;margin:12px 0;background:#fff}.part b{font-size:21px}.delete{background:#d93025!important;color:#fff!important;width:auto!important;padding:8px 12px!important;margin-top:10px}</style></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>📦 PARTS DEPARTMENT</h1><a href="account.html?next=parts.html">🔐 ACCOUNT</a></div><section class="card"><h2>📷 Import part photos</h2><p>Select shelf labels, handwritten lists, invoices or parts sheets. Selected photos stay on your device until an import is completed.</p><input id="photos" type="file" accept="image/*" multiple><button id="importPhotos" class="import">IMPORT PART PHOTOS</button><p id="importStatus" class="status"></p></section><section class="card"><h2>➕ Add a part</h2><input id="partNumber" placeholder="Part number"><input id="description" placeholder="Description"><input id="brand" placeholder="Brand"><input id="bin" placeholder="Bin / location"><input id="quantity" inputmode="numeric" placeholder="Quantity"><input id="cost" inputmode="decimal" placeholder="Cost"><input id="price" inputmode="decimal" placeholder="Selling price"><input id="vendor" placeholder="Vendor"><textarea id="notes" placeholder="Notes"></textarea><button id="save">SAVE PART</button><p id="status" class="status"></p></section><section class="card"><h2>🔎 Saved parts</h2><input id="search" placeholder="Search part number, description, brand or bin"><div id="saved"><p>Loading…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x);let me=null,parts=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=$('search').value.toLowerCase();const rows=parts.filter(p=>JSON.stringify(p).toLowerCase().includes(q));$('saved').innerHTML=rows.length?rows.map(p=>`<div class="part"><b>${esc(p.part_number)}</b>${p.description?'<div>'+esc(p.description)+'</div>':''}${p.brand?'<div><b>Brand:</b> '+esc(p.brand)+'</div>':''}${p.availability?'<div><b>Location/Qty:</b> '+esc(p.availability)+'</div>':''}${p.price_each!=null?'<div><b>Selling price:</b> $'+Number(p.price_each).toFixed(2)+'</div>':''}${p.notes?'<div>'+esc(p.notes)+'</div>':''}<button class="delete" onclick="delPart('${p.id}')">DELETE</button></div>`).join(''):'<p>No saved parts yet.</p>'}async function load(){me=await tfhRequireAuth('parts.html');if(!me)return;const r=await db.from('tfh_saved_parts').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(500);if(r.error){$('saved').innerHTML='<p>'+esc(r.error.message)+'</p>';return}parts=r.data;render()}$('search').oninput=render;$('save').onclick=async()=>{if(!me)return;const pn=$('partNumber').value.trim();if(!pn){$('status').textContent='Enter a part number.';return}const qty=$('quantity').value.trim(),bin=$('bin').value.trim(),vendor=$('vendor').value.trim(),cost=$('cost').value.trim(),extra=$('notes').value.trim();const notes=[bin&&'Bin/location: '+bin,qty&&'Quantity: '+qty,cost&&'Cost: $'+cost,vendor&&'Vendor: '+vendor,extra].filter(Boolean).join('\n');$('save').disabled=true;$('status').textContent='Saving…';const price=$('price').value.trim();const r=await db.from('tfh_saved_parts').insert({user_id:me.id,part_number:pn,description:$('description').value.trim()||null,brand:$('brand').value.trim()||null,availability:[bin,qty&&'Qty '+qty].filter(Boolean).join(' • ')||null,price_each:price?Number(price):null,notes:notes||null});$('save').disabled=false;if(r.error){$('status').textContent='Could not save: '+r.error.message;return}$('status').textContent='✓ Part saved.';['partNumber','description','brand','bin','quantity','cost','price','vendor','notes'].forEach(id=>$(id).value='');load()};window.delPart=async id=>{if(!confirm('Delete this saved part?'))return;const r=await db.from('tfh_saved_parts').delete().eq('id',id).eq('user_id',me.id);if(r.error)return alert(r.error.message);load()};$('importPhotos').onclick=()=>{if(!$('photos').files.length)return $('importStatus').textContent='Choose one or more photos first.';$('importStatus').textContent='Photos selected. Automatic reading from photos is not connected yet; use Add a Part below so nothing is saved incorrectly.'};load();</script></body></html>
