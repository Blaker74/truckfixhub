<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Parts | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.shell{max-width:760px}.top h1{font-size:clamp(26px,6vw,38px)}.status{font-weight:900;text-align:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.actions button{min-height:82px;border:4px solid #111;border-radius:18px;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #111}.addbtn{background:#ffd83d;color:#111}.findbtn{background:#5fd3ff;color:#111}.panel{display:none}.panel.open{display:block}.part{border:3px solid #111;border-radius:18px;padding:14px;margin:12px 0;background:#fff}.part b{font-size:21px}.delete{background:#d93025!important;color:#fff!important;width:auto!important;padding:8px 12px!important;margin-top:10px}.simple-note{text-align:center;font-weight:800}.card h2{text-align:center}@media(max-width:520px){.actions{grid-template-columns:1fr}.actions button{min-height:72px}}</style></head><body><main class="shell"><div class="top"><a href="dashboard.html">← MY TOOLS</a><h1>📦 MY PARTS</h1><a href="index.html">HOME</a></div><section class="card"><p class="simple-note">Your saved parts and locations in one place.</p><div class="actions"><button class="addbtn" id="showAdd">➕ ADD A PART</button><button class="findbtn" id="showFind">🔎 MY PARTS</button></div></section><section class="card panel" id="addPanel"><h2>➕ Add a Part</h2><input id="partNumber" placeholder="Part number *"><input id="description" placeholder="What is it?"><input id="brand" placeholder="Brand"><input id="bin" placeholder="Where is it? (bin / shelf)"><input id="quantity" inputmode="numeric" placeholder="How many?"><textarea id="notes" placeholder="Notes (optional)"></textarea><button id="save">SAVE PART</button><p id="status" class="status"></p></section><section class="card panel open" id="findPanel"><h2>📦 My Saved Parts</h2><input id="search" placeholder="Type part number, description, brand or location"><div id="saved"><p>Loading…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x);let me=null,parts=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openPanel(id){$('addPanel').classList.toggle('open',id==='addPanel');$('findPanel').classList.toggle('open',id==='findPanel');if(id==='findPanel')$('search').focus();else $('partNumber').focus()}$('showAdd').onclick=()=>openPanel('addPanel');$('showFind').onclick=()=>openPanel('findPanel');function render(){const q=$('search').value.toLowerCase();const rows=parts.filter(p=>JSON.stringify(p).toLowerCase().includes(q));$('saved').innerHTML=rows.length?rows.map(p=>`<div class="part"><b>${esc(p.part_number)}</b>${p.description?'<div>'+esc(p.description)+'</div>':''}${p.brand?'<div><b>Brand:</b> '+esc(p.brand)+'</div>':''}${p.availability?'<div><b>Location/Qty:</b> '+esc(p.availability)+'</div>':''}${p.notes?'<div>'+esc(p.notes)+'</div>':''}<button class="delete" onclick="delPart('${p.id}')">DELETE</button></div>`).join(''):'<p>No saved parts yet. Tap <b>ADD A PART</b> above to add one.</p>'}async function load(){me=await tfhRequireAuth('parts.html');if(!me)return;const r=await db.from('tfh_saved_parts').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(500);if(r.error){$('saved').innerHTML='<p>'+esc(r.error.message)+'</p>';return}parts=r.data||[];render()}$('search').oninput=render;$('save').onclick=async()=>{if(!me)return;const pn=$('partNumber').value.trim();if(!pn){$('status').textContent='Enter a part number.';return}const qty=$('quantity').value.trim(),bin=$('bin').value.trim(),extra=$('notes').value.trim();$('save').disabled=true;$('status').textContent='Saving…';const r=await db.from('tfh_saved_parts').insert({user_id:me.id,part_number:pn,description:$('description').value.trim()||null,brand:$('brand').value.trim()||null,availability:[bin,qty&&'Qty '+qty].filter(Boolean).join(' • ')||null,notes:extra||null});$('save').disabled=false;if(r.error){$('status').textContent='Could not save: '+r.error.message;return}$('status').textContent='✓ Saved.';['partNumber','description','brand','bin','quantity','notes'].forEach(id=>$(id).value='');await load();openPanel('findPanel')};window.delPart=async id=>{if(!confirm('Delete this saved part?'))return;const r=await db.from('tfh_saved_parts').delete().eq('id',id).eq('user_id',me.id);if(r.error)return alert(r.error.message);load()};load();</script></body></html>
