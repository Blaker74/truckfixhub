<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Notes | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>body{background:#f4f7fb}.shell{max-width:760px}.intro{text-align:center;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.actions button{min-height:82px;border:4px solid #111;border-radius:18px;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #111}.newbtn{background:#ffd83d}.findbtn{background:#5fd3ff}.panel{display:none}.panel.open{display:block}.status{font-weight:900;text-align:center}.saved-note{border:3px solid #111;border-radius:18px;padding:14px;margin:12px 0;background:#fff}.saved-note b{font-size:20px}.saved-note small{display:block;margin:5px 0}.delete{background:#d93025!important;color:#fff!important;width:auto!important;padding:8px 12px!important;margin-top:10px}.card h2{text-align:center}@media(max-width:520px){.actions{grid-template-columns:1fr}.actions button{min-height:72px}}</style></head><body><main class="shell"><div class="top"><a href="dashboard.html">← MY TOOLS</a><h1>📝 MY NOTES</h1><a href="index.html">HOME</a></div><section class="card"><p class="intro">Write it down now. Find it later.</p><div class="actions"><button class="newbtn" id="showNew">➕ NEW NOTE</button><button class="findbtn" id="showFind">🔎 FIND A NOTE</button></div></section><section class="card panel" id="newPanel"><h2>➕ New Note</h2><input id="person" placeholder="Customer / person"><input id="company" placeholder="Company (optional)"><input id="contact" placeholder="Phone / email (optional)"><textarea id="notes" rows="7" placeholder="What do you need to remember?"></textarea><input id="followup" placeholder="What needs to happen next? (optional)"><button id="save">SAVE NOTE</button><p id="status" class="status"></p></section><section class="card panel open" id="findPanel"><h2>🔎 My Saved Notes</h2><input id="search" placeholder="Type to find a customer, company, phone or words"><div id="recent"><p>Loading…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x);let me=null,all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openPanel(id){$('newPanel').classList.toggle('open',id==='newPanel');$('findPanel').classList.toggle('open',id==='findPanel');(id==='findPanel'?$('search'):$('person')).focus()}$('showNew').onclick=()=>openPanel('newPanel');$('showFind').onclick=()=>openPanel('findPanel');function render(){const q=$('search').value.toLowerCase();const rows=all.filter(n=>JSON.stringify(n).toLowerCase().includes(q));$('recent').innerHTML=rows.length?rows.map(n=>`<div class="saved-note"><b>${esc(n.customer||'Note')}</b><small>${new Date(n.created_at).toLocaleString()}</small>${n.vehicle?'<div>'+esc(n.vehicle)+'</div>':''}${n.phone?'<div>'+esc(n.phone)+'</div>':''}${n.request?'<p>'+esc(n.request)+'</p>':''}${n.next_action?'<p><b>Next:</b> '+esc(n.next_action)+'</p>':''}<button class="delete" onclick="delNote('${n.id}')">DELETE</button></div>`).join(''):'<p>No saved notes yet. Tap <b>NEW NOTE</b> above to add one.</p>'}async function load(){me=await tfhRequireAuth('calls.html');if(!me)return;const r=await db.from('tfh_call_notes').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(100);if(r.error){$('recent').innerHTML='<p>'+esc(r.error.message)+'</p>';return}all=r.data||[];render()}$('search').oninput=render;$('save').onclick=async()=>{if(!me)return;const text=$('notes').value.trim(),person=$('person').value.trim(),next=$('followup').value.trim();if(!person&&!text&&!next){$('status').textContent='Add something to the note first.';return}$('save').disabled=true;$('status').textContent='Saving…';const company=$('company').value.trim();const r=await db.from('tfh_call_notes').insert({user_id:me.id,customer:person||company||null,phone:$('contact').value.trim()||null,category:'note',vehicle:company||null,request:text||null,next_action:next||null,transcript:null,status:'saved',source:'truckfixhub'});$('save').disabled=false;if(r.error){$('status').textContent='Could not save: '+r.error.message;return}$('status').textContent='✓ Note saved.';['person','company','contact','notes','followup'].forEach(id=>$(id).value='');await load();openPanel('findPanel')};window.delNote=async id=>{if(!confirm('Delete this note?'))return;const r=await db.from('tfh_call_notes').delete().eq('id',id).eq('user_id',me.id);if(r.error)return alert(r.error.message);load()};load();</script></body></html>
