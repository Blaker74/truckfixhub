<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Call Notes | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>.photo-upload{margin:12px 0;padding:16px;border:4px solid #111;border-radius:20px;background:#eef8ff}.photo-upload label{display:block;font-size:21px;font-weight:1000;margin-bottom:10px}.photo-upload input{margin:0;background:#fff}.photo-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}.photo-preview img{width:100%;height:120px;object-fit:cover;border:3px solid #111;border-radius:14px}.status{font-weight:900;text-align:center}.saved-note{border:3px solid #111;border-radius:18px;padding:14px;margin:12px 0;background:#fff}.saved-note b{font-size:20px}.saved-note small{display:block;margin:5px 0}.delete{background:#d93025!important;color:#fff!important;width:auto!important;padding:8px 12px!important;margin-top:10px}</style></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>📝 CALL NOTES</h1><a href="account.html?next=calls.html">🔐 ACCOUNT</a></div><section class="card"><input id="person" placeholder="Customer / coworker"><input id="company" placeholder="Company"><input id="contact" placeholder="Phone / email"><input id="when" type="datetime-local"><textarea id="notes" rows="8" placeholder="What was discussed? What needs to happen next?"></textarea><div class="photo-upload"><label for="callPhotos">📷 ADD PHOTOS</label><input id="callPhotos" type="file" accept="image/*" multiple><div id="photoPreview" class="photo-preview"></div></div><input id="followup" placeholder="Follow-up"><div class="actions"><button id="save">SAVE NOTE</button><button id="share" class="share">SHARE NOTE</button></div><p id="status" class="status"></p></section><section class="card"><h2>Recent call notes</h2><input id="search" placeholder="Search notes"><div id="recent"><p>Loading…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const db=tfhDb,$=x=>document.getElementById(x),photos=$('callPhotos'),preview=$('photoPreview');let me=null,all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));photos.addEventListener('change',()=>{preview.innerHTML='';[...photos.files].forEach(file=>{const img=document.createElement('img');img.src=URL.createObjectURL(file);img.alt=file.name;preview.appendChild(img)})});function noteText(){const lines=['TruckFixHub Call Note'];if($('person').value.trim())lines.push('Customer / coworker: '+$('person').value.trim());if($('company').value.trim())lines.push('Company: '+$('company').value.trim());if($('contact').value.trim())lines.push('Phone / email: '+$('contact').value.trim());if($('when').value)lines.push('Date / time: '+new Date($('when').value).toLocaleString());if($('notes').value.trim())lines.push('','Notes:',$('notes').value.trim());if($('followup').value.trim())lines.push('','Follow-up: '+$('followup').value.trim());return lines.join('\n')}function render(){const q=$('search').value.toLowerCase();const rows=all.filter(n=>JSON.stringify(n).toLowerCase().includes(q));$('recent').innerHTML=rows.length?rows.map(n=>`<div class="saved-note"><b>${esc(n.customer||'Call Note')}</b><small>${new Date(n.created_at).toLocaleString()}</small>${n.phone?'<div>'+esc(n.phone)+'</div>':''}${n.request?'<p>'+esc(n.request)+'</p>':''}${n.next_action?'<p><b>Follow-up:</b> '+esc(n.next_action)+'</p>':''}<button class="delete" onclick="delNote('${n.id}')">DELETE</button></div>`).join(''):'<p>No saved call notes yet.</p>'}async function load(){me=await tfhRequireAuth('calls.html');if(!me)return;const r=await db.from('tfh_call_notes').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(100);if(r.error){$('recent').innerHTML='<p>'+esc(r.error.message)+'</p>';return}all=r.data;render()}$('search').oninput=render;$('save').onclick=async()=>{if(!me)return;const text=$('notes').value.trim();if(!$('person').value.trim()&&!text&&!$('followup').value.trim()){$('status').textContent='Add something to the note first.';return}$('save').disabled=true;$('status').textContent='Saving…';const company=$('company').value.trim();const r=await db.from('tfh_call_notes').insert({user_id:me.id,customer:$('person').value.trim()||company||null,phone:$('contact').value.trim()||null,category:'call_note',vehicle:company||null,request:text||null,next_action:$('followup').value.trim()||null,transcript:noteText(),status:'saved',source:'truckfixhub'});$('save').disabled=false;if(r.error){$('status').textContent='Could not save: '+r.error.message;return}$('status').textContent='✓ Note saved.';['person','company','contact','when','notes','followup'].forEach(id=>$(id).value='');photos.value='';preview.innerHTML='';load()};window.delNote=async id=>{if(!confirm('Delete this call note?'))return;const r=await db.from('tfh_call_notes').delete().eq('id',id).eq('user_id',me.id);if(r.error)return alert(r.error.message);load()};$('share').onclick=async()=>{const text=noteText(),files=[...photos.files];if(!text.replace('TruckFixHub Call Note','').trim()&&!files.length){$('status').textContent='Add something to the note first.';return}try{if(navigator.share){const data={title:'TruckFixHub Call Note',text};if(files.length&&navigator.canShare&&navigator.canShare({files}))data.files=files;await navigator.share(data)}else await navigator.clipboard.writeText(text)}catch(e){if(e.name!=='AbortError')try{await navigator.clipboard.writeText(text)}catch(_){}}};load();</script></body></html>
