<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Call Notes | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>.photo-upload{margin:12px 0;padding:16px;border:4px solid #111;border-radius:20px;background:#eef8ff}.photo-upload label{display:block;font-size:21px;font-weight:1000;margin-bottom:10px}.photo-upload input{margin:0;background:#fff}.photo-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}.photo-preview img{width:100%;height:120px;object-fit:cover;border:3px solid #111;border-radius:14px}</style></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>📝 CALL NOTES</h1><a href="account.html?next=calls.html">🔐 ACCOUNT</a></div><section class="card"><input placeholder="Customer / coworker"><input placeholder="Company"><input placeholder="Phone / email"><input type="datetime-local"><textarea rows="8" placeholder="What was discussed? What needs to happen next?"></textarea><div class="photo-upload"><label for="callPhotos">📷 ADD PHOTOS</label><input id="callPhotos" type="file" accept="image/*" multiple><div id="photoPreview" class="photo-preview"></div></div><input placeholder="Follow-up"><div class="actions"><button>SAVE NOTE</button><button class="share">SHARE NOTE</button></div></section><section class="card"><h2>Recent call notes</h2><input placeholder="Search notes"><p>Your saved notes will appear here.</p></section></main><script>const photos=document.getElementById('callPhotos'),preview=document.getElementById('photoPreview');photos.addEventListener('change',()=>{preview.innerHTML='';[...photos.files].forEach(file=>{const img=document.createElement('img');img.src=URL.createObjectURL(file);img.alt=file.name;preview.appendChild(img)})});</script></body></html>
