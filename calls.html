<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Call Notes | TruckFixHub</title><link rel="stylesheet" href="app.css"><style>.photo-upload{margin:12px 0;padding:16px;border:4px solid #111;border-radius:20px;background:#eef8ff}.photo-upload label{display:block;font-size:21px;font-weight:1000;margin-bottom:10px}.photo-upload input{margin:0;background:#fff}.photo-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px}.photo-preview img{width:100%;height:120px;object-fit:cover;border:3px solid #111;border-radius:14px}.status{font-weight:900;text-align:center}</style></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>📝 CALL NOTES</h1><a href="account.html?next=calls.html">🔐 ACCOUNT</a></div><section class="card"><input id="person" placeholder="Customer / coworker"><input id="company" placeholder="Company"><input id="contact" placeholder="Phone / email"><input id="when" type="datetime-local"><textarea id="notes" rows="8" placeholder="What was discussed? What needs to happen next?"></textarea><div class="photo-upload"><label for="callPhotos">📷 ADD PHOTOS</label><input id="callPhotos" type="file" accept="image/*" multiple><div id="photoPreview" class="photo-preview"></div></div><input id="followup" placeholder="Follow-up"><div class="actions"><button id="save">SAVE NOTE</button><button id="share" class="share">SHARE NOTE</button></div><p id="status" class="status"></p></section><section class="card"><h2>Recent call notes</h2><input placeholder="Search notes"><p>Your saved notes will appear here.</p></section></main><script>const $=x=>document.getElementById(x),photos=$('callPhotos'),preview=$('photoPreview');photos.addEventListener('change',()=>{preview.innerHTML='';[...photos.files].forEach(file=>{const img=document.createElement('img');img.src=URL.createObjectURL(file);img.alt=file.name;preview.appendChild(img)})});function noteText(){const lines=['TruckFixHub Call Note'];if($('person').value.trim())lines.push('Customer / coworker: '+$('person').value.trim());if($('company').value.trim())lines.push('Company: '+$('company').value.trim());if($('contact').value.trim())lines.push('Phone / email: '+$('contact').value.trim());if($('when').value)lines.push('Date / time: '+new Date($('when').value).toLocaleString());if($('notes').value.trim())lines.push('','Notes:',$('notes').value.trim());if($('followup').value.trim())lines.push('','Follow-up: '+$('followup').value.trim());return lines.join('\n')}$('share').onclick=async()=>{const text=noteText(),files=[...photos.files];if(!text.replace('TruckFixHub Call Note','').trim()&&!files.length){$('status').textContent='Add something to the note first.';return}try{if(navigator.share){const data={title:'TruckFixHub Call Note',text};if(files.length&&navigator.canShare&&navigator.canShare({files}))data.files=files;await navigator.share(data);$('status').textContent='✓ Share sheet opened.'}else{await navigator.clipboard.writeText(text);$('status').textContent='✓ Note copied. Paste it into a text, email or message.'}}catch(e){if(e.name!=='AbortError'){$('status').textContent='Could not open sharing. The note has been copied instead.';try{await navigator.clipboard.writeText(text)}catch(_){}}}};</script></body></html>
