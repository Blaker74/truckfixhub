<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Saved Parts | TruckFixHub</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f4f7fb;color:#102a49;margin:0}.w{max-width:900px;margin:auto;padding:18px}.hero,.card,.part{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:20px;margin:12px 0}.hero{background:#07182e;color:#fff}.search{width:100%;padding:14px;border:1px solid #9aabba;border-radius:12px;font:inherit}.filters{display:flex;gap:7px;overflow:auto;margin-top:10px}.filters button,.actions button{border:0;border-radius:10px;padding:10px 12px;background:#e8eef5;color:#102a49;font-weight:800}.filters .on,.actions .primary{background:#0b3768;color:#fff}.part h2{margin:0}.star{float:right;border:0;background:none;font-size:25px}.small{color:#60758b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}a{color:#123f72;font-weight:800;text-decoration:none}</style></head><body><main class="w"><p><a href="parts-list.html">← Parts Desk</a></p><section class="hero"><h1>🔎 My Parts Catalog</h1><p>Search your own saved parts memory and put an old part back on a quote with one tap.</p></section><section class="card"><input class="search" id="q" placeholder="Search description, part number, brand, alternate or notes…"><div class="filters"><button class="on" data-f="all">All</button><button data-f="favorites">⭐ Favorites</button><button data-f="recent">🕒 Recently Used</button></div><p id="status" class="small"></p></section><div id="results"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_QhBZPjG4w5RZKvEnOQ8q0w_E8zQuk_j'),q=document.getElementById('q'),out=document.getElementById('results'),status=document.getElementById('status');let rows=[],filter='all';const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){const {data:{session}}=await db.auth.getSession();if(!session){status.textContent='Sign in to see your private saved parts.';return}const r=await db.from('tfh_saved_parts').select('*').order('updated_at',{ascending:false}).limit(500);if(r.error){status.textContent='Saved parts could not load.';return}rows=r.data||[];draw()}function shown(x,s){const match=!s||[x.part_number,x.description,x.brand,x.notes,x.availability,x.alternative_part,x.last_unit_number].some(v=>String(v||'').toLowerCase().includes(s));if(!match)return false;if(filter==='favorites')return x.favorite;if(filter==='recent')return !!x.last_used_at;return true}function draw(){const s=q.value.trim().toLowerCase(),r=rows.filter(x=>shown(x,s)).sort((a,b)=>filter==='recent'?new Date(b.last_used_at)-new Date(a.last_used_at):Number(b.favorite)-Number(a.favorite));status.textContent=r.length+' saved part'+(r.length===1?'':'s');out.innerHTML=r.length?r.map(x=>'<article class="part"><button class="star" onclick="fav(\''+x.id+'\')">'+(x.favorite?'⭐':'☆')+'</button><h2>'+esc(x.part_number)+'</h2><div>'+esc(x.description)+'</div><p class="small">'+[x.brand,x.price_each?'Last price: $'+Number(x.price_each).toFixed(2):'',x.availability,x.alternative_part?'Alternate: '+x.alternative_part:'',x.last_unit_number?'Last unit: '+x.last_unit_number:'',x.last_used_at?'Last used: '+new Date(x.last_used_at).toLocaleDateString():''].filter(Boolean).map(esc).join(' · ')+'</p><div class="actions"><button class="primary" onclick="addQuote(\''+x.id+'\')">+ Add to Quote</button><button onclick="sharePart(\''+x.id+'\')">📤 Share</button></div></article>').join(''):'<section class="card">No matching saved parts.</section>'}window.fav=async id=>{const x=rows.find(r=>r.id===id),v=!x.favorite;const r=await db.from('tfh_saved_parts').update({favorite:v,updated_at:new Date().toISOString()}).eq('id',id);if(!r.error){x.favorite=v;draw()}};window.addQuote=async id=>{const x=rows.find(r=>r.id===id),list=JSON.parse(localStorage.getItem('tfh-parts-list')||'[]');list.push({part:[x.part_number,x.description].filter(Boolean).join(' - '),qty:1,price:x.price_each||'',note:[x.brand,x.availability,x.alternative_part&&'Alt: '+x.alternative_part].filter(Boolean).join(' · ')});localStorage.setItem('tfh-parts-list',JSON.stringify(list));const now=new Date().toISOString();await db.from('tfh_saved_parts').update({last_used_at:now,use_count:(x.use_count||0)+1,updated_at:now}).eq('id',id);location.href='parts-list.html'};window.sharePart=async id=>{const x=rows.find(r=>r.id===id),text=[x.part_number,x.description,x.brand,x.price_each?'$'+Number(x.price_each).toFixed(2):'',x.availability,x.alternative_part&&'Alternate: '+x.alternative_part].filter(Boolean).join('\n');try{if(navigator.share)await navigator.share({title:'TruckFixHub Part',text});else await navigator.clipboard.writeText(text)}catch(e){}};q.oninput=draw;document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;draw()});load();</script></body></html>
