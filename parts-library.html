<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Parts Room | TruckFixHub</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#29aaff,#eaf9ff 30%,#d6e4eb);color:#111}.w{max-width:980px;margin:auto;padding:12px 12px 80px}.top{display:flex;justify-content:space-between;background:#fff;border:4px solid #111;border-radius:20px;padding:12px;box-shadow:0 6px 0 #607887}.top a{font-weight:1000;color:#075fae;text-decoration:none}.hero{text-align:center;background:#fff;border:5px solid #111;border-radius:28px;margin:18px 0;padding:18px;box-shadow:0 7px 0 #6e8795}.hero .pic{font-size:65px}.hero h1{margin:0;font-size:clamp(34px,8vw,52px)}.hero p{font-weight:900}.card{background:#fff;border:4px solid #111;border-radius:24px;padding:15px;margin:14px 0;box-shadow:0 6px 0 #718692}.add{background:linear-gradient(#4ee07c,#079a42)}.searchbox{background:linear-gradient(#48adff,#0765ce)}.card h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}input,textarea{width:100%;padding:13px;border:3px solid #111;border-radius:14px;font:inherit;background:#fff}textarea{grid-column:1/-1}button{padding:13px;border:3px solid #111;border-radius:14px;font-weight:1000;font-size:16px;cursor:pointer}.save{background:#ffe34b}.clear{background:#eee}.search{font-size:18px}.parts{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.part{background:#fff;border:4px solid #111;border-radius:20px;padding:14px;box-shadow:0 5px 0 #667c89}.part h3{margin:0 0 5px;font-size:22px}.pn{font-size:19px;font-weight:1000;color:#075fae}.meta{font-size:13px;line-height:1.5;margin-top:8px}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;padding:9px;font-size:13px}.edit{background:#42aaff;color:#fff}.delete{background:#ff4b4b;color:#fff}.empty{text-align:center;font-weight:900;padding:25px}.msg{text-align:center;font-weight:900;margin:10px}.private{text-align:center;font-size:13px;font-weight:800}@media(max-width:650px){.grid,.parts{grid-template-columns:1fr}textarea{grid-column:auto}}</style></head><body><main class="w"><nav class="top"><a href="index.html">← HOME</a><b>📦 PARTS ROOM</b><a href="parts-list.html">PARTS DESK →</a></nav><section class="hero"><div class="pic">📦🔧</div><h1>Parts Room</h1><p>Add it once. Save it. Find it again in seconds.</p><div class="private">🔒 Your saved parts are private to your TruckFixHub login.</div></section><section class="card add"><h2>➕ ADD A PART</h2><div class="grid"><input id="pn" placeholder="Part number *"><input id="desc" placeholder="Description"><input id="brand" placeholder="Brand / manufacturer"><input id="price" inputmode="decimal" placeholder="Price each"><input id="availability" placeholder="Location / bin / availability"><input id="alt" placeholder="Alternate / superseded part"><input id="unit" placeholder="Last unit # used on"><textarea id="notes" rows="3" placeholder="Notes"></textarea><button id="save" class="save">💾 SAVE PART</button><button id="clear" class="clear">CLEAR</button></div><div id="msg" class="msg"></div></section><section class="card searchbox"><h2>🔎 MY SAVED PARTS</h2><input id="search" class="search" placeholder="Search part number, description, brand, alternate…"></section><section id="parts" class="parts"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_QhBZPjG4w5RZKvEnOQ8q0w_E8zQuk_j'),$=x=>document.getElementById(x);let me=null,rows=[],editing=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function clearForm(){['pn','desc','brand','price','availability','alt','unit','notes'].forEach(x=>$(x).value='');editing=null;$('save').textContent='💾 SAVE PART'}function render(){const q=$('search').value.toLowerCase().trim(),list=rows.filter(r=>!q||[r.part_number,r.description,r.brand,r.alternative_part,r.availability,r.notes,r.last_unit_number].some(v=>String(v||'').toLowerCase().includes(q)));$('parts').innerHTML=list.length?list.map(r=>`<article class="part"><div class="pn">${esc(r.part_number)}</div><h3>${esc(r.description||'Saved Part')}</h3><div class="meta">${r.brand?'🏷️ '+esc(r.brand)+'<br>':''}${r.price_each!=null?'💲 $'+Number(r.price_each).toFixed(2)+'<br>':''}${r.availability?'📍 '+esc(r.availability)+'<br>':''}${r.alternative_part?'↔️ Alt: '+esc(r.alternative_part)+'<br>':''}${r.last_unit_number?'🚛 Unit: '+esc(r.last_unit_number)+'<br>':''}${r.notes?'📝 '+esc(r.notes):''}</div><div class="actions"><button class="edit" onclick="editPart('${r.id}')">✏️ EDIT</button><button class="delete" onclick="deletePart('${r.id}')">🗑 DELETE</button></div></article>`).join(''):'<div class="card empty">📭 No saved parts match yet.</div>'}async function load(){const u=await db.auth.getUser();me=u.data.user;if(!me){$('msg').textContent='🔒 Sign in through My Trucks to use your private Parts Room.';$('save').disabled=true;return}const r=await db.from('tfh_saved_parts').select('*').eq('user_id',me.id).order('updated_at',{ascending:false});if(r.error){$('msg').textContent='Could not load saved parts.';return}rows=r.data||[];render()}window.editPart=id=>{const r=rows.find(x=>x.id===id);if(!r)return;editing=id;$('pn').value=r.part_number||'';$('desc').value=r.description||'';$('brand').value=r.brand||'';$('price').value=r.price_each??'';$('availability').value=r.availability||'';$('alt').value=r.alternative_part||'';$('unit').value=r.last_unit_number||'';$('notes').value=r.notes||'';$('save').textContent='✓ UPDATE PART';scrollTo({top:0,behavior:'smooth'})};window.deletePart=async id=>{if(!confirm('Remove this part from your Parts Room?'))return;const r=await db.from('tfh_saved_parts').delete().eq('id',id).eq('user_id',me.id);if(r.error)return $('msg').textContent='Could not remove part.';rows=rows.filter(x=>x.id!==id);render();$('msg').textContent='Part removed.'};$('save').onclick=async()=>{if(!me)return;const pn=$('pn').value.trim();if(!pn)return $('msg').textContent='Enter a part number first.';const price=$('price').value.trim()===''?null:Number($('price').value.replace(/[$,]/g,''));if(price!==null&&!Number.isFinite(price))return $('msg').textContent='Price must be a number.';const data={user_id:me.id,part_number:pn,description:$('desc').value.trim()||null,brand:$('brand').value.trim()||null,price_each:price,availability:$('availability').value.trim()||null,alternative_part:$('alt').value.trim()||null,last_unit_number:$('unit').value.trim()||null,notes:$('notes').value.trim()||null,updated_at:new Date().toISOString()};let r;if(editing)r=await db.from('tfh_saved_parts').update(data).eq('id',editing).eq('user_id',me.id).select().single();else r=await db.from('tfh_saved_parts').insert(data).select().single();if(r.error)return $('msg').textContent='Could not save part: '+r.error.message;if(editing)rows=rows.map(x=>x.id===editing?r.data:x);else rows.unshift(r.data);clearForm();render();$('msg').textContent='✓ Part saved in your Parts Room.'};$('clear').onclick=clearForm;$('search').addEventListener('input',render);load();</script></body></html>
