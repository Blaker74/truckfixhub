<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Parts Catalog | TruckFixHub</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f4f7fb;color:#102a49;margin:0}.w{max-width:900px;margin:auto;padding:18px}.hero,.card,.part{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:20px;margin:12px 0}.hero{background:#07182e;color:#fff}.search{width:100%;padding:14px;border:1px solid #9aabba;border-radius:12px;font:inherit}.part h2{margin:0}.small{color:#60758b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:10px;padding:10px 12px;background:#e8eef5;color:#102a49;font-weight:800}.actions .primary{background:#0b3768;color:#fff}a{color:#123f72;font-weight:800;text-decoration:none}</style></head><body><main class="w"><p><a href="parts-list.html">← Parts Desk</a></p><section class="hero"><h1>🔎 TruckFixHub Parts Catalog</h1><p>Search TruckFixHub's shared heavy-duty parts reference. No sign-in required.</p></section><section class="card"><input class="search" id="q" placeholder="Search description, part number, brand or notes…"><p id="status" class="small">Loading parts…</p></section><div id="results"></div></main><script>const q=document.getElementById('q'),out=document.getElementById('results'),status=document.getElementById('status');let rows=[];const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){try{const r=await fetch('parts-catalog.json?v=1',{cache:'no-cache'});if(!r.ok)throw Error();const d=await r.json();rows=Array.isArray(d.parts)?d.parts:[];draw()}catch(e){status.textContent='Parts catalog could not load.'}}function draw(){const s=q.value.trim().toLowerCase(),r=rows.filter(x=>!s||[x.part_number,x.description,x.brand,x.notes].some(v=>String(v||'').toLowerCase().includes(s)));status.textContent=r.length+' part'+(r.length===1?'':'s')+' in catalog';out.innerHTML=r.length?r.map((x,i)=>'<article class="part"><h2>'+esc(x.part_number)+'</h2><div>'+esc(x.description)+'</div><p class="small">'+[x.brand,x.notes].filter(Boolean).map(esc).join(' · ')+'</p><div class="actions"><button class="primary" onclick="addQuote('+i+')">+ Add to Quote</button><button onclick="sharePart('+i+')">📤 Share</button></div></article>').join(''):'<section class="card">No matching parts found.</section>'}window.addQuote=i=>{const x=rows[i],list=JSON.parse(localStorage.getItem('tfh-parts-list')||'[]');list.push({part:[x.part_number,x.description].filter(Boolean).join(' - '),qty:1,price:'',note:[x.brand,x.notes].filter(Boolean).join(' · ')});localStorage.setItem('tfh-parts-list',JSON.stringify(list));location.href='parts-list.html'};window.sharePart=async i=>{const x=rows[i],text=[x.part_number,x.description,x.brand,x.notes].filter(Boolean).join('\n');try{if(navigator.share)await navigator.share({title:'TruckFixHub Part',text});else await navigator.clipboard.writeText(text)}catch(e){}};q.oninput=draw;load();</script></body></html>
