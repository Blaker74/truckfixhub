<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Meet Panta | TruckFixHub</title><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}body{margin:0;background:#07182e;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:650px;margin:auto;min-height:100svh;padding:12px 14px 34px;background:radial-gradient(circle at 50% 25%,#15518a,#07182e 68%)}.brand{text-align:center}.brand img{width:min(480px,92vw);max-height:29svh;object-fit:contain}.pantaCard{text-align:center;margin-top:-14px}.pantaCard img{width:min(250px,55vw);height:220px;object-fit:cover;object-position:center top;border-radius:22px;filter:drop-shadow(0 10px 20px #0008)}.status{display:inline-block;background:#0b3768cc;border:1px solid #4ba7ff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:850;margin-top:-8px}.talk{background:#fff;color:#102a49;border-radius:24px;padding:18px;margin-top:10px;box-shadow:0 12px 32px #0006}.bubble{font-size:19px;font-weight:800;margin-bottom:13px;line-height:1.4}.controls{display:flex;gap:8px}.controls input{flex:1;min-width:0;padding:13px;border:2px solid #b9c9d9;border-radius:14px;font:inherit}.btn{border:0;border-radius:14px;background:#e52525;color:#fff;padding:13px 16px;font-weight:950}.skip{display:block;width:100%;margin-top:10px;border:0;background:transparent;color:#60758b;text-decoration:underline;font:700 13px system-ui;cursor:pointer}.motto{text-align:center;color:#dce8f4;font-weight:800;margin:20px 0 0}@media(max-width:440px){.controls{flex-wrap:wrap}.controls input{width:100%;flex-basis:100%}.pantaCard img{height:205px}}</style></head><body><main class="wrap"><div class="brand"><img src="truckfixhub-logo.png" alt="TruckFixHub — Keeping America Moving"></div><div class="pantaCard"><img src="panta-small.jpg?v=2" alt="Panta, TruckFixHub concierge"><div><span id="status" class="status">Panta is ready to welcome you</span></div></div><section class="talk"><div id="bubble" class="bubble">Hi there! Welcome to TruckFixHub. I’m Panta. I’ll show you around and help you find what you need. What’s your first name?</div><div class="controls"><input id="answer" maxlength="40" autocomplete="given-name" placeholder="Your first name"><button id="send" class="btn">Continue</button></div><button id="skip" class="skip" type="button">Skip my name and show me around</button></section><div class="motto">People Helping People. Keeping America Moving.</div></main><script>const answer=document.getElementById('answer'),bubble=document.getElementById('bubble'),status=document.getElementById('status'),send=document.getElementById('send'),skip=document.getElementById('skip');function go(name){if(name)sessionStorage.setItem('tfh_guest_name',name);else sessionStorage.removeItem('tfh_guest_name');answer.style.display='none';send.style.display='none';skip.style.display='none';bubble.textContent=name?'It’s a pleasure to meet you, '+name+'. Right this way! Tell me what you need and I’ll take you there.':'Absolutely. Right this way! Tell me what you need and I’ll take you there.';status.textContent='Panta is showing you around';setTimeout(()=>location.href='panta-menu.html',1100)}function submit(){const value=answer.value.trim().replace(/[<>]/g,'');if(!value){bubble.textContent='No problem. You can tell me your first name, or tap “Skip my name” and I’ll take you right in.';return}go(value.split(/\s+/)[0])}send.onclick=submit;skip.onclick=()=>go('');answer.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});answer.focus();</script></body></html>
