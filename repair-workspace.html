<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair Workspace | TruckFixHub</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px system-ui}.w{max-width:900px;margin:auto;padding:18px 16px 90px}.hero,.card{background:#fff;border:1px solid #c7d2df;border-radius:19px;padding:20px;margin:12px 0}.hero{background:#07182e;color:#fff}input,textarea,select,button,.btn{width:100%;padding:12px;border:1px solid #9aabba;border-radius:11px;font:inherit}.grid,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-weight:800;margin:8px 0 4px}.btn,button{display:block;background:#0b3768;color:#fff;border:0;text-decoration:none;text-align:center;font-weight:900}.secondary{background:#e8eef5;color:#102a49}.truck{background:#edf3f8;border-radius:14px;padding:14px}.small{color:#60758b;font-size:13px}.top a{margin-right:15px;color:#123f72;font-weight:900;text-decoration:none}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182e;padding:8px}.nav a{color:#fff;text-align:center;text-decoration:none;font-size:11px}.nav b{display:block;font-size:20px}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><main class="w"><p class="top"><a href="repair-inbox.html">← Repair Inbox</a><a href="my-garage.html">My Garage</a></p><section class="hero"><h1>🔧 Repair Workspace</h1><p>Driver → Mechanic → Parts. The truck information follows the repair.</p></section><div id="notice" class="card">Open a job from Repair Inbox to work on it.</div><section id="jobcard" class="card" hidden><h2 id="title">Repair Job</h2><div class="truck" id="truck"></div><div class="grid"><div><label>Status</label><select id="status"><option value="reported">Problem Reported</option><option value="shop_contacted">Shop Contacted</option><option value="diagnosing">Diagnosing</option><option value="parts_requested">Parts Requested</option><option value="waiting_parts">Waiting on Parts</option><option value="repairing">Repairing</option><option value="completed">Completed</option></select></div><div><label>Shop response</label><input id="shop"></div></div><label>Confirmed diagnosis</label><textarea id="diagnosis" rows="4"></textarea><label>Parts needed / request to Parts Desk</label><textarea id="parts" rows="4"></textarea><label>Repair performed / What fixed it?</label><textarea id="fixed" rows="4"></textarea><div class="actions"><button id="save">💾 Save Repair Update</button><a id="partsDesk" class="btn secondary">📦 Send to Parts Desk</a></div><p id="msg" class="small"></p></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="fix-my-truck.html"><b>🚨</b>Repair</a><a href="repair-inbox.html"><b>🔔</b>Inbox</a><a href="parts-list.html"><b>📦</b>Parts</a><a href="my-garage.html"><b>🚛</b>Garage</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_QhBZPjG4w5RZKvEnOQ8q0w_E8zQuk_j'),$=x=>document.getElementById(x),jid=new URLSearchParams(location.search).get('job');let job=null;const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){if(!jid)return;const {data:{session}}=await db.auth.getSession();if(!session){$('notice').textContent='Sign in to open this private Repair Job.';return}const r=await db.from('tfh_repair_jobs').select('*').eq('id',jid).single();if(r.error){$('notice').textContent='Repair Job could not be loaded.';return}job=r.data;$('notice').hidden=true;$('jobcard').hidden=false;$('title').textContent='Repair Job #'+job.job_number;$('truck').innerHTML='<b>'+(job.unit_number?'Unit '+esc(job.unit_number):'Truck')+'</b><br>'+[job.vin&&'VIN: '+esc(job.vin),job.engine&&'Engine: '+esc(job.engine),job.engine_serial&&'ESN: '+esc(job.engine_serial),job.mileage&&'Mileage: '+esc(job.mileage),job.fault_code&&'Fault: '+esc(job.fault_code)].filter(Boolean).join('<br>')+(job.symptoms?'<hr><b>Driver symptoms:</b><br>'+esc(job.symptoms):'');$('status').value=job.status;$('shop').value=job.shop_response||'';$('diagnosis').value=job.diagnosis||'';$('parts').value=job.parts_request||'';$('fixed').value=job.what_fixed_it||job.repair_performed||'';$('partsDesk').href='parts-list.html?job='+job.id} $('save').onclick=async()=>{if(!job)return;const st=$('status').value,p={status:st,shop_response:$('shop').value.trim()||null,diagnosis:$('diagnosis').value.trim()||null,parts_request:$('parts').value.trim()||null,what_fixed_it:$('fixed').value.trim()||null,repair_performed:$('fixed').value.trim()||null,completed_at:st==='completed'?new Date().toISOString():null};const r=await db.from('tfh_repair_jobs').update(p).eq('id',job.id);$('msg').textContent=r.error?'Could not save: '+r.error.message:'✓ Repair Job updated. The next person now sees this information.';if(!r.error)job={...job,...p}};load();</script></body></html>
