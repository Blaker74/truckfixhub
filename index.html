<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TruckFixHub | Meet Panta</title><meta name="description" content="Welcome to TruckFixHub. Meet Panta, your friendly heavy-duty truck concierge."><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://truckfixhub.com/"><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07182e;font-family:system-ui,-apple-system,sans-serif}.screen{min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px 12px 18px;background:radial-gradient(circle at 50% 42%,#174d82 0,#0b3768 40%,#07182e 80%);text-align:center}.stage{width:min(650px,100%);display:flex;flex-direction:column;align-items:center}.logo{width:min(520px,91vw);height:auto;max-height:27svh;object-fit:contain;filter:drop-shadow(0 10px 22px #0007);margin:0 auto -18px}.pantaWrap{position:relative;width:min(280px,57vw);height:min(300px,34svh);overflow:hidden;margin:0 auto -5px;animation:breathe 4s ease-in-out infinite}.panta{width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:24px;filter:drop-shadow(0 10px 18px #0007)}.welcome{position:relative;z-index:3;width:min(535px,94vw);background:#fff;color:#102a49;border-radius:23px;padding:14px 15px 15px;box-shadow:0 12px 30px #0007}.bubble{font-size:17px;font-weight:850;line-height:1.35;margin:0 0 11px}.controls{display:flex;gap:8px}.controls input{flex:1;min-width:0;padding:13px 14px;border:2px solid #b8c8d8;border-radius:14px;font-size:16px;outline:none}.controls input:focus{border-color:#2769a6}.btn{border:0;border-radius:14px;background:#e52525;color:#fff;padding:13px 17px;font-size:16px;font-weight:950;cursor:pointer}.sound{margin-top:9px;border:0;background:transparent;color:#49647e;font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer}.motto{color:#dce8f4;font-size:12px;font-weight:800;margin-top:11px}@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.008)}}@media(max-width:460px){.screen{padding:6px 8px 12px}.logo{width:93vw;max-height:25svh;margin-bottom:-15px}.pantaWrap{width:54vw;height:31svh}.welcome{padding:12px}.bubble{font-size:16px}.controls{flex-wrap:wrap}.controls input{flex-basis:100%}.btn{width:100%;padding:12px}.motto{margin-top:8px}}</style></head><body><main class="screen"><div class="stage"><img class="logo" src="truckfixhub-logo.png" alt="TruckFixHub — Keeping America Moving"><div class="pantaWrap"><img class="panta" src="panta-small.jpg?v=2" alt="Panta, your TruckFixHub concierge"></div><section class="welcome"><div id="bubble" class="bubble">Hi there! Welcome to TruckFixHub. I’m Panta. I’ll be your personal concierge. Before I show you around, may I ask your first name?</div><div class="controls"><input id="name" maxlength="40" autocomplete="given-name" placeholder="Type your first name"><button id="enter" class="btn" type="button">Meet Panta</button></div><button id="sound" class="sound" type="button">🔊 Hear Panta welcome me</button></section><div class="motto">People Helping People. Keeping America Moving.</div></div></main><script>const nameBox=document.getElementById('name'),enter=document.getElementById('enter'),bubble=document.getElementById('bubble'),sound=document.getElementById('sound');const welcome="Hi there! Welcome to TruckFixHub. I'm Panta. I'll be your personal concierge. Before I show you around, may I ask your first name?";function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.91;u.pitch=1.08;u.volume=1;const voices=speechSynthesis.getVoices();const preferred=voices.find(v=>/samantha|ava|allison|female/i.test(v.name)&&/en/i.test(v.lang))||voices.find(v=>/en-US/i.test(v.lang));if(preferred)u.voice=preferred;speechSynthesis.speak(u)}sound.onclick=()=>speak(welcome);function proceed(){let n=nameBox.value.trim().replace(/[<>]/g,'').split(/\s+/)[0];if(!n){bubble.textContent="I'd love to know what to call you. Just type your first name below.";nameBox.focus();return}sessionStorage.setItem('tfh_guest_name',n);const msg="It's a pleasure to meet you, "+n+". Right this way, sir or ma'am. I'll show you everything TruckFixHub can do for you.";bubble.textContent=msg;speak(msg);enter.disabled=true;nameBox.disabled=true;setTimeout(()=>location.href='panta-menu.html',2300)}enter.onclick=proceed;nameBox.addEventListener('keydown',e=>{if(e.key==='Enter')proceed()});</script></body></html>
