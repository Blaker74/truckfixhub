<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TruckFixHub | Panta Concierge</title><meta name="description" content="TruckFixHub — People Helping People. Keeping America Moving."><link rel="canonical" href="https://truckfixhub.com/"><meta name="theme-color" content="#06192e"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06192e;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hero{min-height:100svh;position:relative;overflow:hidden;background:linear-gradient(180deg,#071c32,#06182b);display:flex;align-items:center;justify-content:center}.scene{position:relative;width:min(100%,1100px);height:100svh;min-height:650px;background:url('panta-approved.png') center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#03132210 0%,#03132200 70%,#03132255 100%);pointer-events:none}.nameCard{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(540px,92%);padding:14px 15px 15px;border-radius:22px;background:#f8fbffed;border:2px solid #55b7f3;box-shadow:0 14px 34px #0008;text-align:center}.question{margin:0 0 10px;color:#0b2d52;font-size:18px;line-height:1.25;font-weight:900}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;border:2px solid #9fc9e4;border-radius:14px;padding:13px 14px;font-size:16px;color:#102a49;background:#fff}.row button{border:0;border-radius:14px;background:#e5222a;color:#fff;padding:13px 18px;font-weight:950;font-size:16px;cursor:pointer}.tiny{margin:8px 0 0;color:#526a80;font-size:11px;font-weight:750}.speaker{position:absolute;right:18px;top:18px;width:48px;height:48px;border:2px solid #5dc4ff;border-radius:50%;background:#0b3c68dd;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 20px #0006}.mobileLogo{display:none}@media(max-width:600px){.scene{width:100%;height:100svh;min-height:620px;background-position:38% center}.nameCard{bottom:max(12px,env(safe-area-inset-bottom));padding:12px}.question{font-size:17px}.row{flex-wrap:wrap}.row input,.row button{width:100%;flex-basis:100%}.row button{padding:12px}.speaker{top:12px;right:12px}}</style></head><body><main class="hero"><section class="scene" aria-label="Panta welcomes you to TruckFixHub"><div class="shade"></div><button id="speaker" class="speaker" aria-label="Hear Panta">🔊</button><div class="nameCard"><p id="question" class="question">Before we get started, may I ask your first name?</p><div class="row"><input id="name" maxlength="40" autocomplete="given-name" placeholder="Type your first name…"><button id="continue" type="button">CONTINUE</button></div><p class="tiny">Your private tools will require login when needed.</p></div></section></main><script>const box=document.getElementById('name'),btn=document.getElementById('continue'),q=document.getElementById('question'),speaker=document.getElementById('speaker');const greeting="Good morning! Welcome to TruckFixHub. I'm Panta, your concierge. May I ask your name?";function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.92;u.pitch=1.04;const vs=speechSynthesis.getVoices();const v=vs.find(x=>/samantha|ava|allison/i.test(x.name)&&/en/i.test(x.lang))||vs.find(x=>/en-US/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}speaker.onclick=()=>speak(greeting);function go(){const n=box.value.trim().replace(/[<>]/g,'').split(/\s+/)[0];if(!n){q.textContent="May I ask your first name?";box.focus();return}sessionStorage.setItem('tfh_guest_name',n);q.textContent="It's a pleasure to meet you, "+n+". Right this way.";setTimeout(()=>location.href='panta-menu.html',900)}btn.onclick=go;box.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
