<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TruckFixHub makes heavy-duty truck diagnostics and everyday shop organization simple with visual guides, private tools, and a truck community.">
<title>TruckFixHub | Keeping Trucking Simple</title>
<link rel="stylesheet" href="app.css">
<style>
body{min-height:100vh;background:#f4f7fb}.welcome{max-width:760px;margin:auto;padding:18px}.brand-logo{display:block;width:100%;max-width:650px;height:auto;margin:0 auto 8px}.tag{text-align:center;font-size:clamp(18px,4vw,25px);font-weight:1000;margin:8px 0 22px}.start-card{background:#fff;border:5px solid #1769aa;border-radius:24px;padding:20px;box-shadow:0 8px 20px #0002}.start-card h1{text-align:center;font-size:clamp(28px,7vw,44px);margin:0 0 8px}.start-card>p{text-align:center;font-size:clamp(18px,4vw,23px);font-weight:800;margin:0 0 18px}.big-actions{display:grid;gap:14px}.big-actions a{display:flex;align-items:center;gap:16px;min-height:82px;padding:14px 18px;border:4px solid #111;border-radius:18px;text-decoration:none;color:#111;font-size:clamp(21px,5vw,28px);font-weight:1000;box-shadow:0 5px 0 #111}.big-actions a:active{transform:translateY(4px);box-shadow:0 1px 0 #111}.icon{font-size:36px;min-width:44px;text-align:center}.diagnose{background:#ffd83d}.diagrams{background:#5fd3ff}.community{background:#70e08a}.tools{background:#ff8a1c}.search-wrap{margin-top:20px;padding-top:18px;border-top:3px solid #d7dce3}.search-wrap label{display:block;text-align:center;font-size:20px;font-weight:1000;margin-bottom:9px}.search-row{display:flex;gap:8px}.search-row input{flex:1;min-width:0;margin:0;background:#fff;font-size:18px;border:3px solid #111;border-radius:14px;padding:14px}.search-row button{margin:0;background:#1769aa;color:#fff;border:3px solid #111;border-radius:14px;font-size:20px;font-weight:1000;padding:10px 18px}.search-help{text-align:center;font-size:14px;font-weight:800;margin:9px 0 0}.mail{display:block;text-align:center;margin:20px auto 0;font-weight:900;color:#111;text-decoration:none}.legal{text-align:center;margin:14px 0;font-size:13px}.legal a{color:#111;margin:0 6px}@media(max-width:560px){.welcome{padding:10px}.start-card{padding:14px;border-width:4px}.big-actions a{min-height:74px;padding:12px}.search-row{display:grid}.search-row button{min-height:54px}}
</style>
</head>
<body>
<main class="shell welcome">
<header>
<img class="brand-logo" src="truckfixhub-logo.jpeg" alt="TruckFixHub — Keeping America Moving">
<div class="tag">KEEPING TRUCKING SIMPLE</div>
</header>
<section class="start-card">
<h1>What do you need?</h1>
<p>Pick one. We’ll take you straight there.</p>
<div class="big-actions">
<a class="diagnose" href="diagnostic.html"><span class="icon">🛠️</span><span>Diagnose My Truck</span></a>
<a class="diagrams" href="diagnostic-diagrams.html"><span class="icon">🧩</span><span>Diagnostic Diagrams</span></a>
<a class="community" href="community.html"><span class="icon">🤝</span><span>Ask the Community</span></a>
<a class="tools" href="account.html?next=dashboard.html"><span class="icon">🔐</span><span>My Private Tools</span></a>
</div>
<div class="search-wrap">
<label for="siteSearch">Or find a diagnostic guide</label>
<div class="search-row"><input id="siteSearch" placeholder="Low boost, air brakes, DPF, no crank…"><button id="goSearch">GO</button></div>
<p class="search-help">Searches TruckFixHub’s visual diagnostic library.</p>
</div>
</section>
<a class="mail" href="mailto:support@truckfixhub.com">📧 support@truckfixhub.com</a>
<div class="legal"><a href="about.html">About</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="contact.html">Contact</a></div>
</main>
<script>
const s=document.getElementById('siteSearch');function go(){const q=s.value.trim();if(!q)return s.focus();location.href='search.html?q='+encodeURIComponent(q)}document.getElementById('goSearch').onclick=go;s.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body>
</html>
