<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>TruckFixHub | Panta</title><meta name="theme-color" content="#06172d"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#06172d}body{overflow-x:hidden}.mobile-home{position:relative;width:100%;max-width:430px;margin:0 auto}.mobile-home>img{display:block;width:100%;height:auto}.name-hit{position:absolute;left:7.5%;right:7.5%;top:82.2%;height:5.5%;z-index:5}.name-hit input{width:100%;height:100%;border:0;background:transparent;color:#17314d;font:600 18px system-ui,-apple-system,sans-serif;padding:0 13%;outline:none}.name-hit input::placeholder{color:transparent}.continue-hit{position:absolute;left:7.5%;right:7.5%;top:88.2%;height:6%;z-index:6;border:0;background:transparent;cursor:pointer}@media(min-width:431px){html,body{min-height:100vh}body{display:flex;justify-content:center;align-items:flex-start;padding:16px 24px}.mobile-home{width:min(760px,calc(100vw - 48px));max-width:760px;box-shadow:0 0 50px #0009}.name-hit input{font-size:clamp(18px,2vw,30px)}.continue-hit{cursor:pointer}}@media(min-width:1100px){body{padding-top:20px}.mobile-home{width:min(820px,72vh);max-width:820px}}</style></head><body><main class="mobile-home"><img src="a_clean_full_screen_mobile_friendly_app_website.png" alt="TruckFixHub — Panta concierge"><div class="name-hit"><input id="name" autocomplete="given-name" maxlength="40" aria-label="First name"></div><button id="go" class="continue-hit" aria-label="Continue"></button></main><script>const n=document.getElementById('name');function speak(text,done){if(!('speechSynthesis'in window)){done&&done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.84;u.pitch=1.02;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/samantha|ava|allison/i.test(v.name)&&/^en/i.test(v.lang))||vs.find(v=>/^en-US/i.test(v.lang))||null;u.onend=()=>done&&done();speechSynthesis.speak(u)}function go(){const name=n.value.trim().replace(/[<>]/g,'').split(/\s+/)[0];if(!name){n.focus();return}localStorage.setItem('tfh_guest_name',name);sessionStorage.setItem('tfh_guest_name',name);speak(`Nice to meet you, ${name}. Right this way.`,()=>setTimeout(()=>location.href='panta-menu.html',250))}document.getElementById('go').onclick=go;n.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
