<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TruckFixHub | Panta</title><meta name="description" content="TruckFixHub — People Helping People. Keeping America Moving."><link rel="canonical" href="https://truckfixhub.com/"><meta name="theme-color" content="#06172d"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06172d;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}.page{height:100svh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#06172d}.brand{height:54px;display:flex;align-items:center;justify-content:center;color:white;font-size:clamp(28px,8vw,40px);font-weight:1000;font-style:italic;letter-spacing:-2px;text-shadow:0 2px #000,0 0 14px #299cff}.brand span{color:#45a9ff}.stage{position:relative;min-height:0;overflow:hidden;background:#07182e}.scene,.panta{position:absolute;inset:0;background-image:url('a_highly_detailed_cinematic_futuristic_sci_fi_we.png');background-repeat:no-repeat;background-size:auto 100%;background-position:16% center}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 58%,#06172d 78% 100%)}.panta{z-index:2;clip-path:polygon(0 0,58% 0,58% 100%,0 100%);transform-origin:28% 55%;animation:panta 3.2s ease-in-out infinite;pointer-events:none}.sound{position:absolute;z-index:5;right:12px;top:12px;border:2px solid #72c7ff;background:#08365fee;color:#fff;border-radius:999px;padding:10px 13px;font-size:14px;font-weight:900}.panel{z-index:10;background:#f7f9fc;color:#0b2948;border-radius:24px 24px 0 0;padding:13px 16px max(12px,env(safe-area-inset-bottom));box-shadow:0 -10px 30px #00102055}.question{text-align:center;font-weight:1000;font-size:clamp(18px,5vw,22px);line-height:1.12;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr auto;gap:9px}.name{min-width:0;border:2px solid #a9c3d8;border-radius:14px;padding:13px;font-size:17px;color:#102d4c}.continue{border:0;border-radius:14px;background:#e21e26;color:#fff;padding:0 18px;font-size:17px;font-weight:1000;box-shadow:0 5px #981017}.speaking .panta{animation:pantaTalk .55s ease-in-out infinite alternate}@keyframes panta{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(.25deg)}}@keyframes pantaTalk{0%{transform:translateY(1px) rotate(-.2deg)}100%{transform:translateY(-8px) rotate(.3deg)}}@media(max-height:700px){.brand{height:44px;font-size:28px}.panel{padding-top:10px}.question{font-size:18px}.name{padding:11px}.stage{min-height:260px}}@media(min-width:700px){.scene,.panta{background-size:cover;background-position:center}.scene:after{background:linear-gradient(90deg,transparent 0 64%,#06172d99 88%)}.panta{clip-path:polygon(0 0,62% 0,62% 100%,0 100%)}.panel{max-width:760px;width:100%;margin:auto;border-radius:24px 24px 0 0}}</style></head><body><main class="page"><div class="brand">TRUCK<span>FIX</span>HUB</div><section id="stage" class="stage"><div class="scene"></div><div class="panta" aria-hidden="true"></div><button id="sound" class="sound" type="button">🔊 HEAR PANTA</button></section><section class="panel"><p id="question" class="question">Hi, I’m Panta. What’s your first name?</p><div class="row"><input id="name" class="name" autocomplete="given-name" maxlength="40" placeholder="First name"><button id="go" class="continue" type="button">CONTINUE →</button></div></section></main><script>const stage=document.getElementById('stage'),q=document.getElementById('question'),n=document.getElementById('name');function speak(text,done){if(!('speechSynthesis'in window)){done&&done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.84;u.pitch=1.02;u.volume=1;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/samantha|ava|allison/i.test(v.name)&&/^en/i.test(v.lang))||vs.find(v=>/^en-US/i.test(v.lang))||null;u.onstart=()=>stage.classList.add('speaking');u.onend=()=>{stage.classList.remove('speaking');done&&done()};u.onerror=()=>stage.classList.remove('speaking');speechSynthesis.speak(u)}document.getElementById('sound').onclick=()=>speak('Hi. I’m Panta. What’s your first name?');function go(){const name=n.value.trim().replace(/[<>]/g,'').split(/\s+/)[0];if(!name){n.focus();return}localStorage.setItem('tfh_guest_name',name);sessionStorage.setItem('tfh_guest_name',name);q.textContent=`Nice to meet you, ${name}. Right this way.`;speak(`Nice to meet you, ${name}. Right this way.`,()=>setTimeout(()=>location.href='panta-menu.html',350))}document.getElementById('go').onclick=go;n.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
