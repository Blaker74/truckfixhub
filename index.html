<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TruckFixHub | Panta</title><meta name="description" content="TruckFixHub — People Helping People. Keeping America Moving."><link rel="canonical" href="https://truckfixhub.com/"><meta name="theme-color" content="#06172d"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06172d;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}.page{height:100dvh;max-height:100dvh;display:grid;grid-template-rows:48px minmax(0,1fr) 154px;background:#06172d}.brand{display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(26px,7.5vw,36px);font-weight:1000;font-style:italic;letter-spacing:-2px;text-shadow:0 2px #000,0 0 14px #299cff}.brand span{color:#45a9ff}.stage{position:relative;min-height:0;overflow:hidden;background:#07182e}.art{position:absolute;inset:0;background-image:url('a_highly_detailed_cinematic_futuristic_sci_fi_we.png');background-repeat:no-repeat;background-size:cover;background-position:center 42%}.sound{position:absolute;z-index:5;right:10px;top:10px;border:2px solid #72c7ff;background:#08365fee;color:#fff;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:900}.panel{z-index:10;background:#f7f9fc;color:#0b2948;border-radius:22px 22px 0 0;padding:11px 14px max(10px,env(safe-area-inset-bottom));box-shadow:0 -8px 25px #00102055;overflow:hidden}.question{text-align:center;font-weight:1000;font-size:19px;line-height:1.05;margin:0 0 9px}.row{display:grid;grid-template-columns:minmax(0,1fr) 42%;gap:8px;height:55px}.name{width:100%;min-width:0;border:2px solid #a9c3d8;border-radius:13px;padding:10px 12px;font-size:16px;color:#102d4c}.continue{min-width:0;border:0;border-radius:13px;background:#e21e26;color:#fff;padding:0 8px;font-size:15px;font-weight:1000;box-shadow:0 4px #981017;white-space:nowrap}@media(max-height:760px){.page{grid-template-rows:42px minmax(0,1fr) 137px}.brand{font-size:27px}.panel{padding-top:9px}.question{font-size:17px;margin-bottom:7px}.row{height:49px}.name{font-size:15px}.continue{font-size:14px}.sound{font-size:12px;padding:8px 10px}}@media(min-width:700px){.page{grid-template-rows:58px minmax(0,1fr) 160px}.panel{width:min(760px,100%);margin:auto;border-radius:22px 22px 0 0}.art{background-position:center}}</style></head><body><main class="page"><div class="brand">TRUCK<span>FIX</span>HUB</div><section class="stage"><div class="art" aria-label="Panta"></div><button id="sound" class="sound" type="button">🔊 HEAR PANTA</button></section><section class="panel"><p id="question" class="question">Hi, I’m Panta. What’s your first name?</p><div class="row"><input id="name" class="name" autocomplete="given-name" maxlength="40" placeholder="First name"><button id="go" class="continue" type="button">CONTINUE →</button></div></section></main><script>const q=document.getElementById('question'),n=document.getElementById('name');function speak(text,done){if(!('speechSynthesis'in window)){done&&done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.84;u.pitch=1.02;u.volume=1;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/samantha|ava|allison/i.test(v.name)&&/^en/i.test(v.lang))||vs.find(v=>/^en-US/i.test(v.lang))||null;u.onend=()=>done&&done();speechSynthesis.speak(u)}document.getElementById('sound').onclick=()=>speak('Hi. I’m Panta. What’s your first name?');function go(){const name=n.value.trim().replace(/[<>]/g,'').split(/\s+/)[0];if(!name){n.focus();return}localStorage.setItem('tfh_guest_name',name);sessionStorage.setItem('tfh_guest_name',name);q.textContent=`Nice to meet you, ${name}. Right this way.`;speak(`Nice to meet you, ${name}. Right this way.`,()=>setTimeout(()=>location.href='panta-menu.html',350))}document.getElementById('go').onclick=go;n.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
