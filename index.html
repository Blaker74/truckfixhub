<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TruckFixHub | Panta Concierge</title><meta name="description" content="TruckFixHub — People Helping People. Keeping America Moving."><link rel="canonical" href="https://truckfixhub.com/"><meta name="theme-color" content="#06172d"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06172d;font-family:system-ui,-apple-system,sans-serif;color:#fff}.page{min-height:100svh;display:flex;flex-direction:column;overflow:hidden}.brand{text-align:center;padding:10px 8px 5px;font-weight:1000;font-style:italic;font-size:clamp(30px,9vw,46px);letter-spacing:-2px;text-shadow:0 3px #000,0 0 18px #299cff}.brand span{color:#4caeff}.stage{position:relative;flex:1;min-height:500px;overflow:hidden;background:#07182e}.art{position:absolute;width:150%;aspect-ratio:3/2;left:-25%;top:50%;transform:translateY(-50%);animation:breathe 5s ease-in-out infinite;transform-origin:40% 48%}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 72%,#06172d99);pointer-events:none}.sound{position:absolute;z-index:8;right:14px;top:14px;border:2px solid #72c7ff;background:#08365fee;color:#fff;border-radius:999px;padding:12px 15px;font-weight:900}.panel{background:#f7f9fc;color:#0b2948;border-radius:25px 25px 0 0;padding:15px 18px max(20px,env(safe-area-inset-bottom));z-index:10}.question{text-align:center;font-weight:1000;font-size:20px;margin:0 0 12px}.name{width:100%;border:2px solid #a9c3d8;border-radius:15px;padding:15px;font-size:18px;color:#102d4c}.continue{margin-top:10px;width:100%;border:0;border-radius:16px;background:#e21e26;color:#fff;padding:16px;font-size:20px;font-weight:1000;box-shadow:0 6px #981017}@keyframes breathe{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(calc(-50% - 3px)) scale(1.01)}}@media(min-width:700px){.art{width:100%;left:0}.stage{min-height:620px}}</style></head><body><main class="page"><div class="brand">TRUCK<span>FIX</span>HUB</div><section id="stage" class="stage"><div class="art"><img src="a_highly_detailed_cinematic_futuristic_sci_fi_we.png" alt="Panta, TruckFixHub concierge"></div><div class="shade"></div><button id="sound" class="sound" type="button">🔊 HEAR PANTA</button></section><section class="panel"><p id="question" class="question">Before we get started, what’s your name?</p><input id="name" class="name" autocomplete="given-name" maxlength="40" placeholder="Type your first name…"><button id="go" class="continue" type="button">CONTINUE →</button></section></main><script>const q=document.getElementById('question'),n=document.getElementById('name');function speak(text,done){if(!('speechSynthesis'in window)){done&&done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.82;u.pitch=1.03;u.volume=1;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/samantha|ava|allison|female/i.test(v.name))||vs.find(v=>/^en-US/i.test(v.lang))||null;u.onend=()=>done&&done();speechSynthesis.speak(u)}document.getElementById('sound').onclick=()=>speak('Good morning. Welcome to Truck Fix Hub. I’m Panta, your concierge. May I ask your name?');document.getElementById('go').onclick=()=>{const name=n.value.trim().replace(/[<>]/g,'').split(/\s+/)[0];if(!name){q.textContent='May I ask your first name?';n.focus();return}localStorage.setItem('tfh_guest_name',name);sessionStorage.setItem('tfh_guest_name',name);q.textContent=`It’s a pleasure to meet you, ${name}. Right this way!`;speak(`It’s a pleasure to meet you, ${name}. Right this way.`,()=>setTimeout(()=>location.href='panta-menu.html',450))};n.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});</script></body></html>
