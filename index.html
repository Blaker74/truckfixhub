<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TruckFixHub gives trucking professionals private organizational tools plus a public People Helping People community."><title>TruckFixHub | People Helping People</title><link rel="stylesheet" href="app.css"><style>body{min-height:100vh}.welcome{max-width:900px;margin:auto}.brand-logo{display:block;width:100%;height:auto;margin:0 auto 10px}.tag{text-align:center;font-size:24px;font-weight:1000;margin:12px 0 28px}.panta{margin-bottom:18px}.panta-chat{flex:1}.panta-chat strong{font-size:clamp(28px,5vw,38px)}.panta-chat p{font-size:clamp(20px,4vw,28px);font-weight:800;line-height:1.3}.name-row{display:grid;gap:12px;margin-top:14px}.name-row input{margin:0;background:#fff;font-size:20px}.name-row button{background:#ffd83d;color:#111}.question{display:none;margin-top:14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.answers button{min-height:70px;font-size:20px}.yes{background:#ff8a1c;color:#111}.no{background:#2e68b7}.mail{display:block;text-align:center;margin:18px auto 0;font-weight:900;color:#111;text-decoration:none}.legal{text-align:center;margin:14px 0;font-size:13px}.legal a{color:#111;margin:0 6px}@media(max-width:560px){.answers{grid-template-columns:1fr}.panta{align-items:center}}</style></head><body><main class="shell welcome"><header><img class="brand-logo" src="truckfixhub-logo.jpeg" alt="TruckFixHub — Keeping America Moving"><div class="tag">PEOPLE HELPING PEOPLE</div></header><section class="panta"><div class="face">👩‍🔧</div><div class="panta-chat"><strong>Panta</strong><div id="intro"><p>Hi! May I ask your name?</p><div class="name-row"><input id="visitorName" maxlength="40" autocomplete="name" placeholder="Type your name"><button id="meetPanta">THAT'S ME 👋</button></div></div><div class="question" id="question"><p id="questionText"></p><div class="answers"><button class="yes" id="yesCommunity">YES — SHOW ME 🤝</button><button class="no" id="noCommunity">NO — MY PRIVATE TOOLS 🔐</button></div></div></div></section><a class="mail" href="mailto:support@truckfixhub.com">📧 support@truckfixhub.com</a><div class="legal"><a href="about.html">About</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="contact.html">Contact</a></div></main><script>const input=document.getElementById('visitorName'),intro=document.getElementById('intro'),question=document.getElementById('question'),q=document.getElementById('questionText');function ask(){const n=input.value.trim();if(!n)return input.focus();localStorage.setItem('tfh-community-name',n);intro.style.display='none';q.textContent=`Nice to meet you, ${n}! Would you like to visit our People Helping People Community?`;question.style.display='block'}document.getElementById('meetPanta').onclick=ask;input.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});document.getElementById('yesCommunity').onclick=()=>location.href='community.html';document.getElementById('noCommunity').onclick=()=>location.href='account.html?next=dashboard.html';</script></body></html>
