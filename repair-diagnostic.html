<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Diagnostic Review | TruckFixHub</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px/1.55 system-ui}.w{max-width:850px;margin:auto;padding:18px}.hero,.card{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:20px;margin:12px 0}.hero{background:#07182e;color:#fff}.intelrow{padding:14px 0;border-top:1px solid #cbd8e5}.small{color:#60758b;font-size:13px}.btn{display:block;padding:13px;border-radius:11px;background:#0b3768;color:#fff;text-align:center;text-decoration:none;font-weight:900;margin-top:12px}a{color:#0b3768;font-weight:800}.evidence{background:#edf3f8;border-radius:13px;padding:14px}.audit,.knowledge,.research{margin-top:16px}.source{padding:10px 0;border-top:1px solid #d5dee8}.researchitem{padding:12px 0;border-top:1px solid #d5dee8}.warn{background:#fff5df;border-left:4px solid #a65f00;padding:9px;margin-top:8px}</style></head><body><main class="w"><p><a href="repair-inbox.html">← Repair Inbox</a></p><section class="hero"><div>TRUCKFIXHUB REPAIR INTELLIGENCE</div><h1>🧠 Diagnostic Review</h1><p>Evidence first. Possibilities second. Verification before parts.</p></section><section id="status" class="card">Loading diagnostic evidence…</section><section id="main" class="card" hidden><h2 id="title">Repair Job</h2><div id="evidence" class="evidence"></div><div id="intelBody"><b>Analyzing available evidence…</b></div><div id="researchBody" class="research"></div><div id="knowledgeBody" class="knowledge"></div><div id="auditBody" class="audit"></div><a id="workspace" class="btn">Continue to Repair Workspace →</a></section></main><script src="repair-intelligence.js"></script><script src="repair-knowledge.js"></script><script src="repair-research-evidence.js"></script><script src="repair-auditor.js"></script><script>const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const raw=sessionStorage.getItem('tfhDiagnosticPreview');if(!raw)throw new Error('Open a new Repair Job from Fix My Truck to create a diagnostic review.');const d=JSON.parse(raw),j=d.job||{};$('status').hidden=true;$('main').hidden=false;$('title').textContent=d.job_number?'Repair Job #'+d.job_number:'Repair Job Diagnostic Review';$('workspace').href='repair-workspace.html?job='+encodeURIComponent(d.id||'');$('evidence').innerHTML=[j.engine&&'<b>Engine:</b> '+esc(j.engine),j.fault_code&&'<b>Fault:</b> '+esc(j.fault_code),j.system_problem&&'<b>System/problem:</b> '+esc(j.system_problem),j.symptoms&&'<b>Symptoms:</b> '+esc(j.symptoms),j.recent_context&&'<b>What changed recently:</b> '+esc(j.recent_context)].filter(Boolean).join('<br><br>')||'No diagnostic evidence entered yet.';const ranked=window.TFHRepairIntelligence.rank(j,[]);window.TFHRepairIntelligence.render(j,[],'intelBody');const rs=window.TFHResearchEvidence.relevant(j).slice(0,4);$('researchBody').innerHTML='<div style="padding:14px;border:1px solid #8ba9c5;border-radius:12px;background:#f4f9fd"><b>🔎 Applicable Research Evidence</b><p class="small">Curated source-backed evidence that matches the current complaint. It supports investigation; it does not prove a failed component.</p>'+(rs.length?rs.map(r=>'<div class="researchitem"><b>'+esc(r.source)+'</b> · Tier '+r.tier+'<br>'+esc(r.claim)+'<br><span class="small">Document: '+esc(r.document)+' · Published/reviewed: '+esc(r.published)+'</span>'+(r.safety?'<div class="warn"><b>Safety:</b> '+esc(r.safety)+'</div>':'')+'</div>').join(''):'<div class="researchitem">No curated research evidence matches strongly enough yet. TruckFixHub needs more evidence rather than inventing support.</div>')+'</div>';const ks=window.TFHKnowledge.relevant(j).filter(x=>x.match>0).slice(0,5);$('knowledgeBody').innerHTML='<div style="padding:14px;border:1px solid #9db3c8;border-radius:12px;background:#f8fbfe"><b>📚 Trusted Knowledge Priority</b><p class="small">These are the authoritative source families TruckFixHub should consult first for this evidence. A source match is not a diagnosis.</p>'+(ks.length?ks.map(s=>'<div class="source"><b>'+esc(s.name)+'</b> · Tier '+s.tier+'<br><span class="small">Relevant for: '+esc(s.systems.join(', '))+'<br>Use for: '+esc(s.use.join(', '))+'</span></div>').join(''):'<div class="source">No specific authority matched yet. More vehicle/system evidence is needed before selecting a technical source.</div>')+'</div>';window.TFHRepairAuditor.render(j,ranked,'auditBody')}catch(e){$('status').textContent=e.message||'Diagnostic review unavailable.'}</script></body></html>
