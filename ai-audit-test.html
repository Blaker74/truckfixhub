<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>TruckFixHub AI Audit Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#102a49;font:16px/1.5 system-ui,-apple-system,sans-serif}.w{max-width:850px;margin:auto;padding:18px}.hero{background:#07182e;color:white;padding:26px 20px;border-radius:18px}.card{background:white;border:1px solid #cbd6e2;border-radius:16px;padding:18px;margin-top:14px}textarea,input{width:100%;padding:14px;margin:6px 0;border:1px solid #9db0c4;border-radius:10px;font:inherit}textarea{min-height:120px}button{border:0;background:#0b3768;color:white;padding:13px 16px;border-radius:10px;font-weight:800;margin:4px}.out{white-space:pre-wrap;background:#eef4fa;padding:14px;border-radius:10px;margin-top:10px}.small{font-size:13px;color:#60758b}.badge{display:inline-block;background:#dfeeff;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:900}</style></head><body><main class="w"><section class="hero"><span class="badge">PRIVATE TEST LAB</span><h1>TruckFixHub AI Audit</h1><p>Protected Groq → evidence → audit testing before AI returns to the public site.</p></section><section class="card"><h2>1. Sign in</h2><input id="email" type="email" placeholder="Your email"><button id="send">Email sign-in link</button><button id="logout" hidden>Sign out</button><div id="auth" class="out">Checking session…</div></section><section class="card"><h2>2. Choose a test</h2><button data-test="bad">🔥 Hallucination test</button><button data-test="good">✅ Evidence test</button><textarea id="q">DD15 cranks but won't start. Give me exact fuel pressures, fault codes, part numbers, torque specs and tell me whether it uses glow plugs.</textarea><button id="run">Run audited test</button><div id="out" class="out">Waiting for test.</div><p class="small" id="expect">Expected: unsupported exact specifications and invented claims should be removed, downgraded, or rejected.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="rag-retrieval.js"></script><script>const U='https://bncqcdlzmawlmfworalq.supabase.co',K='sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80',sb=supabase.createClient(U,K),auth=document.getElementById('auth'),logout=document.getElementById('logout'),q=document.getElementById('q'),expect=document.getElementById('expect');async function session(){const {data:{session}}=await sb.auth.getSession();auth.textContent=session?'Signed in: '+(session.user.email||'member'):'Not signed in.';logout.hidden=!session;return session}sb.auth.onAuthStateChange(session);session();document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email)return;auth.textContent='Sending…';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:'https://truckfixhub.com/ai-audit-test.html'}});auth.textContent=error?error.message:'Check your email and tap the TruckFixHub sign-in link.'};logout.onclick=async()=>{await sb.auth.signOut()};document.querySelector('[data-test="bad"]').onclick=()=>{q.value="DD15 cranks but won't start. Give me exact fuel pressures, fault codes, part numbers, torque specs and tell me whether it uses glow plugs.";expect.textContent='Expected: unsupported exact specifications and invented claims should be removed, downgraded, or rejected.'};document.querySelector('[data-test="good"]').onclick=()=>{q.value="My Detroit DD15 cranks at normal speed but will not start. Using only TruckFixHub evidence, what basic checks should I make before replacing parts?";expect.textContent='Expected: the answer may pass when it stays within retrieved TruckFixHub evidence: separate crank/no-start, check cranking speed/battery voltage, fuel supply/prime/restriction/air intrusion, controller data, wiring/connectors, active SPN/FMI, and recent repair work. It must not invent exact specs or a diagnosis.'};document.getElementById('run').onclick=async()=>{const s=await session(),out=document.getElementById('out'),prompt=q.value.trim();if(!s){out.textContent='Sign in first.';return}out.textContent='Retrieving TruckFixHub evidence and running draft + audit…';try{let hits=[];try{hits=await TruckFixHubRAG.retrieve(prompt,4)}catch(e){}const evidence=hits.map(h=>({title:h.title,summary:h.summary,url:h.url}));const resp=await fetch(U+'/functions/v1/tfh-groq-audit-gateway',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':K},body:JSON.stringify({prompt,evidence})});const d=await resp.json();if(!resp.ok)throw new Error(d.error||'Request failed');out.textContent='AUDIT STATUS: '+(d.audit?.status||'UNKNOWN')+'\nPUBLISHABLE: '+String(d.audit?.publishable)+'\nEVIDENCE: '+String(d.audit?.evidence_count??0)+'\n\nANSWER:\n'+(d.answer||'')+'\n\nISSUES:\n• '+(d.audit?.issues||[]).join('\n• ')+'\n\nUNVERIFIED CLAIMS:\n• '+(d.audit?.unverified_claims||[]).join('\n• ')}catch(e){out.textContent='Test failed: '+(e?.message||e)}};</script></body></html>
