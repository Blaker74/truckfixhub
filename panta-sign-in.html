<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign In to Panta | TruckFixHub</title><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#102a49;font:17px/1.4 system-ui,-apple-system,sans-serif}.wrap{max-width:520px;margin:auto;padding:22px 14px 60px}.card{background:#fff;border:1px solid #c9d6e3;border-radius:24px;padding:22px;margin-top:14px}.hero{background:#0b3768;color:#fff;text-align:center}.hero img{width:94px;height:94px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid #fff}.hero h1{margin:8px 0 3px}.hero p{margin:0;color:#dce8f4}.field{margin:12px 0}.field label{display:block;font-weight:850;margin-bottom:5px}.field input{width:100%;padding:14px;border:2px solid #b9c9d9;border-radius:14px;font:inherit}.buttons{display:grid;gap:9px;margin-top:15px}button{border:0;border-radius:14px;padding:14px;font:inherit;font-weight:900;background:#e52525;color:#fff}.secondary{background:#0b3768}.status{display:none;margin-top:13px;padding:12px;border-radius:13px;background:#eef4fa;white-space:pre-line}.status.show{display:block}.note,.back{text-align:center;color:#60758b;font-size:13px}.back{display:block;color:#0b3768;font-weight:900;margin-top:16px;text-decoration:none}</style></head><body><main class="wrap"><section class="card hero"><img src="panta-small.jpg?v=2" alt="Panta"><h1>Sign in to Ask Panta</h1><p>Your free Library stays open to everyone. Conversational Panta requires an account.</p></section><section class="card"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Your password"></div><div class="buttons"><button id="signin">Sign In</button><button id="signup" class="secondary">Create Free Account</button></div><div id="status" class="status"></div><p class="note">Signing in protects private features and helps protect TruckFixHub's AI service from anonymous abuse.</p></section><a class="back" href="panta-menu.html">← Back to Panta’s menu</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/+esm';const db=createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),email=document.getElementById('email'),password=document.getElementById('password'),status=document.getElementById('status');const next=new URLSearchParams(location.search).get('next')||'ai-assistant.html';function show(t){status.textContent=t;status.classList.add('show')}const existing=await db.auth.getSession();if(existing.data.session)location.replace(next);document.getElementById('signin').onclick=async()=>{const e=email.value.trim(),p=password.value;if(!e||!p)return show('Enter your email and password.');show('Signing you in…');const{error}=await db.auth.signInWithPassword({email:e,password:p});if(error)return show(error.message);location.replace(next)};document.getElementById('signup').onclick=async()=>{const e=email.value.trim(),p=password.value;if(!e||!p)return show('Enter an email and password first.');show('Creating your account…');const{data,error}=await db.auth.signUp({email:e,password:p,options:{emailRedirectTo:new URL(next,location.href).href}});if(error)return show(error.message);if(data.session)location.replace(next);show('Account created. Check your email to confirm your address, then come back and sign in.')} ;</script></body></html>
