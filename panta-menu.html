<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Panta's Tour | TruckFixHub</title><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}body{margin:0;background:#07182e;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:700px;margin:auto;min-height:100svh;padding:14px;background:radial-gradient(circle at 50% 18%,#15518a,#07182e 62%)}.top{text-align:center}.logo{width:min(420px,88vw);max-height:24svh;object-fit:contain}.panta{width:110px;height:110px;object-fit:cover;object-position:center top;border-radius:50%;border:3px solid #fff;vertical-align:middle}.hello{margin:10px auto 12px;max-width:590px;background:#fff;color:#102a49;border-radius:20px;padding:15px;font-size:18px;font-weight:800;box-shadow:0 10px 25px #0005}.hint{text-align:center;color:#dce8f4;font-size:13px;font-weight:750;margin:0 0 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:0;width:100%;text-align:left;background:#fff;color:#102a49;border-radius:18px;padding:15px;font:inherit;font-weight:900;min-height:94px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 7px 18px #0004;cursor:pointer}.choice:active{transform:scale(.985)}.choice b{font-size:20px}.choice small{display:block;color:#60758b;margin-top:5px;font-weight:650}.private{font-size:11px;color:#8a4b00;margin-top:5px}.escort{position:fixed;inset:0;background:#07182eef;display:none;align-items:center;justify-content:center;padding:24px;z-index:20}.escort.show{display:flex}.escortCard{max-width:430px;width:100%;background:#fff;color:#102a49;border-radius:26px;padding:22px;text-align:center;box-shadow:0 20px 50px #0009}.escortCard img{width:125px;height:125px;object-fit:cover;object-position:center top;border-radius:50%;border:4px solid #0b3768}.escortCard h2{margin:13px 0 7px;font-size:22px}.escortCard p{margin:0;font-size:17px;font-weight:750;line-height:1.4}.motto{text-align:center;color:#dce8f4;font-weight:800;margin:20px 0}@media(max-width:480px){.choices{grid-template-columns:1fr}.choice{min-height:80px}.logo{max-height:21svh}}</style></head><body><main class="wrap"><div class="top"><img class="logo" src="truckfixhub-logo.png" alt="TruckFixHub"><br><img class="panta" src="panta-small.jpg?v=2" alt="Panta"><div id="hello" class="hello">Right this way! What can I help you with today?</div></div><div class="hint">Tap what you need. Panta will take you there.</div><div class="choices"><button class="choice" data-url="parts-library.html" data-place="our Parts Desk" data-msg="We’ll help you find and organize the parts you need."><b>🔧 Parts</b><small>Find parts and organize what you need.</small></button><button class="choice" data-url="truck-repair-shop-directory.html" data-place="our Repair Shop Directory" data-msg="We’ll help you find repair help near you."><b>📍 Find a Repair Shop</b><small>Find repair help near you.</small></button><button class="choice" data-url="community.html" data-place="the TruckFixHub Community" data-msg="Come on in and connect with people in the industry."><b>👥 Community</b><small>Connect, ask questions and help others.</small></button><button class="choice" data-url="fix-my-truck.html" data-place="Repair Help" data-msg="Let’s get the problem organized and point you toward useful resources."><b>📝 Repair Help</b><small>Organize a truck problem and useful resources.</small></button><button class="choice" data-url="my-garage.html" data-place="your private Garage" data-private="1" data-msg="Your truck and VIN information belongs to you, so sign-in is required to keep it private."><b>🚛 My Trucks & VINs</b><small>Keep your truck information organized.</small><span class="private">🔒 Sign-in required for private information.</span></button><button class="choice" data-url="customers.html" data-place="your Customers area" data-private="1" data-msg="Customer information is private, so we’ll ask you to sign in before entering."><b>👤 My Customers</b><small>Keep customer information together.</small><span class="private">🔒 Sign-in required for private information.</span></button><button class="choice" data-url="call-notes.html" data-place="Call Notes" data-private="1" data-msg="Your notes may contain private business information, so sign-in is required."><b>🎙️ Call Notes</b><small>Capture important details quickly.</small><span class="private">🔒 Sign-in required for private information.</span></button><button class="choice" data-url="trip-fuel-cost-calculator.html" data-place="our Fuel Calculator" data-msg="Let’s help you plan that trip and estimate your fuel cost."><b>⛽ Fuel Calculator</b><small>Plan trip fuel costs quickly.</small></button></div><div class="motto">People Helping People. Keeping America Moving.</div></main><div id="escort" class="escort"><div class="escortCard"><img src="panta-small.jpg?v=2" alt="Panta"><h2 id="escortTitle">Right this way!</h2><p id="escortText"></p></div></div><script>const n=sessionStorage.getItem('tfh_guest_name')||'friend',hello=document.getElementById('hello'),escort=document.getElementById('escort'),escortTitle=document.getElementById('escortTitle'),escortText=document.getElementById('escortText');hello.textContent='Right this way, '+n+'! What can I help you with today? I’ll take you wherever you need to go.';document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{const place=btn.dataset.place,url=btn.dataset.url;escortTitle.textContent='Right this way, '+n+'!';escortText.textContent=(btn.dataset.private?'That area is kept private for you. ':'')+btn.dataset.msg+' I’ll take you to '+place+' now.';escort.classList.add('show');setTimeout(()=>location.href=url,1500)}));</script><script src="/truckfixhub-hospitality.js"></script></body></html>
