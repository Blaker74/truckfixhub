<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Panta's Tour | TruckFixHub</title><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}body{margin:0;background:#07182e;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:700px;margin:auto;min-height:100svh;padding:14px;background:radial-gradient(circle at 50% 18%,#15518a,#07182e 62%)}.top{text-align:center}.logo{width:min(420px,88vw);max-height:22svh;object-fit:contain}.panta{width:100px;height:100px;object-fit:cover;object-position:center top;border-radius:50%;border:3px solid #fff}.hello{margin:10px auto 8px;max-width:590px;background:#fff;color:#102a49;border-radius:20px;padding:14px;font-size:18px;font-weight:850;box-shadow:0 10px 25px #0005}.hint{text-align:center;color:#dce8f4;font-size:13px;font-weight:750;margin:0 0 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:0;width:100%;text-align:left;background:#fff;color:#102a49;border-radius:18px;padding:14px;font:inherit;font-weight:900;min-height:88px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 7px 18px #0004;cursor:pointer}.choice:active{transform:scale(.985)}.choice b{font-size:19px}.choice small{display:block;color:#60758b;margin-top:4px;font-weight:650}.private{font-size:11px;color:#8a4b00;margin-top:5px}.featured{grid-column:1/-1;border:3px solid #ffd45c;background:#fffdf5}.featured b{font-size:22px}.coinNote{color:#8a5a00!important;font-weight:850!important}.moreTitle{margin:18px 2px 9px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#dce8f4;text-align:center}.escort{position:fixed;inset:0;background:#07182eef;display:none;align-items:center;justify-content:center;padding:24px;z-index:20}.escort.show{display:flex}.escortCard{max-width:430px;width:100%;background:#fff;color:#102a49;border-radius:26px;padding:22px;text-align:center;box-shadow:0 20px 50px #0009}.escortCard img{width:125px;height:125px;object-fit:cover;object-position:center top;border-radius:50%;border:4px solid #0b3768}.escortCard h2{margin:13px 0 7px;font-size:22px}.escortCard p{margin:0;font-size:17px;font-weight:750;line-height:1.4}.motto{text-align:center;color:#dce8f4;font-weight:800;margin:20px 0}.support{text-align:center;margin:0 0 22px;color:#dce8f4;font-size:13px}.support a{color:#fff;font-weight:850}@media(max-width:480px){.choices{grid-template-columns:1fr}.choice{min-height:76px}.featured{grid-column:auto}.logo{max-height:19svh}}</style></head><body><main class="wrap"><div class="top"><img class="logo" src="truckfixhub-logo.png" alt="TruckFixHub"><br><img class="panta" src="panta-small.jpg?v=2" alt="Panta"><div id="hello" class="hello">What can I help you with?</div></div><div class="hint">Just tap one. I’ll take you there.</div><div class="choices"><button class="choice featured" data-url="ai-assistant.html" data-place="Ask Panta" data-msg="Tell me what the truck is doing and I’ll work through it with you. Verified diagnostic help uses 5 Panta Coins per qualifying answer. If I can’t provide qualifying help, I won’t use your coins."><b>🔧 Ask Panta — Truck Troubleshooting</b><small>Tell Panta what the truck is doing and work through the problem together.</small><small class="coinNote">100 Panta Coins = $5 • up to 20 verified answers • no charge when Panta can’t provide qualifying help</small></button><button class="choice" data-url="parts-library.html" data-place="the Parts Desk" data-msg="Let’s find the parts you need."><b>🔧 I need a part</b><small>Find heavy-duty truck parts.</small></button><button class="choice" data-url="fix-my-truck.html" data-place="Repair Help" data-msg="Tell us what the truck is doing and we’ll help organize the problem."><b>🛠️ My truck needs repair</b><small>Start with the problem or symptom.</small></button><button class="choice" data-url="truck-repair-shop-directory.html" data-place="the Repair Shop Directory" data-msg="Let’s find repair help."><b>📍 Find me a repair shop</b><small>Find a shop when you need one.</small></button><button class="choice" data-url="my-garage.html" data-place="your private Garage" data-private="1" data-msg="Your truck and VIN information belongs to you, so sign-in is required to keep it private."><b>🚛 My trucks & VINs</b><small>Open your saved truck information.</small><span class="private">🔒 Private — sign-in required</span></button><button class="choice" data-url="customers.html" data-place="your Customers area" data-private="1" data-msg="Customer information is private, so we’ll ask you to sign in before entering."><b>👤 My customers</b><small>Open your customer information.</small><span class="private">🔒 Private — sign-in required</span></button><button class="choice" data-url="appointments.html" data-place="your Appointments area" data-private="1" data-msg="Appointments can contain customer, truck, contact and schedule information, so we keep them behind your sign-in."><b>📅 My appointments</b><small>Open appointments and reminders.</small><span class="private">🔒 Private — sign-in required</span></button></div><div class="moreTitle">More ways I can help</div><div class="choices"><button class="choice" data-url="library-of-contents.html" data-place="Panta’s Library of Contents" data-msg="This searches the technical information stored in my brain."><b>📚 Library of Contents</b><small>Search Panta’s technical brain directly.</small></button><button class="choice" data-url="call-notes.html" data-place="Call Notes" data-private="1" data-msg="Your notes may contain private business information, so sign-in is required."><b>🎙️ Take a call note</b><small>Capture an important conversation.</small><span class="private">🔒 Private — sign-in required</span></button><button class="choice" data-url="community.html" data-place="the TruckFixHub Community" data-msg="Come on in and connect with truck people."><b>👥 Community</b><small>Ask, answer and help others.</small></button><button class="choice" data-url="trip-fuel-cost-calculator.html" data-place="the Fuel Calculator" data-msg="Let’s estimate your trip fuel cost."><b>⛽ Fuel cost</b><small>Estimate a trip quickly.</small></button><button class="choice" data-url="gear.html" data-place="TruckFixHub Gear" data-msg="Take a look at our official TruckFixHub T-shirts, mugs and gear."><b>👕☕ TruckFixHub Gear</b><small>Shop official T-shirts, mugs and gear.</small></button><button class="choice" data-url="contact.html" data-place="TruckFixHub Support" data-msg="If something isn’t working or you need a real person to look into it, our support inbox is ready to help."><b>✉️ Contact support</b><small>Email support@truckfixhub.com.</small></button></div><div class="motto">People Helping People. Keeping America Moving.</div><div class="support">Need help with the site? <a href="mailto:support@truckfixhub.com">support@truckfixhub.com</a></div></main><div id="escort" class="escort"><div class="escortCard"><img src="panta-small.jpg?v=2" alt="Panta"><h2 id="escortTitle">Right this way!</h2><p id="escortText"></p></div></div><script>const saved=sessionStorage.getItem('tfh_guest_name')||'',hello=document.getElementById('hello'),escort=document.getElementById('escort'),escortTitle=document.getElementById('escortTitle'),escortText=document.getElementById('escortText');hello.textContent=saved?'What can I help you with, '+saved+'?':'What can I help you with?';document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{const place=btn.dataset.place,url=btn.dataset.url;escortTitle.textContent=saved?'Right this way, '+saved+'!':'Right this way!';escortText.textContent=(btn.dataset.private?'That area is kept private for you. ':'')+btn.dataset.msg+' I’ll take you to '+place+' now.';escort.classList.add('show');setTimeout(()=>location.href=url,1100)}));</script></body></html>
