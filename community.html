<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Community | TruckFixHub</title><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#102a49;font:16px/1.45 system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:14px 12px 95px}.top{display:flex;justify-content:space-between;align-items:center}.top a{font-weight:900;color:#123f72;text-decoration:none}.hero,.composer,.post{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:17px;margin:12px 0}.hero{background:linear-gradient(145deg,#07182e,#123f72);color:#fff}.hero h1{font-size:38px;line-height:1;margin:8px 0}.hero p{color:#e6edf5}.privacy{background:#eaf3fb;border:1px solid #aac2d8;border-radius:12px;padding:11px;margin:8px 0;color:#123f72;font-size:14px}.profilebar{display:flex;gap:8px;align-items:center;margin-top:12px}.profilebar input{flex:1}.profilebar select{width:145px}.profilebar button{background:#fff;color:#0b3768}textarea,select,input{font:inherit}textarea,select{width:100%;border:1px solid #b8c7d6;border-radius:12px;padding:12px;background:#fff;margin:7px 0}textarea{min-height:105px;resize:vertical}button{font:inherit;font-weight:900;border:0;border-radius:12px;padding:11px 14px}.primary{width:100%;background:#0b3768;color:#fff}.filters{display:flex;gap:7px;overflow:auto;padding:3px 0 7px}.filters button{white-space:nowrap;background:#fff;border:1px solid #b8c7d6;color:#123f72}.filters button.on{background:#0b3768;color:#fff}.meta{font-size:13px;color:#65798d}.badge{display:inline-block;background:#eaf1f7;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:850}.solved{background:#e7f5eb;color:#176b36}.body{font-size:17px;white-space:pre-wrap;margin:12px 0}.author{display:flex;align-items:center;gap:9px;margin:8px 0}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#0b3768;color:#fff;font-weight:950}.rolebadge{font-size:11px;font-weight:850;color:#60758b}.postimg{width:100%;max-height:520px;object-fit:cover;border-radius:14px;margin:7px 0 12px}.photoRow{display:flex;gap:8px;align-items:center;margin:8px 0}.photoBtn{display:inline-block;background:#eaf1f7;color:#123f72;font-weight:900;border-radius:12px;padding:10px 13px}.preview{max-width:100%;max-height:220px;border-radius:12px;display:none}.actions{display:flex;gap:8px;border-top:1px solid #e0e7ee;padding-top:10px}.actions button{flex:1;background:#f1f5f8;color:#123f72}.actions .deleteBtn,.deleteReply{color:#a92c2c;background:#fff2f2;border:1px solid #e5bcbc}.comments{margin-top:10px}.comment{background:#f4f7fa;border-radius:10px;padding:9px;margin:6px 0}.commentHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.deleteReply{padding:5px 8px;font-size:12px;flex:0 0 auto}.commentform{display:flex;gap:7px}.commentform input{min-width:0;flex:1;border:1px solid #b8c7d6;border-radius:10px;padding:10px}.commentform button{background:#0b3768;color:#fff}.notice{text-align:center;color:#65798d;padding:18px}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182ef5;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.nav a{color:#fff;text-decoration:none;text-align:center;font-size:11px;font-weight:850}.nav b{display:block;font-size:20px}@media(max-width:560px){.profilebar{display:grid!important;grid-template-columns:1fr 1fr}.profilebar input{grid-column:1/-1;width:100%;font-size:16px}.profilebar select,.profilebar button{width:100%}.actions{flex-wrap:wrap}}</style></head><body><main><div class="top"><a href="index.html">← TruckFixHub</a><b>Drivers • Techs • Fleets</b></div><section class="hero"><div>TRUCKFIXHUB</div><h1>👥 Community</h1><p>Ask questions. Share experience. Help keep another truck moving.</p><div class="profilebar" id="profilebar" style="display:none"><input id="displayName" maxlength="50" placeholder="Your community name"><select id="role"><option>Driver</option><option>Technician</option><option>Fleet</option><option>Parts Professional</option><option>Shop</option><option>Trucking Community</option></select><button id="saveProfile">Save</button></div><div id="profilemsg" class="meta" style="color:#e6edf5"></div></section><section class="composer"><b>What's happening with your truck?</b><div id="draftnote" class="privacy" style="display:none"></div><select id="cat"><option>Engine & Emissions</option><option>Electrical</option><option>Aftertreatment</option><option>Transmission</option><option>Brakes</option><option>Parts Help</option><option>Roadside Problems</option><option>Shop Talk</option><option selected>General Trucking</option></select><textarea id="body" maxlength="5000" placeholder="Ask a question, describe a problem, or share a tip…"></textarea><div class="photoRow"><label class="photoBtn" for="photo">📷 Add Photo</label><input id="photo" type="file" accept="image/*" style="display:none"><span id="photoname" class="meta">Optional</span></div><img id="preview" class="preview" alt="Photo preview"><button class="primary" id="post">POST PUBLICLY TO COMMUNITY</button><div id="postmsg" class="meta"></div></section><div class="filters"><button class="on" data-cat="all">All</button><button data-cat="Engine & Emissions">Engine</button><button data-cat="Aftertreatment">Emissions</button><button data-cat="Electrical">Electrical</button><button data-cat="Parts Help">Parts</button><button data-cat="Roadside Problems">Roadside</button><button data-cat="Shop Talk">Shop Talk</button></div><section id="feed"><div class="notice">Loading the community…</div></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="fix-my-truck.html"><b>🚨</b>Repair</a><a href="community.html"><b>👥</b>Community</a><a href="repair-inbox.html"><b>🔔</b>Inbox</a><a href="my-garage.html"><b>🚛</b>Garage</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80');let user=null,filter='all',posts=[],comments=[],reactions=[],profiles={},photoFile=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ago=d=>{let s=Math.max(1,(Date.now()-new Date(d))/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'};
async function load(){const ses=await sb.auth.getSession();user=ses.data.session?.user||null;if(user)document.getElementById('profilebar').style.display='flex';const p=await sb.from('tfh_community_posts').select('id,author_id,category,body,solved,created_at,updated_at,image_url').order('created_at',{ascending:false}).limit(100);posts=p.data||[];const ids=posts.map(x=>x.id);comments=[];reactions=[];if(ids.length){const c=await sb.from('tfh_community_comments').select('id,post_id,author_id,body,created_at').in('post_id',ids).order('created_at');comments=c.data||[];const r=await sb.from('tfh_community_reactions').select('post_id,user_id,reaction').in('post_id',ids);reactions=r.data||[]}const uids=[...new Set([...posts.map(x=>x.author_id),...comments.map(x=>x.author_id)])];if(user&&!uids.includes(user.id))uids.push(user.id);if(uids.length){const pr=await sb.from('tfh_community_profiles').select('user_id,display_name,role').in('user_id',uids);(pr.data||[]).forEach(x=>profiles[x.user_id]=x)}if(user&&profiles[user.id]){displayName.value=profiles[user.id].display_name;role.value=profiles[user.id].role}render()}
function render(){let a=posts.filter(p=>filter==='all'||p.category===filter);feed.innerHTML=a.length?a.map(p=>{const cs=comments.filter(c=>c.post_id===p.id),rs=reactions.filter(r=>r.post_id===p.id),mine=user&&rs.some(r=>r.user_id===user.id),pr=profiles[p.author_id],name=pr?.display_name||'TruckFixHub Member',rl=pr?.role||'Community Member';return `<article class="post"><div><span class="badge">${esc(p.category)}</span> ${p.solved?'<span class="badge solved">✓ SOLVED</span>':''}</div><div class="author"><div class="avatar">${esc(name.charAt(0).toUpperCase())}</div><div><b>${esc(name)}</b><div class="rolebadge">${esc(rl)} • ${ago(p.created_at)}</div></div></div><div class="body">${esc(p.body)}</div>${p.image_url?`<img class="postimg" src="${esc(p.image_url)}" alt="Community post photo" loading="lazy">`:''}<div class="actions"><button onclick="helpful('${p.id}')">${mine?'✓ ':''}👍 Helpful (${rs.length})</button><button onclick="sharePost('${p.id}')">↗ Share</button>${user&&p.author_id===user.id?`<button onclick="solve('${p.id}',${!p.solved})">${p.solved?'Reopen':'✓ Mark Solved'}</button><button class="deleteBtn" onclick="deletePost('${p.id}')">🗑 Delete</button>`:''}</div><div class="comments">${cs.map(c=>{const cp=profiles[c.author_id],own=user&&c.author_id===user.id;return `<div class="comment"><div class="commentHead"><div><b>${esc(cp?.display_name||'TruckFixHub Member')}</b> <span class="meta">${cp?.role?'· '+esc(cp.role)+' ':''}• ${ago(c.created_at)}</span></div>${own?`<button class="deleteReply" onclick="deleteComment('${c.id}')">🗑 Delete</button>`:''}</div>${esc(c.body)}</div>`}).join('')}<form class="commentform" onsubmit="comment(event,'${p.id}')"><input maxlength="3000" placeholder="Write a reply…"><button>Reply</button></form></div></article>`}).join(''):'<div class="notice">No posts in this category yet. Start the conversation.</div>'}
post.onclick=async()=>{let txt=body.value.trim();if(!user){postmsg.textContent='Sign in to TruckFixHub to post.';return}if(!txt){postmsg.textContent='Write something first.';return}if(!profiles[user.id]){postmsg.textContent='Add your community name and role above, then tap Save.';return}let image_url=null;if(photoFile){postmsg.textContent='Uploading photo…';const ext=(photoFile.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=user.id+'/'+crypto.randomUUID()+'.'+ext;const up=await sb.storage.from('community-images').upload(path,photoFile,{contentType:photoFile.type,upsert:false});if(up.error){postmsg.textContent='Photo upload failed: '+up.error.message;return}image_url=sb.storage.from('community-images').getPublicUrl(path).data.publicUrl}const {error}=await sb.from('tfh_community_posts').insert({author_id:user.id,category:cat.value,body:txt,image_url});if(error){postmsg.textContent=error.message;return}body.value='';photoFile=null;photo.value='';preview.style.display='none';photoname.textContent='Optional';sessionStorage.removeItem('tfhCommunityDraft');draftnote.style.display='none';postmsg.textContent='Posted publicly!';await load()};
async function comment(ev,id){ev.preventDefault();if(!user){alert('Sign in to reply.');return}let i=ev.target.querySelector('input'),txt=i.value.trim();if(!txt)return;let{error}=await sb.from('tfh_community_comments').insert({post_id:id,author_id:user.id,body:txt});if(error){alert(error.message);return}i.value='';await load()}async function helpful(id){if(!user){alert('Sign in to react.');return}let mine=reactions.find(r=>r.post_id===id&&r.user_id===user.id);if(mine)await sb.from('tfh_community_reactions').delete().eq('post_id',id).eq('user_id',user.id).eq('reaction','helpful');else await sb.from('tfh_community_reactions').insert({post_id:id,user_id:user.id,reaction:'helpful'});await load()}async function sharePost(id){const p=posts.find(x=>x.id===id);if(!p)return;const text=`TruckFixHub Community\n${p.category}\n\n${p.body}\n\ntruckfixhub.com/community.html`;try{if(navigator.share)await navigator.share({title:'TruckFixHub Community',text});else{await navigator.clipboard.writeText(text);alert('Post copied to clipboard.')}}catch(e){if(e.name!=='AbortError')alert('Unable to share this post.')}}async function solve(id,v){let{error}=await sb.from('tfh_community_posts').update({solved:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await load()}
async function deletePost(id){if(!user)return;if(!confirm('Delete this community post? This cannot be undone.'))return;const p=posts.find(x=>x.id===id);if(!p||p.author_id!==user.id){alert('You can only delete your own posts.');return}const{error}=await sb.from('tfh_community_posts').delete().eq('id',id).eq('author_id',user.id);if(error){alert('Could not delete post: '+error.message);return}await load()}
async function deleteComment(id){if(!user)return;if(!confirm('Delete this reply?'))return;const c=comments.find(x=>x.id===id);if(!c||c.author_id!==user.id){alert('You can only delete your own replies.');return}const{error}=await sb.from('tfh_community_comments').delete().eq('id',id).eq('author_id',user.id);if(error){alert('Could not delete reply: '+error.message);return}await load()}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.cat;render()});saveProfile.onclick=async()=>{if(!user)return;const display_name=displayName.value.trim(),r=role.value;if(display_name.length<2){profilemsg.textContent='Enter a community name.';return}const{data,error}=await sb.from('tfh_community_profiles').upsert({user_id:user.id,display_name,role:r,updated_at:new Date().toISOString()},{onConflict:'user_id'}).select().single();if(error){profilemsg.textContent=error.message;return}profiles[user.id]=data;profilemsg.textContent='Profile saved ✓';render()};photo.onchange=e=>{photoFile=e.target.files?.[0]||null;if(!photoFile){preview.style.display='none';return}photoname.textContent=photoFile.name;preview.src=URL.createObjectURL(photoFile);preview.style.display='block'};
try{const raw=sessionStorage.getItem('tfhCommunityDraft');if(raw){const d=JSON.parse(raw);body.value=d.body||'';if(d.category)cat.value=d.category;draftnote.textContent='🔒 Your repair ticket is still private. Only the sanitized text below will become public if you tap POST PUBLICLY TO COMMUNITY. Review or edit it first. No private repair ID, VIN, serial number, mileage, unit number, location, customer or contact information is attached.';draftnote.style.display='block'}}catch(_){sessionStorage.removeItem('tfhCommunityDraft')}load();
</script></body></html>
