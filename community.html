<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community | TruckFixHub</title><meta name="description" content="TruckFixHub Community: people helping people in trucking."><link rel="stylesheet" href="app.css"><style>.feed{display:grid;gap:14px}.post{background:#fff;border:4px solid #111;border-radius:22px;padding:14px;box-shadow:0 5px 0 #718692}.posthead{display:flex;justify-content:space-between;gap:10px;font-weight:900}.post h3{font-size:22px;margin:8px 0}.postbody{white-space:pre-wrap;font-size:17px}.media{display:grid;gap:8px;margin:10px 0}.media img,.media video{width:100%;max-height:520px;object-fit:contain;border:3px solid #111;border-radius:15px;background:#000}.replies{margin:12px 0 0 18px;display:grid;gap:8px}.reply{background:#eaf7ff;border:3px solid #111;border-radius:15px;padding:10px}.replybox{display:flex;gap:6px;margin-top:10px}.replybox input{margin:0}.replybox button{width:auto}.status{font-weight:900;text-align:center}.delete{background:#e21f26!important;width:auto;padding:6px 9px!important;font-size:12px}.who{font-size:13px;color:#53606a}.login{display:block;text-align:center;background:#ffd83d;color:#111;border:3px solid #111;border-radius:14px;padding:12px;text-decoration:none;font-weight:1000}</style></head><body><main class="shell"><div class="top"><a href="index.html">← HOME</a><h1>🤝 COMMUNITY</h1><a href="account.html?next=community.html">🔐 ACCOUNT</a></div><section class="card" style="text-align:center"><h2>PEOPLE HELPING PEOPLE</h2><p>Talk with other people in trucking. Ask questions, reply to each other, and share photos or videos.</p></section><section class="card" id="composer"><h2>Start a conversation</h2><input id="title" maxlength="120" placeholder="What do you want to talk about?"><textarea id="body" rows="5" maxlength="5000" placeholder="Tell the community what is going on…"></textarea><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime,video/webm" multiple><button id="post">POST TO COMMUNITY</button><p class="status" id="status"></p></section><section class="card"><h2>Community feed</h2><div id="feed" class="feed"><p>Loading community…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_QhBZPjG4w5RZKvEnOQ8q0w_E8zQuk_j'),$=x=>document.getElementById(x);let me=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const name=u=>u?.user_metadata?.display_name||u?.user_metadata?.full_name||u?.email?.split('@')[0]||'TruckFixHub Member';function mediaHTML(a){return (a||[]).map(m=>m.type&&m.type.startsWith('video/')?`<video controls preload="metadata" src="${esc(m.url)}"></video>`:`<img loading="lazy" src="${esc(m.url)}" alt="Community upload">`).join('')}async function upload(files){const out=[];for(const f of files){if(f.size>52428800)throw new Error(f.name+' is over the 50 MB limit.');const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${me.id}/${Date.now()}-${crypto.randomUUID()}-${safe}`;const r=await db.storage.from('community-media').upload(path,f,{contentType:f.type,upsert:false});if(r.error)throw r.error;const u=db.storage.from('community-media').getPublicUrl(path);out.push({url:u.data.publicUrl,type:f.type,name:f.name,path})}return out}async function load(){const pr=await db.from('tfh_community_posts').select('id,author_id,author_name,title,body,media,image_url,created_at').order('created_at',{ascending:false}).limit(100),rr=await db.from('tfh_community_replies').select('*').order('created_at',{ascending:true}).limit(500);if(pr.error)return $('feed').innerHTML='<p>Could not load community: '+esc(pr.error.message)+'</p>';const replies=rr.data||[];$('feed').innerHTML=(pr.data||[]).length?(pr.data||[]).map(p=>{const pm=[...(p.media||[])];if(p.image_url&&!pm.some(x=>x.url===p.image_url))pm.push({url:p.image_url,type:'image/jpeg'});const rs=replies.filter(r=>r.post_id===p.id);return `<article class="post"><div class="posthead"><span>👤 ${esc(p.author_name||'Member')}</span><span class="who">${new Date(p.created_at).toLocaleString()}</span></div>${p.title?`<h3>${esc(p.title)}</h3>`:''}<div class="postbody">${esc(p.body)}</div><div class="media">${mediaHTML(pm)}</div>${me&&me.id===p.author_id?`<button class="delete" onclick="delPost('${p.id}')">DELETE POST</button>`:''}<div class="replies">${rs.map(r=>`<div class="reply"><b>↳ ${esc(r.author_name||'Member')}</b> <span class="who">${new Date(r.created_at).toLocaleString()}</span><div class="postbody">${esc(r.body)}</div><div class="media">${mediaHTML(r.media)}</div>${me&&me.id===r.author_id?`<button class="delete" onclick="delReply('${r.id}')">DELETE</button>`:''}</div>`).join('')}</div>${me?`<div class="replybox"><input id="reply-${p.id}" placeholder="Write a reply…"><button onclick="reply('${p.id}')">REPLY</button></div>`:`<a class="login" href="account.html?next=community.html">SIGN IN TO REPLY</a>`}</article>`}).join(''):'<p>No posts yet. Start the first conversation.</p>'}window.reply=async id=>{const el=$('reply-'+id),body=el.value.trim();if(!body)return;el.disabled=true;const r=await db.from('tfh_community_replies').insert({post_id:id,author_id:me.id,author_name:name(me),body});if(r.error){alert(r.error.message);el.disabled=false;return}await load()};window.delPost=async id=>{if(!confirm('Delete this post?'))return;const r=await db.from('tfh_community_posts').delete().eq('id',id);if(r.error)alert(r.error.message);else load()};window.delReply=async id=>{if(!confirm('Delete this reply?'))return;const r=await db.from('tfh_community_replies').delete().eq('id',id);if(r.error)alert(r.error.message);else load()};$('post').onclick=async()=>{if(!me)return location.href='account.html?next=community.html';const body=$('body').value.trim(),title=$('title').value.trim(),files=[...$('files').files];if(!body&&!files.length)return $('status').textContent='Write something or add a photo/video first.';$('post').disabled=true;$('status').textContent=files.length?'Uploading media…':'Posting…';try{const media=files.length?await upload(files):[];const r=await db.from('tfh_community_posts').insert({author_id:me.id,author_name:name(me),title:title||null,body:body||'Shared media',category:'Community',media});if(r.error)throw r.error;$('title').value='';$('body').value='';$('files').value='';$('status').textContent='✓ Posted.';await load()}catch(e){$('status').textContent='Could not post: '+e.message}finally{$('post').disabled=false}};(async()=>{const u=await db.auth.getUser();me=u.data.user;if(!me)$('composer').innerHTML='<h2>Join the conversation</h2><p>Sign in to post, reply, and upload photos or videos.</p><a class="login" href="account.html?next=community.html">🔐 SIGN IN OR CREATE ACCOUNT</a>';await load();setInterval(load,15000)})();</script></body></html>
