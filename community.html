<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Community | TruckFixHub</title><meta name="theme-color" content="#07182e">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#102a49;font:16px/1.45 system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:auto;padding:14px 12px 95px}.top{display:flex;justify-content:space-between;align-items:center}.top a{font-weight:900;color:#123f72;text-decoration:none}
.hero,.composer,.post{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:17px;margin:12px 0}.hero{background:linear-gradient(145deg,#07182e,#123f72);color:#fff}
.hero h1{font-size:38px;line-height:1;margin:8px 0}.hero p{margin-bottom:4px;color:#e6edf5}
textarea,select{width:100%;font:inherit;border:1px solid #b8c7d6;border-radius:12px;padding:12px;background:#fff;margin:7px 0}textarea{min-height:105px;resize:vertical}
button{font:inherit;font-weight:900;border:0;border-radius:12px;padding:11px 14px}.primary{width:100%;background:#0b3768;color:#fff}.filters{display:flex;gap:7px;overflow:auto;padding:3px 0 7px}.filters button{white-space:nowrap;background:#fff;border:1px solid #b8c7d6;color:#123f72}.filters button.on{background:#0b3768;color:#fff}
.meta{font-size:13px;color:#65798d}.badge{display:inline-block;background:#eaf1f7;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:850}.solved{background:#e7f5eb;color:#176b36}
.body{font-size:17px;white-space:pre-wrap;margin:12px 0}.actions{display:flex;gap:8px;border-top:1px solid #e0e7ee;padding-top:10px}.actions button{flex:1;background:#f1f5f8;color:#123f72}.comments{margin-top:10px}.comment{background:#f4f7fa;border-radius:10px;padding:9px;margin:6px 0}.commentform{display:flex;gap:7px}.commentform input{min-width:0;flex:1;border:1px solid #b8c7d6;border-radius:10px;padding:10px;font:inherit}.commentform button{background:#0b3768;color:#fff}
.notice{text-align:center;color:#65798d;padding:18px}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182ef5;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}
.nav a{color:#fff;text-decoration:none;text-align:center;font-size:11px;font-weight:850}.nav b{display:block;font-size:20px}
</style></head><body><main>
<div class="top"><a href="index.html">← TruckFixHub</a><b>Drivers • Techs • Fleets</b></div>
<section class="hero"><div>TRUCKFIXHUB</div><h1>👥 Community</h1><p>Ask questions. Share experience. Help keep another truck moving.</p></section>
<section class="composer"><b>What's happening with your truck?</b>
<select id="cat"><option>Engine & Emissions</option><option>Electrical</option><option>Aftertreatment</option><option>Transmission</option><option>Brakes</option><option>Parts Help</option><option>Roadside Problems</option><option>Shop Talk</option><option selected>General Trucking</option></select>
<textarea id="body" maxlength="5000" placeholder="Ask a question, describe a problem, or share a tip…"></textarea>
<button class="primary" id="post">POST TO COMMUNITY</button><div id="postmsg" class="meta"></div></section>
<div class="filters"><button class="on" data-cat="all">All</button><button data-cat="Engine & Emissions">Engine</button><button data-cat="Aftertreatment">Emissions</button><button data-cat="Electrical">Electrical</button><button data-cat="Parts Help">Parts</button><button data-cat="Roadside Problems">Roadside</button><button data-cat="Shop Talk">Shop Talk</button></div>
<section id="feed"><div class="notice">Loading the community…</div></section>
</main>
<nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="fix-my-truck.html"><b>🚨</b>Repair</a><a href="community.html"><b>👥</b>Community</a><a href="repair-inbox.html"><b>🔔</b>Inbox</a><a href="my-garage.html"><b>🚛</b>Garage</a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80');
let user=null,filter='all',posts=[],comments=[],reactions=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=d=>{let s=Math.max(1,(Date.now()-new Date(d))/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'};
async function load(){
 const ses=await sb.auth.getSession(); user=ses.data.session?.user||null;
 const p=await sb.from('tfh_community_posts').select('*').order('created_at',{ascending:false}).limit(100); posts=p.data||[];
 const ids=posts.map(x=>x.id);
 if(ids.length){const c=await sb.from('tfh_community_comments').select('*').in('post_id',ids).order('created_at');comments=c.data||[];const r=await sb.from('tfh_community_reactions').select('*').in('post_id',ids);reactions=r.data||[]}
 render();
}
function render(){
 let a=posts.filter(p=>filter==='all'||p.category===filter);
 document.getElementById('feed').innerHTML=a.length?a.map(p=>{
  const cs=comments.filter(c=>c.post_id===p.id),rs=reactions.filter(r=>r.post_id===p.id),mine=user&&rs.some(r=>r.user_id===user.id);
  return `<article class="post"><div><span class="badge">${esc(p.category)}</span> ${p.solved?'<span class="badge solved">✓ SOLVED</span>':''}</div><div class="meta">TruckFixHub member • ${ago(p.created_at)}</div><div class="body">${esc(p.body)}</div><div class="actions"><button onclick="helpful('${p.id}')">${mine?'✓ ':''}👍 Helpful (${rs.length})</button>${user&&p.author_id===user.id?`<button onclick="solve('${p.id}',${!p.solved})">${p.solved?'Reopen':'✓ Mark Solved'}</button>`:''}</div><div class="comments">${cs.map(c=>`<div class="comment"><b>Member</b> <span class="meta">• ${ago(c.created_at)}</span><br>${esc(c.body)}</div>`).join('')}<form class="commentform" onsubmit="comment(event,'${p.id}')"><input maxlength="3000" placeholder="Write a reply…"><button>Reply</button></form></div></article>`
 }).join(''):'<div class="notice">No posts in this category yet. Start the conversation.</div>';
}
document.getElementById('post').onclick=async()=>{
 let body=document.getElementById('body').value.trim(),msg=document.getElementById('postmsg'); if(!user){msg.textContent='Sign in to TruckFixHub to post.';return} if(!body){msg.textContent='Write something first.';return}
 let {error}=await sb.from('tfh_community_posts').insert({author_id:user.id,category:document.getElementById('cat').value,body}); if(error){msg.textContent=error.message;return} document.getElementById('body').value='';msg.textContent='Posted!';await load();
};
async function comment(ev,id){ev.preventDefault();if(!user){alert('Sign in to reply.');return}let i=ev.target.querySelector('input'),body=i.value.trim();if(!body)return;let {error}=await sb.from('tfh_community_comments').insert({post_id:id,author_id:user.id,body});if(error){alert(error.message);return}i.value='';await load()}
async function helpful(id){if(!user){alert('Sign in to react.');return}let mine=reactions.find(r=>r.post_id===id&&r.user_id===user.id);if(mine)await sb.from('tfh_community_reactions').delete().eq('post_id',id).eq('user_id',user.id).eq('reaction','helpful');else await sb.from('tfh_community_reactions').insert({post_id:id,user_id:user.id,reaction:'helpful'});await load()}
async function solve(id,v){let {error}=await sb.from('tfh_community_posts').update({solved:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);await load()}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.cat;render()});
load();
</script></body></html>
