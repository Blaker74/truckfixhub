<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Appointments | TruckFixHub</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px system-ui}.w{max-width:850px;margin:auto;padding:18px 16px 90px}.hero,.card{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:20px;margin:12px 0}.hero{background:#07182e;color:#fff}.grid,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,textarea,select,button,.btn{width:100%;padding:12px;border:1px solid #9aabba;border-radius:11px;font:inherit}label{display:block;font-weight:850;margin:9px 0 4px}button,.btn{border:0;background:#0b3768;color:#fff;text-decoration:none;text-align:center;font-weight:900}.secondary{background:#e8eef5;color:#102a49}.green{background:#176b3a}.red{background:#9f2f2f}.repair{background:#b7c9dc;color:#07182e}.workspace{background:#176b3a}.remind{background:#e8eef5;color:#102a49}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tabs button.active{background:#07182e}.appt{border-left:5px solid #315e8a}.time{font-size:18px;font-weight:900}.small{font-size:13px;color:#60758b}.details{margin:7px 0}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182e;padding:8px}.nav a{color:#fff;text-align:center;text-decoration:none;font-size:11px}.nav b{display:block;font-size:20px}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="index.html">← Home</a><section class="hero"><h1>📅 Appointments & Reminders</h1><p>Customer, truck and repair history stay connected.</p></section><section id="notice" class="card">Checking your account…</section><section id="login" class="card" hidden><h2>🔐 Sign In</h2><input id="loginEmail" type="email" autocomplete="email" placeholder="Email"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" style="margin-top:8px"><button id="signin" style="margin-top:8px">Sign In</button><p id="loginmsg" class="small"></p></section><section id="app" hidden><section class="card"><h2>New Appointment</h2><div class="grid"><div><label>Customer / Fleet</label><select id="customer"><option value="">No customer selected</option></select></div><div><label>Truck</label><select id="truck"><option value="">No truck selected</option></select></div><div><label>Appointment / reason</label><input id="title"></div><div><label>Date & time</label><input id="starts" type="datetime-local"></div><div><label>Contact name</label><input id="contact"></div><div><label>Phone</label><input id="phone" type="tel"></div><div><label>Location / shop</label><input id="location"></div><div><label>Reminder</label><select id="reminder"><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="120">2 hours</option><option value="1440">1 day</option></select></div></div><label>Notes</label><textarea id="notes"></textarea><button id="save">＋ Save Appointment</button><p id="msg" class="small"></p></section><section class="card"><div class="tabs"><button data-tab="upcoming" class="active">Upcoming</button><button data-tab="today">Today</button><button data-tab="completed">Completed</button></div></section><div id="list"></div></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="fix-my-truck.html"><b>🚨</b>Repair</a><a href="customers.html"><b>👥</b>Customers</a><a href="appointments.html"><b>📅</b>Schedule</a><a href="my-garage.html"><b>🚛</b>Garage</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),$=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user,rows=[],trucks=[],customers=[],tab='upcoming';const customerName=id=>{const c=customers.find(x=>x.id===id);return c?(c.company||c.name):''},truckName=id=>{const t=trucks.find(x=>x.id===id);return t?[t.unit_number&&'Unit '+t.unit_number,t.year,t.make,t.model].filter(Boolean).join(' · '):''};function fillTrucks(){const cid=$('customer').value,available=cid?trucks.filter(t=>t.customer_id===cid):trucks;$('truck').innerHTML='<option value="">No truck selected</option>'+available.map(t=>`<option value="${t.id}">${esc(truckName(t.id))}</option>`).join('')}function filtered(){const now=new Date(),s=new Date(now.getFullYear(),now.getMonth(),now.getDate()),e=new Date(s);e.setDate(e.getDate()+1);if(tab==='completed')return rows.filter(x=>x.status==='completed');if(tab==='today')return rows.filter(x=>x.status==='scheduled'&&new Date(x.starts_at)>=s&&new Date(x.starts_at)<e);return rows.filter(x=>x.status==='scheduled'&&new Date(x.starts_at)>=now)}function reminderText(x){const when=new Date(x.starts_at).toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),who=x.contact_name?x.contact_name+', ':'';let s=who+'this is a TruckFixHub appointment reminder for '+x.title+' on '+when+'.';if(x.location)s+=' Location: '+x.location+'.';const tn=truckName(x.truck_id);if(tn)s+=' Truck: '+tn+'.';return s+' Please contact us if you need to make a change.'}window.sendReminder=async id=>{const x=rows.find(v=>v.id===id);if(!x)return;const text=reminderText(x);if(navigator.share){try{await navigator.share({title:'TruckFixHub Appointment Reminder',text});return}catch(e){if(e.name==='AbortError')return}}if(x.phone){location.href='sms:'+encodeURIComponent(x.phone)+'?&body='+encodeURIComponent(text);return}try{await navigator.clipboard.writeText(text);alert('Reminder copied. Paste it into a text or message.')}catch(e){prompt('Copy this appointment reminder:',text)}};function render(){const a=filtered().sort((x,y)=>new Date(x.starts_at)-new Date(y.starts_at));$('list').innerHTML=a.length?a.map(x=>`<section class="card appt"><div class="time">${new Date(x.starts_at).toLocaleString()}</div><h3>${esc(x.title)}</h3><div class="details">${x.customer_id?'<div>👥 '+esc(customerName(x.customer_id))+'</div>':''}${x.truck_id?'<div>🚛 '+esc(truckName(x.truck_id))+'</div>':''}${x.contact_name?'<div>👤 '+esc(x.contact_name)+'</div>':''}${x.phone?'<div>📱 '+esc(x.phone)+'</div>':''}${x.location?'<div>📍 '+esc(x.location)+'</div>':''}</div><div class="actions"><button class="remind" onclick="sendReminder('${x.id}')">📲 Send Reminder</button>${x.repair_job_id?`<a class="btn workspace" href="repair-workspace.html?job=${x.repair_job_id}">🔧 Open Repair Workspace</a>`:`<button class="repair" onclick="startRepair('${x.id}')">🚛 Start Repair Job</button>`}<button onclick="completeAppt('${x.id}')">✓ Complete</button></div></section>`).join(''):'<section class="card small">No appointments in this view.</section>'}async function loadData(){const rs=await Promise.all([db.from('tfh_appointments').select('*').order('starts_at'),db.from('tfh_trucks').select('id,customer_id,unit_number,year,make,model'),db.from('tfh_customers').select('id,name,company,phone,email').order('name')]);[rows,trucks,customers]=rs.map(r=>r.data||[]);$('customer').innerHTML='<option value="">No customer selected</option>'+customers.map(c=>`<option value="${c.id}">${esc(c.company||c.name)}</option>`).join('');fillTrucks();$('notice').hidden=true;$('login').hidden=true;$('app').hidden=false;render()}async function load(){try{const u=await db.auth.getUser();user=u.data.user;if(!user){$('notice').hidden=true;$('login').hidden=false;return}await loadData()}catch(e){$('notice').hidden=true;$('login').hidden=false;$('loginmsg').textContent='Could not check your session. Please sign in.'}}$('signin').onclick=async()=>{if(!$('loginEmail').value.trim()||!$('loginPassword').value)return $('loginmsg').textContent='Enter your email and password.';$('signin').disabled=true;$('loginmsg').textContent='Signing in…';try{const r=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(r.error)return $('loginmsg').textContent='Sign in failed: '+r.error.message;user=r.data.user;$('loginPassword').value='';await loadData()}catch(e){$('loginmsg').textContent=e.message||'Sign in failed.'}finally{$('signin').disabled=false}};$('customer').onchange=()=>{const c=customers.find(x=>x.id===$('customer').value);if(c){$('contact').value=c.name||'';$('phone').value=c.phone||''}fillTrucks()};$('truck').onchange=()=>{const t=trucks.find(x=>x.id===$('truck').value);if(t?.customer_id){$('customer').value=t.customer_id;const c=customers.find(x=>x.id===t.customer_id);if(c){$('contact').value=c.name||'';$('phone').value=c.phone||''}}};$('save').onclick=async()=>{if(!$('title').value.trim()||!$('starts').value)return $('msg').textContent='Appointment and date/time are required.';const r=await db.from('tfh_appointments').insert({user_id:user.id,customer_id:$('customer').value||null,truck_id:$('truck').value||null,title:$('title').value.trim(),contact_name:$('contact').value.trim()||null,phone:$('phone').value.trim()||null,location:$('location').value.trim()||null,starts_at:new Date($('starts').value).toISOString(),duration_minutes:60,reminder_minutes:+$('reminder').value,notes:$('notes').value.trim()||null}).select().single();if(r.error)return $('msg').textContent=r.error.message;rows.push(r.data);$('msg').textContent='✓ Appointment linked and saved. Use Send Reminder on the appointment card when you are ready to contact the customer.';render()};window.startRepair=async id=>{const r=await db.rpc('tfh_start_repair_from_appointment',{p_appointment_id:id});if(r.error)return alert(r.error.message);location.href='repair-workspace.html?job='+r.data};window.completeAppt=async id=>{await db.from('tfh_appointments').update({status:'completed'}).eq('id',id);const x=rows.find(v=>v.id===id);if(x)x.status='completed';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});load();</script><script src="/truckfixhub-hospitality.js"></script></body></html>
