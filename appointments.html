<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Appointments | TruckFixHub 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px/1.45 system-ui,-apple-system,sans-serif}.w{max-width:850px;margin:auto;padding:16px 16px 90px}.hero,.card{background:#fff;border:1px solid #c7d2df;border-radius:18px;padding:20px;margin:12px 0}.hero{background:linear-gradient(145deg,#07182e,#123f72);color:#fff}.grid,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,textarea,select,button,.btn{width:100%;padding:12px;border:1px solid #9aabba;border-radius:11px;font:inherit}label{display:block;font-weight:850;margin:9px 0 4px}button,.btn{border:0;background:#0b3768;color:#fff;text-decoration:none;text-align:center;font-weight:900}.secondary{background:#e8eef5;color:#102a49}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tabs button.active{background:#07182e}.appt{border-left:5px solid #315e8a}.time{font-size:18px;font-weight:900}.small{font-size:13px;color:#60758b}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182e;padding:8px}.nav a{color:#fff;text-align:center;text-decoration:none;font-size:11px}.nav b{display:block;font-size:20px}@media(max-width:600px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="index.html">← TruckFixHub</a><section class="hero"><div>PRIVATE SCHEDULE</div><h1>📅 Appointments</h1><p>Keep customer visits connected to the right truck and repair history.</p></section><section id="notice" class="card">Checking your account…</section><section id="login" class="card" hidden><h2>🔐 Sign In</h2><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button id="signin">Sign In</button><p id="loginmsg" class="small"></p></section><section id="app" hidden><section class="card"><h2>New Appointment</h2><div class="grid"><div><label>Customer / Fleet</label><select id="customer"><option value="">No customer selected</option></select></div><div><label>Truck</label><select id="truck"><option value="">No truck selected</option></select></div><div><label>Reason</label><input id="title"></div><div><label>Date & time</label><input id="starts" type="datetime-local"></div><div><label>Contact</label><input id="contact"></div><div><label>Phone</label><input id="phone" type="tel"></div><div><label>Location / shop</label><input id="location"></div><div><label>Reminder</label><select id="reminder"><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="120">2 hours</option><option value="1440">1 day</option></select></div></div><label>Notes</label><textarea id="notes" rows="3"></textarea><button id="save">＋ Save Appointment</button><p id="msg" class="small"></p></section><section class="card"><div class="tabs"><button data-tab="upcoming" class="active">Upcoming</button><button data-tab="today">Today</button><button data-tab="completed">Completed</button></div></section><div id="list"></div></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="customers.html"><b>👥</b>Customers</a><a href="my-garage.html"><b>🚛</b>VINs</a><a href="repair-inbox.html"><b>🔔</b>Repairs</a><a href="appointments.html"><b>📅</b>Schedule</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),$=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user,rows=[],trucks=[],customers=[],tab='upcoming';const v=x=>$(x).value.trim(),cname=id=>{const c=customers.find(x=>x.id===id);return c?(c.company||c.name):''},tname=id=>{const t=trucks.find(x=>x.id===id);return t?[t.unit_number&&'Unit '+t.unit_number,t.year,t.make,t.model].filter(Boolean).join(' · '):''};function fillTrucks(){const cid=$('customer').value,a=cid?trucks.filter(t=>t.customer_id===cid):trucks;$('truck').innerHTML='<option value="">No truck selected</option>'+a.map(t=>`<option value="${t.id}">${esc(tname(t.id))}</option>`).join('')}function filtered(){const now=new Date(),s=new Date(now.getFullYear(),now.getMonth(),now.getDate()),e=new Date(s);e.setDate(e.getDate()+1);if(tab==='completed')return rows.filter(x=>x.status==='completed');if(tab==='today')return rows.filter(x=>x.status!=='completed'&&new Date(x.starts_at)>=s&&new Date(x.starts_at)<e);return rows.filter(x=>x.status!=='completed'&&new Date(x.starts_at)>=now)}function render(){const a=filtered().sort((x,y)=>new Date(x.starts_at)-new Date(y.starts_at));$('list').innerHTML=a.length?a.map(x=>`<section class="card appt"><div class="time">${new Date(x.starts_at).toLocaleString()}</div><h3>${esc(x.title)}</h3>${x.customer_id?`<div>👥 ${esc(cname(x.customer_id))}</div>`:''}${x.truck_id?`<div>🚛 ${esc(tname(x.truck_id))}</div>`:''}${x.contact_name?`<div>👤 ${esc(x.contact_name)}</div>`:''}${x.location?`<div>📍 ${esc(x.location)}</div>`:''}${x.notes?`<p class="small">${esc(x.notes)}</p>`:''}<div class="actions">${x.repair_job_id?`<a class="btn" href="repair-workspace.html?job=${x.repair_job_id}">🔧 Open Repair</a>`:`<a class="btn" href="fix-my-truck.html${x.truck_id?'?truck='+encodeURIComponent(x.truck_id):x.customer_id?'?customer='+encodeURIComponent(x.customer_id):''}">🔧 Start Repair</a>`}<button class="secondary" data-complete="${x.id}">✓ Complete</button></div></section>`).join(''):'<section class="card small">No appointments in this view.</section>'}async function loadData(){const rs=await Promise.all([db.from('tfh_appointments').select('*').eq('user_id',user.id).order('starts_at'),db.from('tfh_trucks').select('id,customer_id,unit_number,year,make,model').eq('user_id',user.id),db.from('tfh_customers').select('id,name,company,phone').eq('user_id',user.id).order('name')]);const err=rs.find(r=>r.error)?.error;if(err){$('notice').textContent='Could not load schedule: '+err.message;return}[rows,trucks,customers]=rs.map(r=>r.data||[]);$('customer').innerHTML='<option value="">No customer selected</option>'+customers.map(c=>`<option value="${c.id}">${esc(c.company||c.name)}</option>`).join('');const p=new URLSearchParams(location.search),cid=p.get('customer'),tid=p.get('truck');if(cid&&customers.some(c=>c.id===cid))$('customer').value=cid;fillTrucks();if(tid&&trucks.some(t=>t.id===tid)){$('truck').value=tid;const t=trucks.find(x=>x.id===tid);if(t.customer_id)$('customer').value=t.customer_id;fillTrucks();$('truck').value=tid}$('notice').hidden=true;$('login').hidden=true;$('app').hidden=false;render()}async function start(){const r=await db.auth.getUser();user=r.data.user;if(!user){$('notice').hidden=true;$('login').hidden=false;return}loadData()}$('signin').onclick=async()=>{const r=await db.auth.signInWithPassword({email:v('loginEmail'),password:$('loginPassword').value});if(r.error)return $('loginmsg').textContent='Sign in failed: '+r.error.message;user=r.data.user;loadData()};$('customer').onchange=()=>{const c=customers.find(x=>x.id===$('customer').value);if(c){$('contact').value=c.name||'';$('phone').value=c.phone||''}fillTrucks()};$('truck').onchange=()=>{const t=trucks.find(x=>x.id===$('truck').value);if(t?.customer_id){$('customer').value=t.customer_id;const c=customers.find(x=>x.id===t.customer_id);if(c){$('contact').value=c.name||'';$('phone').value=c.phone||''}}};$('save').onclick=async()=>{if(!v('title')||!$('starts').value)return $('msg').textContent='Reason and date/time are required.';const r=await db.from('tfh_appointments').insert({user_id:user.id,customer_id:$('customer').value||null,truck_id:$('truck').value||null,title:v('title'),contact_name:v('contact')||null,phone:v('phone')||null,location:v('location')||null,starts_at:new Date($('starts').value).toISOString(),duration_minutes:60,reminder_minutes:Number($('reminder').value),status:'scheduled',notes:v('notes')||null}).select().single();if(r.error)return $('msg').textContent='Could not save appointment: '+r.error.message;rows.push(r.data);$('msg').textContent='✓ Appointment saved and linked.';render()};$('list').onclick=async e=>{const b=e.target.closest('[data-complete]');if(!b)return;const r=await db.from('tfh_appointments').update({status:'completed'}).eq('id',b.dataset.complete).eq('user_id',user.id).select('id').single();if(r.error)return alert(r.error.message);const x=rows.find(v=>v.id===b.dataset.complete);if(x)x.status='completed';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});start();</script></body></html>
