<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Trucks | TruckFixHub 2</title><link rel="stylesheet" href="app.css"><style>.box{background:#fff;color:#12345a;border:5px solid #159cff;border-radius:18px;padding:14px;margin:12px 0}input{width:100%;font-size:18px;padding:12px;margin:5px 0;border:2px solid #789;border-radius:9px}button{width:100%;padding:14px;background:#176ac2;color:#fff;border:0;border-radius:10px;font-size:19px;font-weight:900}.truckitem{padding:13px;border-bottom:2px solid #ccd}.del{width:auto;background:#c92828;padding:7px 10px;float:right}</style></head><body><main class="wrap"><nav class="bottom"><a href="index.html">← HOME</a><a href="#add">➕ ADD TRUCK</a><a href="learn.html">🛠️ HELP</a></nav><section class="prompt"><h2>🚚 MY TRUCKS</h2><p>Keep the truck information you use most.</p></section><section class="box" id="add"><input id="name" placeholder="Truck name / unit number"><input id="vin" maxlength="17" placeholder="17-digit VIN"><input id="year" placeholder="Year"><input id="make" placeholder="Make"><input id="model" placeholder="Model"><input id="engine" placeholder="Engine"><input id="notes" placeholder="Notes"><button onclick="addTruck()">➕ SAVE TRUCK</button></section><section class="box"><div id="trucks"></div></section></main><script>const K='tfh2_trucks';let data=JSON.parse(localStorage.getItem(K)||'[]');function addTruck(){let t={id:Date.now(),name:name.value.trim(),vin:vin.value.trim().toUpperCase(),year:year.value.trim(),make:make.value.trim(),model:model.value.trim(),engine:engine.value.trim(),notes:notes.value.trim()};if(!t.name&&!t.vin)return;data.unshift(t);localStorage.setItem(K,JSON.stringify(data));document.querySelectorAll('#add input').forEach(x=>x.value='');render()}function del(id){data=data.filter(x=>x.id!==id);localStorage.setItem(K,JSON.stringify(data));render()}function render(){trucks.innerHTML=data.map(t=>`<div class="truckitem"><button class="del" onclick="del(${t.id})">DELETE</button><b>${t.name||'MY TRUCK'}</b><br>${t.year} ${t.make} ${t.model}<br>VIN: ${t.vin||'-'}<br>Engine: ${t.engine||'-'}<br><small>${t.notes||''}</small></div>`).join('')||'<p>No trucks saved yet.</p>'}render()</script></body></html>
