<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Parts Room | TruckFixHub 2</title><link rel="stylesheet" href="app.css"><style>.box{background:#fff;color:#12345a;border:5px solid #159cff;border-radius:18px;padding:14px;margin:12px 0}input{width:100%;font-size:18px;padding:12px;margin:5px 0;border:2px solid #789;border-radius:9px}button{width:100%;padding:14px;background:#178b48;color:#fff;border:0;border-radius:10px;font-size:19px;font-weight:900}.item{padding:12px;border-bottom:2px solid #ccd}.del{width:auto;background:#c92828;padding:7px 10px;float:right}</style></head><body><main class="wrap"><nav class="bottom"><a href="index.html">← HOME</a><a href="#add">➕ ADD PART</a><a href="#list">📦 MY PARTS</a></nav><section class="prompt"><h2>📦 MY PARTS ROOM</h2><p>Add it. Find it. Know where it is.</p></section><section class="box" id="add"><input id="pn" placeholder="Part number"><input id="desc" placeholder="Description"><input id="qty" type="number" placeholder="Quantity"><input id="loc" placeholder="Location / bin"><input id="vendor" placeholder="Vendor"><input id="cost" placeholder="Cost"><input id="sell" placeholder="Selling price"><input id="notes" placeholder="Notes"><button onclick="addPart()">➕ SAVE PART</button></section><section class="box" id="list"><input id="search" placeholder="🔎 Search my parts" oninput="render()"><div id="items"></div></section></main><script>const K='tfh2_parts';let parts=JSON.parse(localStorage.getItem(K)||'[]');function addPart(){let p={id:Date.now(),pn:pn.value.trim(),desc:desc.value.trim(),qty:qty.value||0,loc:loc.value.trim(),vendor:vendor.value.trim(),cost:cost.value.trim(),sell:sell.value.trim(),notes:notes.value.trim()};if(!p.pn&&!p.desc)return;parts.unshift(p);localStorage.setItem(K,JSON.stringify(parts));document.querySelectorAll('#add input').forEach(x=>x.value='');render()}function del(id){parts=parts.filter(x=>x.id!==id);localStorage.setItem(K,JSON.stringify(parts));render()}function render(){let q=(search.value||'').toLowerCase();items.innerHTML=parts.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).map(p=>`<div class="item"><button class="del" onclick="del(${p.id})">DELETE</button><b>${p.pn||'No part #'}</b><br>${p.desc||''}<br>Qty: ${p.qty} · Bin: ${p.loc||'-'}<br><small>${p.vendor||''} ${p.notes||''}</small></div>`).join('')||'<p>No saved parts yet.</p>'}render()</script></body></html>
