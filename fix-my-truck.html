<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>New Repair | TruckFixHub 2.0</title><meta name="theme-color" content="#07182e"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#102a49;font:16px/1.45 system-ui,-apple-system,sans-serif}main{max-width:850px;margin:auto;padding:16px 16px 90px}.hero,.card{background:#fff;border:1px solid #c7d2df;border-radius:19px;padding:21px;margin-bottom:15px}.hero{background:linear-gradient(145deg,#07182e,#123f72);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:850;display:block;margin:7px 0 5px}input,select,textarea,button{width:100%;padding:13px;border:1px solid #9aabba;border-radius:12px;font:inherit}button{border:0;background:#0b3768;color:#fff;font-weight:900}.small{font-size:13px;color:#60758b}.linked{background:#edf7f0;border-left:5px solid #176b3a}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#07182e;padding:8px}.nav a{color:#fff;text-align:center;text-decoration:none;font-size:11px}.nav b{display:block;font-size:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><a href="index.html">← TruckFixHub</a><section class="hero"><div>TRUCKFIXHUB 2.0</div><h1>🔧 New Repair / Order</h1><p>Start with a saved truck when possible. TruckFixHub carries the truck and customer relationship into the repair record.</p></section><section id="auth" class="card">Checking your private workspace…</section><section id="form" hidden><section class="card"><h2>1. Choose the truck</h2><label>Saved truck</label><select id="truck"><option value="">Enter truck manually</option></select><div id="linked" class="linked card" hidden></div><div class="grid"><div><label>Unit</label><input id="unit"></div><div><label>VIN</label><input id="vin" maxlength="17"></div><div><label>Engine</label><input id="engine"></div><div><label>Engine Serial</label><input id="esn"></div><div><label>Mileage</label><input id="mileage" inputmode="numeric"></div><div><label>Safety</label><select id="safety"><option>Safely parked</option><option>Brake / air failure</option><option>Fire / fuel leak</option><option>Steering / control</option><option>Overheat / oil pressure</option><option>Other problem</option></select></div></div></section><section class="card"><h2>2. Record the problem</h2><label>System / problem</label><select id="system"><option>DPF / DEF / SCR / derate</option><option>No-start / hard-start</option><option>Electrical / ECM / CPC / TCM</option><option>Overheating / coolant</option><option>Air system / brakes</option><option>Fuel / low power</option><option>Transmission / driveline</option><option>Parts / order request</option><option>Other</option></select><label>SPN / FMI / fault code</label><input id="code"><label>Symptoms / request</label><textarea id="symptoms" rows="5"></textarea><label>Recent work or useful context</label><textarea id="recent" rows="3"></textarea><button id="create">Create Private Repair Job →</button><p id="msg" class="small"></p></section></section></main><nav class="nav"><a href="index.html"><b>⌂</b>Home</a><a href="customers.html"><b>👥</b>Customers</a><a href="my-garage.html"><b>🚛</b>VINs</a><a href="repair-inbox.html"><b>🔔</b>Inbox</a><a href="appointments.html"><b>📅</b>Schedule</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://bncqcdlzmawlmfworalq.supabase.co','sb_publishable_yz-vrCD_has1enE2Zh5qyQ_IAz7gk80'),$=x=>document.getElementById(x);let user,trucks=[],customers=[];const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=x=>$(x).value.trim();function customerName(id){const c=customers.find(x=>x.id===id);return c?(c.company||c.name):''}function fillTruck(){const t=trucks.find(x=>x.id===$('truck').value);if(!t){$('linked').hidden=true;return}$('unit').value=t.unit_number||'';$('vin').value=t.vin||'';$('engine').value=t.engine||'';$('esn').value=t.engine_serial||'';$('mileage').value=t.mileage??'';const cn=customerName(t.customer_id);$('linked').hidden=false;$('linked').innerHTML='<b>✓ Saved truck linked</b><br>'+esc([t.unit_number&&'Unit '+t.unit_number,t.year,t.make,t.model,t.engine].filter(Boolean).join(' · '))+(cn?'<br><b>Customer:</b> '+esc(cn):'')+'<br><span class="small">The repair will stay connected to this truck'+(cn?' and customer':'')+' for future history.</span>'}async function start(){const a=await db.auth.getUser();user=a.data.user;if(!user){$('auth').innerHTML='<b>🔐 Sign in required.</b><p>This repair workspace is private. Sign in through My VINs or My Customers, then return here.</p>';return}const [t,c]=await Promise.all([db.from('tfh_trucks').select('id,customer_id,unit_number,vin,year,make,model,engine,engine_serial,mileage').order('unit_number'),db.from('tfh_customers').select('id,name,company').order('name')]);if(t.error||c.error){$('auth').textContent='Could not load your private trucks: '+(t.error?.message||c.error?.message);return}trucks=t.data||[];customers=c.data||[];$('truck').innerHTML='<option value="">Enter truck manually</option>'+trucks.map(x=>'<option value="'+x.id+'">'+esc([x.unit_number&&'Unit '+x.unit_number,x.year,x.make,x.model,x.vin].filter(Boolean).join(' · '))+'</option>').join('');const requested=new URLSearchParams(location.search).get('truck');if(requested&&trucks.some(x=>x.id===requested)){$('truck').value=requested;fillTruck()}$('auth').hidden=true;$('form').hidden=false}$('truck').onchange=fillTruck;$('create').onclick=async()=>{if(!user)return;const vin=val('vin').toUpperCase();if(vin&&vin.length!==17){$('msg').textContent='VIN should be 17 characters.';return}const truck=trucks.find(x=>x.id===$('truck').value),m=val('mileage').replace(/[^0-9]/g,'');$('create').disabled=true;$('msg').textContent='Creating your private repair job…';const r=await db.rpc('tfh_create_repair_job',{p_unit_number:val('unit')||null,p_vin:vin||null,p_engine:val('engine')||null,p_engine_serial:val('esn')||null,p_mileage:m?Number(m):null,p_fault_code:val('code')||null,p_system_problem:$('system').value,p_symptoms:val('symptoms')||null,p_safety_status:$('safety').value,p_truck_id:truck?.id||null,p_customer_id:truck?.customer_id||null});if(r.error){$('msg').textContent='Could not create repair: '+r.error.message;$('create').disabled=false;return}const saved=Array.isArray(r.data)?r.data[0]:r.data;if(val('recent'))await db.from('tfh_repair_jobs').update({recent_context:val('recent')}).eq('id',saved.id).eq('owner_id',user.id);location.href='repair-workspace.html?job='+encodeURIComponent(saved.id)};start();</script></body></html>
